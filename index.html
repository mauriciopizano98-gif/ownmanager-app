function recalcular(){
  const c=S.corte; const max=S.config.maxLitrosTurno||8000; const tot={}; let ok=true;
  for(const l of c.lecturas){
    const lit=$('#lit-'+l.manguera), al=$('#al-'+l.manguera); if(!lit) continue;
    al.hidden=true; al.className='alert';
    if(l.omitida){ l.final=l.inicial; l.litros=0; tot[l.producto]=(tot[l.producto]||0); continue; }
    if(l.inicial==null||l.final==null){ l.litros=null; lit.textContent='—'; lit.className=''; ok=false; continue; }
    l.litros=Math.round((l.final-l.inicial)*1000)/1000; lit.textContent=fmtL(l.litros); lit.className=l.litros<0?'neg':'';
    if(l.litros<0){ al.hidden=false; al.classList.add('err'); al.textContent='La final es menor que la inicial. Revisa la foto o corrige la inicial (con motivo).'; ok=false; }
    else if(l.litros>max){ al.hidden=false; al.classList.add('warn'); al.textContent=`Más de ${fmtInt(max)} L en un turno. Confirma que la lectura sea correcta.`; }
    const mzEl=$('#mz-'+l.manguera); if(mzEl) mzEl.hidden=l.litros!==0;
    if(l.litros===0){ al.hidden=false; al.classList.add('warn'); al.textContent=l.motivoCero?`Cero litros: ${l.motivoCero}. No afecta la calificación.`:'Cero litros: elige abajo por qué no vendió (mantenimiento, sin producto…). Puedes continuar de todos modos.'; }
    if(l.lecturaIA!=null && l.origen==='manual' && l.final!==l.lecturaIA){ al.hidden=false; if(!al.classList.contains('err')) al.classList.add('warn'); al.textContent=(al.textContent?al.textContent+' ':'')+`La IA leyó ${fmtL(l.lecturaIA)} en la foto.`; }
    if(l.inicialCorregida && !l.motivo){ ok=false; }
    tot[l.producto]=(tot[l.producto]||0)+l.litros;
  }
  const tb=$('#tot'); if(tb){ tb.innerHTML=''; for(const [p,v] of Object.entries(tot)) tb.append(h('div',{},h('span',{class:'small muted'},p),h('b',{},fmtL(v)))); if(!Object.keys(tot).length) tb.append(h('div',{},h('span',{class:'small muted'},'Captura las lecturas'),h('b',{},'—'))); }
  const btn=$('.btn.primary.big.block'); if(btn) btn.disabled=!ok;
  return ok;
}

// Si la pantalla responde rápido no aparece (sin parpadeo). Devuelve la función que lo apaga.
function omEsperaPantalla(main){
  const n=main.children.length; let l=null;
  const obs=new MutationObserver(()=>{ if([...main.children].filter(c=>c!==l).length>n){ clearTimeout(t); obs.disconnect(); if(l) l.remove(); } });
  const t=setTimeout(()=>{ if(!main.isConnected || main.children.length>n) return; l=h('div',{'data-om-espera':'1',style:'margin-top:26px'}, omLoader({tam:'medio', texto:'Cargando…'})); main.append(l); }, 250);
  obs.observe(main,{childList:true});
  return ()=>{ clearTimeout(t); obs.disconnect(); if(l) l.remove(); };
}

// ---- NOTIFICACIONES EN EL TELÉFONO (APK) (17-nov-2026)
// Qué se avisa lo decide la base (migración 049) y lo entrega la función "notificar" por Firebase. Aquí solo:
//   1) se registra el teléfono a nombre de la cuenta que entró (solo en la APK que ya trae notificaciones; en la anterior no hace nada),
//   2) si el aviso llega con la app abierta se muestra como franja arriba (en un teléfono fijo en la app no se ve la barra de Android),
//   3) al tocar el aviso se abre la pantalla que corresponde.
// Además, en los celulares del Kiosko el aviso "faltan 5 minutos para el corte" se muestra con el reloj del propio teléfono,
// así funciona aunque Firebase no esté configurado; la clave evita mostrarlo dos veces si también llega por Firebase.
const PUSH={ plugin:null, oyentes:false, token:null, vistos:{} };
function cargarScript(src){ return new Promise((ok,mal)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>mal(new Error('No se pudo cargar '+src)); document.head.append(s); }); }
// ── Archivos en el teléfono (APK) ───────────────────────────────────────────────────────────────────────────
// En la APK la página corre en un visor web que no descarga archivos armados en memoria, no abre pestañas y no trae
// lector de PDF: los botones de PDF "generaban" y no pasaba nada. Ahí el archivo se guarda en la carpeta temporal de
// la app y se abre de inmediato con el lector del teléfono (decisión de Mauricio, 18-nov-2026). Hace falta la APK 1.3.0
// (complementos Filesystem y FileOpener); con una APK anterior se avisa en claro. En un navegador nada cambia.
const APKF={};
function apkPuedeArchivos(){ try{ const C=window.Capacitor; return !!(esApk() && C && typeof C.isPluginAvailable==='function' && C.isPluginAvailable('Filesystem') && C.isPluginAvailable('FileOpener')); }catch(_){ return false; } }
function nombreDeArchivo(n, mime){ let t=String(n||'archivo').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9._-]+/g,'_').replace(/^[_.]+|_+$/g,'').slice(-90)||'archivo';
  if(!/\.[A-Za-z0-9]{2,5}$/.test(t)){ const ext={'application/pdf':'pdf','image/jpeg':'jpg','image/png':'png','image/webp':'webp','text/xml':'xml','application/xml':'xml'}[String(mime||'').split(';')[0]]; if(ext) t+='.'+ext; }
  return t; }
async function apkAbrirArchivo(blob, nombre, mime){
  if(!apkPuedeArchivos()){ aviso('Para abrir archivos en el teléfono hace falta la versión nueva de la app OwnManager.','err',12000,'Archivo'); return false; }
  mime=String(mime||blob.type||'application/pdf').split(';')[0]||'application/pdf';
  if(!window.capacitorExports) await cargarScript('vendor/capacitor-6.2.1.js');
  const comp=n=>APKF[n]||(APKF[n]=window.capacitorExports.registerPlugin(n));
  const w=await comp('Filesystem').writeFile({ path:'OwnManager/'+nombreDeArchivo(nombre,mime), data:await archivoABase64(blob), directory:'CACHE', recursive:true });
  try{ await comp('FileOpener').open({ filePath:w.uri, contentType:mime, openWithDefault:true }); return true; }
  catch(e){ // el teléfono no tiene con qué abrirlo: se ofrece compartirlo o guardarlo
    if(window.Capacitor.isPluginAvailable('Share')){ try{ await comp('Share').share({ title:nombreDeArchivo(nombre,mime), url:w.uri, dialogTitle:'Abrir o compartir' }); }catch(_){} return true; }
    throw new Error('El teléfono no tiene una app para abrir este archivo.'); }
}
// Entrega un archivo que ya está en memoria: en la APK se abre con el lector del teléfono; en un navegador se descarga como siempre.
async function entregarBlob(blob, nombre){
  if(esApk()) return apkAbrirArchivo(blob, nombre, blob.type);
  const url=URL.createObjectURL(blob); const a=h('a',{href:url,download:nombre}); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000); return true; }
function blobDeBase64(b64, mime){ const bin=atob(b64); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); return new Blob([u8],{type:mime||'application/pdf'}); }
// Abre una dirección (foto o documento) en pestaña nueva; en la APK la baja y la abre con el visor del teléfono.
async function abrirUrl(url, nombre){
  if(!esApk()){ window.open(url,'_blank'); return; }
  try{ const r=await fetch(url); if(!r.ok) throw new Error('No se pudo bajar el archivo ('+r.status+').'); const b=await r.blob(); await apkAbrirArchivo(b, nombre||'archivo', b.type); }
  catch(e){ aviso(e.message||'No se pudo abrir el archivo.','err',8000,'Archivo'); } }
window.__archivos={ entregarBlob, abrirUrl, apkPuedeArchivos, nombreDeArchivo, ver:(id,o)=>verArchivo(id,o) };   // gancho para las pruebas
async function pushIniciar(){
  try{ const C=window.Capacitor; if(!esApk() || !C || typeof C.isPluginAvailable!=='function' || !C.isPluginAvailable('PushNotifications')) return; // navegador o APK anterior
    if(!window.capacitorExports) await cargarScript('vendor/capacitor-6.2.1.js');
    const P=PUSH.plugin||(PUSH.plugin=window.capacitorExports.registerPlugin('PushNotifications'));
    if(!PUSH.oyentes){ PUSH.oyentes=true;
      P.addListener('registration', t=>{ PUSH.token=t&&t.value; pushGuardar(); });
      P.addListener('registrationError', e=>console.warn('notificaciones', e));
      P.addListener('pushNotificationReceived', n=>{ const d=(n&&n.data)||{}; pushFranja({ titulo:n.title||d.titulo, cuerpo:n.body||d.cuerpo, datos:d, clave:d.tipo==='corte_proximo'? 'corte:'+d.fin : d.aviso }); });
      P.addListener('pushNotificationActionPerformed', a=>pushAbrir(((a&&a.notification&&a.notification.data))||{})); }
    let p=await P.checkPermissions(); if(p.receive!=='granted' && p.receive!=='denied') p=await P.requestPermissions();
    if(p.receive!=='granted') return;
    if(PUSH.token) pushGuardar(); else await P.register();
  }catch(e){ console.warn('notificaciones', e); }
}

async function cargarTareas(tabla){ tabla=tabla||'tareas';
  if(tabla==='tareas'){ try{ await sb.rpc('generar_tareas_hoy',{p_estacion:null}); }catch(e){} } // las rutinas de hoy, por si la tarea programada no ha corrido
  const q=()=>{ let x=sb.from(tabla).select('*'); if(tabla==='tareas') x=x.neq('estado','cancelada'); return x; };
  if(esLogistica()) return await sel(q().eq('para_rol','logistica').order('creada_en',{ascending:false}).limit(120)); // sus tareas no llevan gasolinera
  let rows=await sel(q().eq('estacion_id',S.config.estacionId).order('creada_en',{ascending:false}).limit(120));
  if(esCentral()) for(const r of ['central','logistica']) rows=rows.concat(await sel(q().eq('para_rol',r).order('creada_en',{ascending:false}).limit(60)));
  const vistos=new Set(); return rows.filter(r=>!vistos.has(r.id)&&vistos.add(r.id)); }

// Elaborar tarea: el formulario y, debajo, lo que mandé o superviso (por revisar, pendientes, rutinas y aprobadas).

async function unionesDe(rows){
  if(!S.config || !S.config.nocheUnCorte || !rows || !rows.length) return rows;
  try{ const fs=rows.map(r=>r.fecha).filter(Boolean).sort(); if(!fs.length) return rows;
    const us=(await sel(sb.from('cortes_unidos').select('corte_id,isla_id,corte_isla_id').eq('estacion_id',S.config.estacionId).gte('fecha',fs[0]).lte('fecha',fs[fs.length-1])))||[];
    for(const r of rows){ const mias=us.filter(u=>u.corte_id===r.id); if(mias.length>1) r._islas=mias.map(u=>u.isla_id);
      const en=us.find(u=>u.corte_isla_id===r.id); if(en){ const pr=us.find(u=>u.corte_id===en.corte_id && !u.corte_isla_id); const i=pr&&S.config.islas.find(x=>x.uuid===pr.isla_id); r._unidaCorte=en.corte_id; r._unidaA=i?i.nombre:'otra isla'; } }
  }catch(e){}
  return rows;
}

// Parte la imagen en tramos a lo largo de su lado largo (un cierre de lote es muy largo): cada tramo a buen tamaño para leer, encimados un poco.

// Todo pasa por la función del servidor "registrar-comprobante" (IA + Drive + registrar_pago) y por las RPC
// buscar_pagos / crear_proveedor / anular_pago / resumen_proveedor, siempre como el usuario que entró.
const OF = { negocio:'', texto:'', desde:'', hasta:'', cuentas:null, wizard:null };
async function fnOficina(body, nombre='registrar-comprobante'){
  const { data:{ session } } = await sb.auth.getSession(); if(!session) throw new Error('Sesión vencida: vuelve a entrar.');
  omCarga(1);
  try{
    const r = await fetch(`${OM_CONFIG.SUPABASE_URL}/functions/v1/${nombre}`, { method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+session.access_token, apikey:OM_CONFIG.SUPABASE_KEY }, body:JSON.stringify(body) });
    let j = await r.json().catch(()=>null);
    if(!j || typeof j!=='object') j={ ok:false, error:'El servidor no respondió bien ('+r.status+').' };
    if(j.ok===undefined) j.ok=r.ok; if(!j.ok && !j.error) j.error='Error del servidor ('+r.status+').'; if(typeof j.error==='string') j.error=omSinPistas(j.error); return j;
  } finally{ omCarga(-1); }
}
async function cuentasOficina(force){
  if(OF.cuentas && !force) return OF.cuentas;
  const rows = await sel(sb.from('cuentas_bancarias').select('id, banco, alias, ultimos4, negocio_id, negocios(id, nombre, solo_estados)').eq('activa',true).order('alias'));
  OF.cuentas = rows.map(c=>({ id:c.id, banco:c.banco, alias:c.alias, ultimos4:c.ultimos4, negocioId:c.negocio_id, negocio:c.negocios?c.negocios.nombre:'', soloEstados:!!(c.negocios&&c.negocios.solo_estados) }));
  return OF.cuentas;
}
// Empresas que solo participan en estados de cuenta (radio, verificentro) no entran en facturas, pagos ni comprobantes.

function negociosOficina(cuentas){ const m={}; for(const c of cuentas) m[c.negocioId]=c.negocio; return Object.entries(m).map(([id,nombre])=>({id,nombre})).sort((a,b)=>a.nombre.localeCompare(b.nombre)); }

// ---- Archivos por la app: el servidor verifica permisos y el robot entrega el archivo (no hace falta cuenta de Google).
const ARCHIVOS_CACHE=new Map(); // drive_id → blob URL (mientras dure la sesión de la pestaña)
async function traerArchivo(driveId, descargar, fn){
  const { data:{ session } } = await sb.auth.getSession(); if(!session) throw new Error('Sesión vencida: vuelve a entrar.');
  const r=await fetch(`${OM_CONFIG.SUPABASE_URL}/functions/v1/${fn||'abrir-archivo'}`, { method:'POST',
    headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+session.access_token, apikey:OM_CONFIG.SUPABASE_KEY }, body:JSON.stringify({ accion:'abrir', drive_id:driveId, descargar:!!descargar }) });
  if(!r.ok){ let j=null; try{ j=await r.json(); }catch(e){} throw new Error((j&&j.error)||('No se pudo abrir el archivo ('+r.status+').')); }
  const blob=await r.blob(); let nombre='archivo'; try{ nombre=decodeURIComponent(r.headers.get('X-Nombre')||'')||nombre; }catch(e){}
  return { blob, nombre, mime:r.headers.get('Content-Type')||blob.type };
}
// Abrir en pestaña nueva (se abre en el clic para que el navegador no la bloquee) o descargar.
function verArchivo(driveId, o){
  o=o||{}; if(!driveId){ aviso('Este registro no tiene archivo.','err'); return; }
  if(esApk()){ // en el teléfono se baja y se abre con el lector
    (async()=>{ try{ if(apkPuedeArchivos()) toast('Abriendo el archivo…'); const a=apkPuedeArchivos()? await traerArchivo(driveId,false,o.fn) : null; await apkAbrirArchivo(a&&a.blob, (a&&a.nombre)||o.nombre||'archivo', a&&a.mime); }catch(e){ aviso(e.message||'No se pudo abrir el archivo.','err',10000,'Archivo'); } })(); return; }
  let win=null;
  if(!o.descargar){ win=window.open('','_blank'); if(win){ try{ win.document.title='OwnManager · abriendo…'; win.document.body.style.cssText='margin:0;display:flex;align-items:center;justify-content:center;height:100vh;font:500 15px system-ui;color:#64748B;background:#F8FAFC'; win.document.body.textContent='Abriendo el archivo…'; }catch(e){} } }
  (async()=>{
    try{
      let url=ARCHIVOS_CACHE.get(driveId), nombre=o.nombre||'archivo';
      if(!url){ const a=await traerArchivo(driveId,o.descargar,o.fn); url=URL.createObjectURL(a.blob); nombre=a.nombre||nombre; ARCHIVOS_CACHE.set(driveId,url); ARCHIVOS_CACHE.set(driveId+':nombre',nombre); }
      else nombre=ARCHIVOS_CACHE.get(driveId+':nombre')||nombre;
      if(o.descargar){ const a=h('a',{href:url,download:nombre}); document.body.append(a); a.click(); a.remove(); toast('Descargando '+nombre); }
      else if(win){ win.location.href=url; }
      else { window.open(url,'_blank'); }
    }catch(e){ if(win){ try{ win.close(); }catch(_){} } aviso(e.message||'No se pudo abrir el archivo.','err',10000,'Archivo'); }
  })();
}
function btnArchivo(driveId, texto, o){ o=o||{}; return h('button',{class:'btn sm ghost',title:o.title||texto,onclick:e=>{ e.stopPropagation(); verArchivo(driveId,o); }}, o.icono?ico(o.icono):null, texto); }

// ---- Filtros combinables (empresa + periodo) compartidos por todas las consultas
const FL={ negocio:'', periodo:'todo', mes:'', fecha:'' };
function rangoFiltro(){
  const hoy=nowMX().fecha; const [y,m]=hoy.split('-').map(Number);
  const mesDe=(yy,mm)=>({ desde:`${yy}-${String(mm).padStart(2,'0')}-01`, hasta:`${yy}-${String(mm).padStart(2,'0')}-${String(new Date(Date.UTC(yy,mm,0)).getUTCDate()).padStart(2,'0')}` });
  if(FL.periodo==='actual') return mesDe(y,m);
  if(FL.periodo==='pasado') return m===1?mesDe(y-1,12):mesDe(y,m-1);
  if(FL.periodo==='mes' && /^\d{4}-\d{2}$/.test(FL.mes)){ const [a,b]=FL.mes.split('-').map(Number); return mesDe(a,b); }
  if(FL.periodo==='fecha' && /^\d{4}-\d{2}-\d{2}$/.test(FL.fecha)) return { desde:FL.fecha, hasta:FL.fecha };
  return { desde:null, hasta:null };
}
function hayFiltros(){ return !!FL.negocio || (FL.periodo!=='todo' && (FL.periodo==='actual'||FL.periodo==='pasado'||(FL.periodo==='mes'&&FL.mes)||(FL.periodo==='fecha'&&FL.fecha))); }
function barraFiltros(negocios, opts){
  opts=opts||{}; const fila=h('div',{class:'filtros'});
  if(negocios && negocios.length>1){
    const sel=h('select',{class:FL.negocio?'on':'',title:'Empresa'}, h('option',{value:''},'Todas las empresas'), ...negocios.map(n=>h('option',{value:n.id,selected:n.id===FL.negocio},n.nombre)));
    sel.addEventListener('change',()=>{ FL.negocio=sel.value; render(); }); fila.append(sel);
  }
  if(!opts.sinPeriodo){
    const per=h('select',{class:FL.periodo!=='todo'?'on':'',title:'Periodo'}, ...[['todo','Cualquier fecha'],['actual','Mes actual'],['pasado','Mes pasado'],['mes','Elegir mes…'],['fecha','Fecha exacta…']].map(([v,l])=>h('option',{value:v,selected:v===FL.periodo},l)));
    per.addEventListener('change',()=>{ FL.periodo=per.value; if(per.value==='mes'&&!FL.mes) FL.mes=nowMX().fecha.slice(0,7); if(per.value==='fecha'&&!FL.fecha) FL.fecha=nowMX().fecha; render(); }); fila.append(per);
    if(FL.periodo==='mes'){ const im=h('input',{type:'month',value:FL.mes,class:'on'}); im.addEventListener('change',()=>{ FL.mes=im.value; render(); }); fila.append(im); }
    if(FL.periodo==='fecha'){ const idt=h('input',{type:'date',value:FL.fecha,class:'on'}); idt.addEventListener('change',()=>{ FL.fecha=idt.value; render(); }); fila.append(idt); }
  }
  if(hayFiltros()) fila.append(h('button',{class:'quitar',onclick:()=>{ FL.negocio=''; FL.periodo='todo'; FL.mes=''; FL.fecha=''; render(); }},'Quitar filtros'));
  return fila;
}

// ---- Paso 2: los datos del XML / la IA van bloqueados. "Editar" los abre, pero el registro queda marcado como editado.
function campoRO(label, inp, valor){
  // inp: el input real; valor: texto a mostrar cuando está bloqueado
  const ro=h('div',{class:'ro'}, valor==null||valor===''?'':String(valor));
  return { el:h('label',{class:'f'}, h('span',{class:'l'},label), ro, inp), ro, inp, set(bloqueado){ ro.style.display=bloqueado?'':'none'; inp.style.display=bloqueado?'none':''; } };
}
function bloqueoDatos(w, campos, que){
  // campos: [{...campoRO}] · que: 'factura' | 'pago'
  const nota=h('div',{class:'small',style:'display:flex;align-items:center;gap:8px;color:var(--muted)'});
  const btn=h('button',{class:'btn sm ghost',type:'button'}, ico(w.editando?'candado':'editar'), w.editando?'Dejar como estaba':'Editar');
  const aplicar=()=>{ for(const c of campos) c.set(!w.editando);
    nota.replaceChildren(ico(w.editando?'editar':'candado'), w.editando
      ? h('span',{style:'color:var(--warn)'},`Estás editando. Si cambias algún dato, ${que==='factura'?'la factura quedará marcada como editada':que==='estado'?'el estado quedará anotado como editado':'el pago quedará marcado como editado'} y se guardará qué cambió.`)
      : h('span',{},`Datos tomados ${que==='factura'?'del XML / lectura de IA':que==='estado'?'por la IA del estado de cuenta':'por la IA del comprobante'}. Solo confirma; si algo no coincide con el documento, usa Editar.`));
    btn.replaceChildren(ico(w.editando?'candado':'editar'), w.editando?'Dejar como estaba':'Editar'); };
  btn.addEventListener('click',()=>{ w.editando=!w.editando; if(!w.editando && w.original){ Object.assign(w.form, w.original); for(const c of campos){ if(c.reset) c.reset(); } } aplicar(); });
  aplicar();
  return { fila:h('div',{class:'row',style:'justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap'}, nota, btn) };
}

// ===== PAGOS DE CLIENTES (25-nov-2026) =====
// La oficina sube el comprobante que le manda el cliente (PDF, captura o foto de la hoja impresa); la IA lo lee y la app sugiere de qué cliente es.
// REGLA de Mauricio: el comprobante solo avisa. El pago cuenta cuando aparece en los movimientos del banco (lo liga la base, migración 063).
// Servidor: función "pago-cliente" (IA + Drive) y RPC pagos_clientes_lista / ligar_pagos_clientes / anular_pago_cliente. Solo el dueño anula.
const PC={ w:null, est:'', per:'mes', abre:null, datos:null, t:0, ligaT:0 };
const PC_PLAZO=3;   // días que tiene el pago para aparecer en el banco (25-nov-2026)
// 'banco' ya cayó · 'nocayo' venció su plazo y el banco ya está subido más allá de ese día · 'espera' lo demás (incluye: venció pero falta subir el banco)
// Semáforo (27-nov-2026): solo lo firme (transferencia o efectivo) cuenta al momento. Un cheque, o un abono que la app no reconoce, queda
// «por confirmar» 2 días hábiles; y si el banco regresa el depósito, el pago queda «devuelto». Sin esos datos (base anterior) todo sigue como antes.
function pcEstado(r){ if(r.en_banco) return r.devuelto? 'devuelto' : r.firme===false? 'confirmar' : 'banco'; return (r.banco_hasta && r.banco_hasta>addDays(r.fecha,PC_PLAZO))? 'nocayo' : 'espera'; }
const pcFirma = d => d.map(x=>x.id+(x.en_banco?'1':'0')+(x.banco_hasta||'')+(x.firme===false?'c':'')+(x.devuelto?'d':'')).join('|');
const pcQueEs = r => r.banco_clase==='cheque'? 'un cheque' : 'un movimiento que la app no reconoce como transferencia ni como efectivo';
const pcFaltaBase = e => !!e && (e.code==='PGRST202' || e.code==='42883' || /pagos_clientes_lista|schema cache/i.test(String((e.raw&&e.raw.message)||e.message||'')));
// En el navegador, una función que no existe (o que no arrancó) no llega como 404: el navegador corta la llamada y solo dice "Failed to fetch" (visto el 25-nov-2026).
const pcFaltaFuncion = j => !!j && (j.sinRespuesta || j.code==='NOT_FOUND' || /\(404\)|not found/i.test(String(j.error||j.message||'')));
const PC_SIN_FUNCION='No hubo respuesta del servidor. Revisa que haya internet y vuelve a intentar; si sigue igual, avísale a Mauricio.';
const pcMime = f => f.type || ({pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',heic:'image/heic',heif:'image/heif'})[(String(f.name||'').split('.').pop()||'').toLowerCase()] || '';
// ---- PAGOS DEL MES (26-nov-2026) ---------------------------------------------------------------
// Sustituye la hoja compartida donde cada oficina anotaba las facturas por pagar a fin de mes. Al revés que la hoja: todas las
// facturas del mes llegan solas a "Por revisar" y la oficina le dice a cada una qué se hace; con todo revisado entrega el cierre.
// Oficina: revisa y entrega su estación. Dueño: ve todo y también puede revisar. Contabilidad (central): solo ve.
const PM={ mes:null, datos:null, t:0, vista:'revisar', neg:'', abre:null, cambia:null, motivo:null, ocupado:false };
const PM_MOTIVO={ comisiones:'Comisiones', pagada:'Pagada', caja_chica:'Caja chica' };
const PM_CAJA_TOPE=2000;   // una factura de caja chica debe ser en efectivo y de no más de $2,000 (dicho por Mauricio)
const pmFaltaBase = e => !!e && (e.code==='PGRST202' || e.code==='42883' || /pagos_mes|schema cache/i.test(String((e.raw&&e.raw.message)||e.message||'')));
const pmDia = f => new Date(String(f).slice(0,10)+'T12:00:00Z').toLocaleDateString('es-MX',{timeZone:'UTC',day:'numeric',month:'short'}).replace('.','');   // "24 nov": corto, para que quepa en la tabla
const pmHora = t => new Date(t).toLocaleString('es-MX',{timeZone:TZ,day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const pmSugerido = s => !s? '' : s.destino==='pagar'? 'se paga este mes' : s.destino==='no_pago'? 'no requiere pago · '+(PM_MOTIVO[s.motivo]||'').toLowerCase() : '';
// Una factura de caja chica que no cumple: pasa del tope o el CFDI no dice que se pagó en efectivo (forma de pago 01).
const pmCajaMal = r => r.motivo==='caja_chica' && (Number(r.total)>PM_CAJA_TOPE? 'Pasa de '+fmtMXN(PM_CAJA_TOPE).replace(/\.00$/,'') : (r.forma_pago && r.forma_pago!=='01')? 'No dice efectivo' : '');

// ---- Ligar pagos (27-nov-2026). Facturas que ya se pagaron y no tienen comprobante: se ligan con su cargo en el banco.
// Solo el dueño. La cantidad debe cuadrar al centavo: una factura, varias que sumen el pago, o un abono a una sola factura (PPD).
// Las sugerencias se calculan aquí (qué facturas suman cada pago, y por qué parecen suyas); al ligar, el servidor revisa todo otra vez.
const LP={ datos:null, t:0, vista:'sug', neg:'', mov:null, fs:new Set(), qC:'', qF:'', verComp:false, ocupado:false, sug:null };
const LP_ERR={ sin_permiso:'Solo el dueño puede ligar pagos con el banco.', movimiento_invalido:'Ese pago ya no está en Bancos. Actualiza la pantalla.' };
const lpFaltaBase = e => !!e && (e.code==='PGRST202' || e.code==='42883' || /ligar_pagos|ligar_facturas_banco|schema cache/i.test(String((e.raw&&e.raw.message)||'')));
const lpCent = n => Math.round(Number(n)*100);
const lpLlano = s => String(s||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z0-9]+/g,' ').trim();
const LP_COMUN=new Set('SPEI ENVIADO RECIBIDO PAGO PAGOS CUENTA TERCERO BNET BANORTE BBVA BANCOMER SANTANDER BANAMEX HSBC SCOTIABANK BAJIO BANBAJIO INBURSA AZTECA TRANSFERENCIA FACTURA FACTURAS FOLIO REFERENCIA CONCEPTO MEXICO GRUPO SERVICIOS SERVICIO COMERCIALIZADORA OPERADORA DISTRIBUIDORA PROVEEDORA COMPRA ABONO ANTICIPO'.split(' '));
const lpPalabras = s => lpLlano(s).split(' ').filter(w=>w.length>=5 && !LP_COMUN.has(w));
const lpFolio = f => f.concepto_pago || [f.serie,f.folio].filter(Boolean).join('') || 's/f';
const lpDias = (a,b) => Math.round((Date.parse(String(a).slice(0,10)+'T12:00:00Z')-Date.parse(String(b).slice(0,10)+'T12:00:00Z'))/86400000);
const lpClave = (c,fs) => c.id+'|'+fs.map(f=>f.id).sort().join(',');
function lpDescartadas(){ try{ return new Set(JSON.parse(localStorage.getItem('om-lp-no')||'[]')); }catch(e){ return new Set(); } }
function lpDescartar(k){ const s=lpDescartadas(); s.add(k); try{ localStorage.setItem('om-lp-no', JSON.stringify([...s].slice(-400))); }catch(e){} }
// Huella de cada proveedor: las palabras con que han salido en el banco los pagos suyos que ya se ligaron.
// Se quitan las que comparten dos proveedores y las que traen muchos pagos (no distinguen a nadie).
function lpHuellas(D){ const H=new Map(), dueno=new Map(), df=new Map();
  for(const c of D.cargos||[]) for(const w of new Set(lpLlano(c.texto).split(' '))) df.set(w,(df.get(w)||0)+1);
  const tope=Math.max(3, Math.round((D.cargos||[]).length*0.15));
  for(const x of D.huellas||[]) for(const w of lpLlano(x.texto).split(' ')){ if(w.length<6 || LP_COMUN.has(w) || (df.get(w)||0)>tope) continue;
    if(dueno.has(w) && dueno.get(w)!==x.proveedor_id){ dueno.set(w,null); continue; } if(!dueno.has(w)) dueno.set(w,x.proveedor_id); }
  for(const [w,p] of dueno){ if(!p) continue; if(!H.has(p)) H.set(p,new Set()); H.get(p).add(w); }
  return H; }
// Por qué una factura parece ser de un pago. n: 3 dice su concepto de pago · 2 dice la referencia del proveedor, o sale como otros pagos suyos · 1 dice su nombre · 0 solo el importe.
function lpSenal(c, f, H){
  const T=c._t||(c._t=lpLlano(c.texto)), pega=c._p||(c._p=T.replace(/ /g,'')), tok=c._w||(c._w=new Set(T.split(' ')));
  const con=lpLlano(f.concepto_pago).replace(/ /g,'');
  if(con.length>=5? pega.includes(con) : (con.length===4 && tok.has(con))) return { n:3, por:'concepto' };
  const ref=lpLlano(f.referencia_especial).replace(/ /g,''); if(ref.length>=5 && pega.includes(ref)) return { n:2, por:'referencia' };
  const hu=H.get(f.proveedor_id); if(hu) for(const w of tok) if(hu.has(w)) return { n:2, por:'huella' };
  for(const w of lpPalabras(f.proveedor)) if(tok.has(w)) return { n:1, por:'nombre' };
  return { n:0, por:'importe' }; }
// Conjuntos de 2 a 6 facturas (de un mismo proveedor) que suman exactamente el pago. cand: [{f, s}] en centavos, de mayor a menor.
function lpCombos(C, cand, tope){ const res=[]; let nodos=0; const suf=new Array(cand.length+1).fill(0); for(let i=cand.length-1;i>=0;i--) suf[i]=suf[i+1]+cand[i].s;
  const baja=(i, resto, pila)=>{ if(res.length>=tope || ++nodos>40000) return; if(resto===0){ if(pila.length>=2) res.push(pila.slice()); return; } if(pila.length>=6) return;
    for(let j=i;j<cand.length;j++){ if(cand[j].s>resto) continue; if(suf[j]<resto) break; pila.push(cand[j]); baja(j+1, resto-cand[j].s, pila); pila.pop(); if(res.length>=tope || nodos>40000) return; } };
  baja(0, C, []); return res; }
// Las sugerencias: por cada pago del banco sin ligar, las facturas sin pagar del mismo negocio que lo cuadran.
// nivel: 2 = el texto del banco señala esas facturas y no hay otra igual · 1 = es lo único que cuadra · 0 = hay varias opciones (se elige).
function lpSugerir(D){ const H=lpHuellas(D), no=lpDescartadas(), out=[]; const porNeg=new Map();
  for(const f of D.facturas||[]){ if(!porNeg.has(f.negocio_id)) porNeg.set(f.negocio_id,[]); porNeg.get(f.negocio_id).push(f); }
  for(const c of D.cargos||[]){ if(c.comprobante) continue; const C=lpCent(c.cargo); let ops=[];
    const cand=(porNeg.get(c.negocio_id)||[]).filter(f=>{ const dd=lpDias(c.fecha,f.fecha); return lpCent(f.saldo)<=C && dd>=-20 && dd<=75; });
    for(const f of cand) if(lpCent(f.saldo)===C) ops.push({ fs:[f], senal:lpSenal(c,f,H) });
    const porProv=new Map(); for(const f of cand){ if(lpCent(f.saldo)>=C) continue; if(!porProv.has(f.proveedor_id)) porProv.set(f.proveedor_id,[]); porProv.get(f.proveedor_id).push({ f, s:lpCent(f.saldo) }); }
    for(const lista of porProv.values()){ if(lista.length<2) continue; lista.sort((a,b)=>b.s-a.s || (a.f.fecha<b.f.fecha?-1:a.f.fecha>b.f.fecha?1:0));
      for(const cb of lpCombos(C, lista, 3)){ const fs=cb.map(x=>x.f); const ss=fs.map(f=>lpSenal(c,f,H)).sort((a,b)=>b.n-a.n); ops.push({ fs, senal:ss[0] }); } }
    ops=ops.filter(o=>!no.has(lpClave(c,o.fs))); if(!ops.length) continue;
    ops.sort((a,b)=>b.senal.n-a.senal.n || a.fs.length-b.fs.length || Math.abs(lpDias(c.fecha,a.fs[0].fecha))-Math.abs(lpDias(c.fecha,b.fs[0].fecha)));
    const mejor=ops[0].senal.n, punta=ops.filter(o=>o.senal.n===mejor);
    out.push({ c, ops:(mejor>0? punta : ops).slice(0,3), nivel: (mejor>=2 && punta.length===1)? 2 : ops.length===1? 1 : 0 }); }
  // Una factura no puede ser de dos pagos: si la misma queda propuesta para dos, las dos sugerencias bajan a "se elige" (salvo la que el banco señala).
  const veces=new Map(); for(const s of out) for(const f of s.ops[0].fs) veces.set(f.id,(veces.get(f.id)||0)+1);
  for(const s of out) if(s.nivel<2 && s.ops[0].fs.some(f=>veces.get(f.id)>1)){ s.nivel=0; s.choca=true; }

function periodoTexto(ini, fin){
  if(!ini||!fin) return '';
  const [y1,m1,d1]=ini.split('-').map(Number), [y2,m2,d2]=fin.split('-').map(Number);
  const ult=new Date(Date.UTC(y2,m2,0)).getUTCDate();
  const MES=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
  if(y1===y2&&m1===m2&&d1===1&&d2===ult) return `${MES[m1-1]} ${y1}`;
  const c=(d,m,y)=>`${d} ${MES[m-1].slice(0,3)}${y1!==y2?' '+y:''}`;
  return `${c(d1,m1,y1)} – ${c(d2,m2,y2)} ${y2}`.replace(/\s+/g,' ');
}

  const motivo=h('input',{type:'text',id:'bs-motivo',placeholder:'Motivo (obligatorio): p. ej. se subió a la cuenta equivocada'});
  const btn=h('button',{class:'btn big block',id:'bs-eliminar',style:'background:var(--err);color:var(--neon-fg);border-color:var(--err)',disabled:true},'Eliminar estos movimientos');
  motivo.addEventListener('input',()=>{ btn.disabled=motivo.value.trim().length<4; });
  btn.addEventListener('click',async()=>{ btn.disabled=true; btn.textContent='Eliminando…';
    try{ const r=await rpc('eliminar_carga_banco',{p_carga:g.id, p_motivo:motivo.value.trim()}); sheet.remove(); toast(`Se eliminaron ${fmtInt(r.movimientos)} movimientos de ${r.cuenta}. El archivo queda en Eliminados y cancelados.`,6000); BAN.cargas=null; render(); }
    catch(e){ btn.disabled=false; btn.textContent='Eliminar estos movimientos'; aviso(e.message||e.code,'err',12000,'No se eliminó'); } });
  sheet.append(h('div',{class:'in stack'}, h('h3',{},'¿Eliminar este archivo subido?'),
    h('p',{class:'small muted',style:'margin:0'},`Se quitan los ${fmtInt(g.nuevas)} movimientos que entraron con este archivo${c?' en '+c.alias:''} (${bancoPeriodo(g.desde,g.hasta)}). El archivo se puede volver a subir después. Queda anotado en la bitácora con tu usuario y el motivo.`),
    motivo, btn, h('button',{class:'btn ghost block',onclick:()=>sheet.remove()},'Cancelar')));
  document.body.append(sheet); motivo.focus();
}

// ---- CONCILIACIÓN (25-nov-2026). La herramienta del dueño: por día, lo que marcó el dispensario contra lo que cayó en bancos.
// Cada peso del dispensario termina en: efectivo en el banco, tarjetas en el banco, clientes marcados (declarado por el despachador),
// en camino (todavía dentro de su plazo o falta subir el banco) o sin explicar. "Sin explicar" es la medida de la fuga.
// Tres vistas del mismo cálculo: Diaria (un día con su desglose), Acumulado (lo que va del mes) e Histórico (otro mes o fechas específicas).
// Lo calcula la app con lo ya guardado (cortes enviados y movimientos del banco); no escribe nada.
const CONC={ dia:null, mes:null, modo:'mes', del:'', al:'', abre:null, cache:{} };
const CONC_PLAZO={ efectivo:3, tarjetas:4 };   // días que puede tardar en verse en el banco. Efectivo: 3 en todas las estaciones (decisión de Mauricio, 25-nov-2026: depósito en ventanilla mínimo lunes, miércoles y viernes). Tarjetas: fin de semana largo
const concPlazoEf = p => p.plazoEf || CONC_PLAZO.efectivo;
// Tipo de cada cliente marcado (Configuración ▸ Clientes marcados): dice si su consumo está por cobrarse, ya estaba pagado o no es dinero.
const CLI_TIPOS=[['credito','Crédito','Se le cobra después','Por cobrar'],['prepago','Débito','Pagó por adelantado','Descontado de anticipos'],['autoconsumo','Autoconsumo','Vehículos de la empresa','No es dinero: consumo propio'],['jarreo','Jarreo','Producto que regresa al tanque','No es dinero: regresa al tanque']];
const cliTipo = t => CLI_TIPOS.find(x=>x[0]===t)||null;
const concTiposDe = lista => { const m={}; for(const x of lista||[]) if(x.tipo && cliTipo(x.tipo)){ if(x.id) m['id:'+x.id]=x.tipo; m['n:'+String(x.nombre||'').trim().toLowerCase()]=x.tipo; } return m; };
const concEnMano = d => BILLETES.reduce((t,b)=>t+b*(Number(d&&d.efectivo&&d.efectivo.extra&&d.efectivo.extra.billetes&&d.efectivo.extra.billetes[b])||0),0) + MONEDAS.reduce((t,m)=>t+m*(Number(d&&d.efectivo&&d.efectivo.extra&&d.efectivo.extra.monedas&&d.efectivo.extra.monedas[m])||0),0);
const concHabil = f => { let g=addDays(f,1); for(;;){ const w=new Date(g+'T12:00:00Z').getUTCDay(); if(w!==0 && w!==6) return g; g=addDays(g,1); } };   // siguiente día hábil (sin festivos)
const concHabilAntes = f => { let g=addDays(f,-1); for(;;){ const w=new Date(g+'T12:00:00Z').getUTCDay(); if(w!==0 && w!==6) return g; g=addDays(g,-1); } };   // día hábil anterior (sin festivos)
const concBancoDe = t => { const n=String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]/g,''); return ['bbva','banorte','banbajio','santander','hsbc','banamex','citibanamex','scotiabank','inbursa','afirme','azteca','banregio'].find(b=>n.includes(b))||null; };   // de qué banco es una terminal o una cuenta, por su nombre
const concTipoLote = desc => /DEBITO|[0-9]D\s*$/i.test(desc||'')? 'Débito' : 'Crédito';   // BBVA: VENTAS DEBITO / CREDITO / TDC INTER / AMEX; Banorte: termina en C o D
// Cálculo puro (lo usan las tres vistas y las pruebas). p: { ini, fin, hoy, cortes, efMovs, tjMovs, reng, ultimoEf, ultimoTj, ultimoCaj, tipos, tolCorte }
// ultimoCaj: último día subido de la cuenta donde cae el cajero (si la estación tiene cajero). tipos: mapa de concTiposDe().
function concCalcular(p){
  const r2=n=>Math.round(n*100)/100; const tolC=p.tolCorte??50; const dias={};
  const D=f=>dias[f]||(dias[f]={ f, cortes:[], deps:[], lotes:[], avisos:[], sinCaer:[], disp:0, litros:0, decl:{efectivo:0,tarjetas:0,clientes:0}, banco:{efectivo:0,tarjetas:0}, difCortes:0, mano:0, cli:{credito:0,prepago:0,autoconsumo:0,jarreo:0,sin:0} });
  const declarados=[];

          proveedor_id:f.proveedorId||null, proveedor_nombre:f.proveedorId?null:f.proveedorNombre.trim(), proveedor_rfc:x.emisor_rfc||null, fecha:f.fecha, total:Number(f.total), serie:f.serie.trim()||null, folio:f.folio.trim()||null, concepto:f.concepto.trim()||null, notas:f.notas.trim()||null }, 'registrar-factura').catch(err=>({ok:false,error:err.message}));
        if(!j.ok){ b.disabled=false; msg.textContent=''; if(j.codigo==='factura_duplicada') w.paso='archivos'; render(); aviso(j.error||'No se pudo registrar la factura.','err',10000,'No se puede registrar'); return; }
        w.paso='listo'; w.resultado=j; render(); aviso(j.proveedor+' · '+j.archivo+(j.pago_ligado?' · ligada a su pago':''),'ok',6000,'Factura registrada'); }},'Registrar factura'));
    return;
  }
  if(w.paso==='listo'){ const r=w.resultado;
    if(r.adjuntado){ add(card, h('div',{class:'sechead'}, h('h3',{},'PDF guardado'), cerrar), h('p',{class:'muted'},`${r.proveedor} → ${r.negocio}`),
      h('div',{class:'row'}, h('button',{class:'btn primary',onclick:()=>{ FA.wizard={paso:'archivos'}; render(); }},'Agregar otra'), h('button',{class:'btn ghost',onclick:()=>{ FA.wizard={paso:'archivos'}; if(S.rol==='oficina') oficinaTab='cfacturas'; else adminTab='cfacturas'; render(); }},'Ver facturas'))); return; }
    add(card, h('div',{class:'sechead'}, h('h3',{},'✅ Factura registrada'), cerrar), h('p',{class:'muted'},`${r.proveedor} → ${r.negocio}`), h('p',{class:'small muted'},'Archivo en Drive: '+r.archivo),
      r.pago_ligado? h('p',{class:'small',style:'color:var(--ok)'},'Se ligó sola al pago del '+fmtFecha(r.pago_ligado)+'.'):bloqueConcepto(r,true),
      r.pago_ligado||r.referencia_especial||!r.concepto_pago? null : h('p',{class:'small muted'},'Escribe ese concepto en la transferencia; así el comprobante se liga solo a esta factura.'),
      h('div',{class:'row'}, r.drive? h('a',{class:'btn ghost',href:r.drive,target:'_blank',rel:'noopener'},'Abrir en Drive'):null, h('button',{class:'btn primary',onclick:()=>{ FA.wizard={paso:'archivos'}; render(); }},'Agregar otra'), h('button',{class:'btn ghost',onclick:()=>{ FA.wizard={paso:'archivos'}; if(S.rol==='oficina') oficinaTab='cfacturas'; else adminTab='cfacturas'; render(); }},'Ver facturas'))); }
}

// La rueda del mouse no debe cambiar valores numéricos (al girar sobre un campo con foco, se quita el foco)
document.addEventListener('wheel', e=>{ const a=document.activeElement; if(a && a.tagName==='INPUT' && a.type==='number' && (e.target===a || a.contains(e.target))) a.blur(); }, {passive:true});
document.addEventListener('keydown', e=>{ const a=e.target; if(a && a.tagName==='INPUT' && a.type==='number' && (e.key==='ArrowUp'||e.key==='ArrowDown')) e.preventDefault(); });
document.addEventListener('keydown', e=>{ if(S.pinTeclado && !(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) S.pinTeclado(e); });
// ---- Cierre automático por inactividad (5 min): guarda lo capturado y regresa a la pantalla de despachadores
const INACTIVO_MS=5*60*1000; let ultimaActividad=Date.now(), inactT=null;
function tocar(){ ultimaActividad=Date.now(); clearTimeout(inactT); if(S.me) inactT=setTimeout(revisarInactividad, INACTIVO_MS+500); }
function revisarInactividad(){
  if(!S.me) return;
  if(Date.now()-ultimaActividad<INACTIVO_MS || S.esperandoArchivo){ tocar(); return; }
  if(document.visibilityState==='hidden') return;
  cerrarPorInactividad();
}
async function cerrarPorInactividad(){
  clearTimeout(inactT);
  try{ if(S.me && S.corte && S.corte.estado==='abierto') await guardarAvance(); }catch(e){}
  document.querySelectorAll('.sheet,.lightbox').forEach(x=>x.remove());
  const t=S.token; S.me=null; S.corte=null; S.frames=[]; S.token=null; S.esperandoArchivo=false; guardarToken(null);
  go('login'); toast('Sesión cerrada por inactividad. Lo que ya habías capturado quedó guardado.',6000);
  try{ if(t) await rpc('cerrar_sesion',{p_token:t}); }catch(e){}
}
['pointerdown','keydown','touchstart','input','wheel'].forEach(ev=>document.addEventListener(ev,tocar,{passive:true,capture:true}));
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState!=='visible') return; if(S.esperandoArchivo){ S.esperandoArchivo=false; tocar(); return; } if(S.me && Date.now()-ultimaActividad>=INACTIVO_MS) cerrarPorInactividad(); else tocar(); });
window.addEventListener('focus',()=>{ if(S.esperandoArchivo){ S.esperandoArchivo=false; tocar(); } });

// ---- Actualización automática: la APK y los navegadores guardan index.html en caché; version.json se pide sin caché
// y, si hay una versión nueva, se recarga con ?v=<nueva> (la caché no la reconoce y baja la página fresca).
function versionMayor(a,b){ const pa=String(a).split('.').map(Number), pb=String(b).split('.').map(Number); for(let i=0;i<3;i++){ if((pa[i]||0)>(pb[i]||0)) return true; if((pa[i]||0)<(pb[i]||0)) return false; } return false; }
function aplicarVersion(v){ const base=location.href.split('?')[0].split('#')[0]; location.replace(base+'?v='+encodeURIComponent(v)); }
async function revisarVersion(){
  try{
    const r=await fetch('version.json?ts='+Date.now(),{cache:'no-store'}); if(!r.ok) return; const j=await r.json(); const v=j&&j.version; if(!v || !versionMayor(v, OM_VERSION)) return;
    // Sin trabajo a medias (entrada, PIN, inicio): se actualiza sola. Con un corte abierto: aviso con botón.
    const tranquilo = !S.corte && (['login','home','admin','oficina'].includes(S.screen||'login') || (S.screen==='logistica' && LOG.vista!=='forma')) && !(S.screen==='admin' && adminTab==='lviajes' && LOG.vista==='forma') && !document.querySelector('#om-trabajando');
    if(tranquilo && !S.rol){ aplicarVersion(v); return; }
    if(tranquilo && S.rol==='kiosco'){ aplicarVersion(v); return; }
    if($('#om-nueva')) return;
    const b=h('div',{id:'om-nueva',class:'om-nueva'}, h('span',{},`Hay una versión nueva de OwnManager (v${v}).`), h('button',{class:'btn sm primary',onclick:()=>aplicarVersion(v)},'Actualizar'), h('button',{class:'btn sm ghost',onclick:()=>b.remove()},'Luego'));
    document.body.append(b);
  }catch(_){}
}
setTimeout(revisarVersion, 2500); setInterval(revisarVersion, 5*60*1000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') revisarVersion(); });
if(/[?&]om_test=1\b/.test(location.search)) window.__om={ S, omLoader, renderFotosListas, leerConIA, render, generarPDF, generarPDFNoche, cortesDeLaNoche, botonPDFNoche, sb, rpc, corteDesdeServidor, cortesTablero, adminHoy, adminCortes, verCorte, pdfDelCorte, concCalcular, concTiposDe, CONC, fmtFecha, omEsperaPantalla, pcEstado, PC, omSinPistas, aviso, pushAbrir, LP, lpSugerir, lpCombos }; // solo para la prueba de humo
boot();
})();
