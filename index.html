<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>OwnManager</title>
<meta name="theme-color" content="#0B0F14">
<link rel="icon" type="image/png" sizes="192x192" href="marca/favicon-192.png">
<link rel="apple-touch-icon" href="marca/om-isotipo-lima-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Tipografía de producto: Geist Sans + Geist Mono (variables, autohospedadas; licencia OFL en fonts/) */
@font-face{font-family:"Geist";src:url("fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Geist Mono";src:url("fonts/GeistMono-Variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
/* =====================================================================
   OwnManager · Sistema visual v2 (Manual de identidad visual v1.1)
   Geist Sans + Geist Mono · Lima #84FF00 · Negro #0B0F14 · Carbón #1B222B
   Acentos por módulo: Oficina lima · Kiosko cian · Central violeta · Logística naranja
   Solo estilos: los selectores, ids y clases que usa la lógica no cambian.
   ===================================================================== */
:root{
  /* Marca */
  --lima:#84FF00; --negro:#0B0F14; --carbon:#1B222B; --claro:#E5E7EB; --blanco:#FFFFFF;
  --mod-oficina:#84FF00; --mod-kiosko:#00C9F6; --mod-central:#AC3DF5; --mod-logistica:#FF871C;
  --mod:var(--lima); --mod-ink:#3D8B00;              /* --mod = acento del módulo; --mod-ink = versión legible como texto */
  --brand:var(--lima); --brand-fg:var(--negro);      /* botón de acción principal, igual en claro y oscuro */
  /* Chrome (cabecera y menú lateral): siempre oscuro */
  --chrome:#0B0F14; --chrome-2:#131920; --chrome-hover:#161D25; --chrome-fg:#F3F4F6; --chrome-muted:#8B95A3; --chrome-line:#1F262F;
  /* Tema claro */
  --bg:#F4F5F7; --surface:#FFFFFF; --surface2:#F1F2F4; --fg:#0B0F14; --muted:#5C6675; --line:#E5E7EB; --line2:#D5DAE0;
  --accent:#0B0F14; --accent-fg:#FFFFFF; --accent-soft:#E9EBEE; --focus:var(--mod-ink); --focus-soft:color-mix(in srgb,var(--mod) 32%,transparent);
  --ok:#15803D; --ok-soft:#E7F6EC; --warn:#B45309; --warn-soft:#FDF1D6; --err:#DC2626; --err-soft:#FDE8E8; --info:#0369A1;
  --rojo:#DC2626; --azul:#0369A1; --cyan:#0083A3; --verde:#15803D; --noche:#0B0F14; --noche-fg:#FFFFFF; --neon-fg:#FFFFFF;
  --font-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --font-display:"Geist","Inter","Segoe UI",system-ui,sans-serif;
  --font-body:"Geist","Inter","Segoe UI",system-ui,sans-serif;
  --r:12px; --r-sm:10px; --r-xs:8px;
  --shadow:0 1px 2px rgba(11,15,20,.05),0 4px 14px rgba(11,15,20,.05);
  --shadow-lg:0 12px 32px rgba(11,15,20,.14);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B0F14; --surface:#1B222B; --surface2:#222A34; --fg:#F3F4F6; --muted:#9AA3AF; --line:#2A323D; --line2:#343D49;
  --accent:var(--mod); --accent-fg:#0B0F14; --accent-soft:color-mix(in srgb,var(--mod) 14%,#1B222B); --mod-ink:var(--mod); --focus:var(--mod); --focus-soft:color-mix(in srgb,var(--mod) 30%,transparent);
  --ok:#4ADE80; --ok-soft:#12291B; --warn:#FBBF24; --warn-soft:#2E2410; --err:#F87171; --err-soft:#3A1A1F; --info:#38BDF8;
  --rojo:#F87171; --azul:#38BDF8; --cyan:#00C9F6; --verde:#4ADE80; --noche:#F3F4F6; --noche-fg:#0B0F14; --neon-fg:#0B0F14;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.28); --shadow-lg:0 16px 40px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B0F14; --surface:#1B222B; --surface2:#222A34; --fg:#F3F4F6; --muted:#9AA3AF; --line:#2A323D; --line2:#343D49;
  --accent:var(--mod); --accent-fg:#0B0F14; --accent-soft:color-mix(in srgb,var(--mod) 14%,#1B222B); --mod-ink:var(--mod); --focus:var(--mod); --focus-soft:color-mix(in srgb,var(--mod) 30%,transparent);
  --ok:#4ADE80; --ok-soft:#12291B; --warn:#FBBF24; --warn-soft:#2E2410; --err:#F87171; --err-soft:#3A1A1F; --info:#38BDF8;
  --rojo:#F87171; --azul:#38BDF8; --cyan:#00C9F6; --verde:#4ADE80; --noche:#F3F4F6; --noche-fg:#0B0F14; --neon-fg:#0B0F14;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.28); --shadow-lg:0 16px 40px rgba(0,0,0,.5); color-scheme:dark }
/* Acento del módulo activo (lo fija render() como atributo de presentación) */
body[data-om-mod="oficina"]{--mod:var(--mod-oficina)} body[data-om-mod="kiosko"]{--mod:var(--mod-kiosko)} body[data-om-mod="central"]{--mod:var(--mod-central)} body[data-om-mod="logistica"]{--mod:var(--mod-logistica)}
:root:not([data-theme="dark"]) body[data-om-mod="oficina"]{--mod-ink:#3D8B00} :root:not([data-theme="dark"]) body[data-om-mod="kiosko"]{--mod-ink:#0083A3}
:root:not([data-theme="dark"]) body[data-om-mod="central"]{--mod-ink:#7A1FC2} :root:not([data-theme="dark"]) body[data-om-mod="logistica"]{--mod-ink:#C25A00}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body[data-om-mod]{--mod-ink:var(--mod)} }
:root[data-theme="dark"] body[data-om-mod]{--mod-ink:var(--mod)}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"ss01","cv11"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--chrome)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(24px,2.4vw,30px)} h2{font-size:22px} h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
.eyebrow{font:600 11.5px/1.3 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
b,strong{font-weight:600}
::selection{background:color-mix(in srgb,var(--mod) 35%,transparent)}

/* Header: cabecera oscura con línea del módulo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--chrome);color:var(--chrome-fg);border-bottom:1px solid var(--chrome-line)}
.top::after{content:"";display:block;height:2px;background:var(--mod);opacity:.9}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.logo{height:52px;width:auto;max-width:min(52vw,260px);object-fit:contain;display:block;background:#fff;border-radius:10px;padding:4px 8px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .om{width:40px;height:40px;border-radius:11px;flex:none;object-fit:cover;background:#000;border:1px solid var(--chrome-line)}
/* Pantalla de entrada: siempre oscura (#0B0F14), como marca el manual */
body[data-om-login]{background:var(--negro);color:#F3F4F6;color-scheme:dark}
body[data-om-login]::before{background:var(--negro)}
body[data-om-login] .top{display:none}
body[data-om-login] .foot{display:none}
.om-login{min-height:calc(100vh - 62px);display:flex;flex-direction:column;justify-content:center;gap:22px;padding:24px 0;
  --bg:#0B0F14; --surface:#1B222B; --surface2:#222A34; --fg:#F3F4F6; --muted:#9AA3AF; --line:#2A323D; --line2:#343D49; --accent:#84FF00; --accent-fg:#0B0F14; --accent-soft:#1E2E10; --err:#F87171; --err-soft:#3A1A1F; --focus:#84FF00; --focus-soft:rgba(132,255,0,.28); --shadow:none}
.om-login .hero{text-align:center;position:relative;padding:28px 0 4px}
.om-login .hero::before{content:"";position:absolute;left:50%;top:38%;width:min(560px,110vw);height:220px;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(132,255,0,.16),rgba(132,255,0,.05) 45%,transparent 70%);pointer-events:none;filter:blur(8px)}
.om-login .om-hero{position:relative;width:min(400px,84vw);height:auto;display:block;margin:0 auto 6px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.om-login .om-wordmark{display:none} /* el logotipo oficial ya lleva el nombre; no se recrea con la fuente de interfaz */
.om-login .om-slogan{font:500 12.5px/1.4 var(--font-mono);color:#9AA3AF;margin-top:10px;letter-spacing:.08em;text-transform:uppercase}
.om-login .card{background:#1B222B;border:1px solid #2A323D;color:#F3F4F6}
.om-login input{background:#0F141A;border-color:#2A323D;color:#F3F4F6}
.om-login input:focus{outline:3px solid rgba(132,255,0,.28);border-color:#84FF00}
.om-login .btn.primary{background:#84FF00;color:#0B0F14;border-color:#84FF00;font-weight:600}
.om-login .btn.primary:focus-visible{outline:3px solid rgba(132,255,0,.35)}
.om-login .hint{color:#9AA3AF}
.om-login .bar{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#84FF00,transparent);width:160px;margin:16px auto 0}
/* Pie de página con la marca del programa */
.foot{max-width:720px;margin:0 auto;padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font:500 11.5px var(--font-mono);letter-spacing:.08em;text-transform:uppercase}
.foot img{width:20px;height:20px;object-fit:cover;border-radius:6px;opacity:.95}
.foot .lima{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .foot .lima{display:block} :root:not([data-theme="light"]) .foot .mono{display:none} }
:root[data-theme="dark"] .foot .lima{display:block} :root[data-theme="dark"] .foot .mono{display:none}
:root[data-theme="light"] .foot .lima{display:none} :root[data-theme="light"] .foot .mono{display:block}
.brand .nm{font:700 18px/1.1 var(--font-display);letter-spacing:-.01em;color:var(--chrome-fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .nm small{display:block;font:500 10.5px/1.3 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--chrome-muted);margin-top:2px}
.logo-prev{height:64px;width:auto;max-width:260px;object-fit:contain;display:block;background:#fff;color:#0B0F14;border:1px solid var(--line);border-radius:10px;padding:6px}
/* --- Aceites --- */
.acgrp{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.acgrp > .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--surface2);font:600 14px var(--font-display)}
.acrow{display:grid;grid-template-columns:minmax(0,1fr) auto 86px;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.acrow .nm{min-width:0;font-size:13.5px;line-height:1.3}
.acrow .nm small{display:block;color:var(--muted);font-size:11.5px}
.acrow.mov{background:color-mix(in srgb,var(--mod) 9%,var(--surface))}
.step{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line2);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.step button{border:0;background:transparent;width:40px;height:40px;font:600 20px var(--font-display);color:var(--fg);cursor:pointer;line-height:1}
.step button:active{background:var(--accent-soft)}
.step button[disabled]{color:var(--line2);cursor:not-allowed}
.step input{width:46px;min-height:40px;padding:0;text-align:center;border:0;border-inline:1px solid var(--line);border-radius:0;background:transparent;font:600 17px var(--font-mono);font-variant-numeric:tabular-nums;color:var(--fg)}
.step input:focus{outline:2px solid var(--focus);border-radius:6px}
.acrow .vd{text-align:right;font-variant-numeric:tabular-nums;font:600 14px var(--font-mono)}
.acrow .vd.cero{color:var(--muted);font-weight:400}
@media (max-width:420px){.acrow{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}.acrow .vd{grid-column:2;text-align:right}}
.acadm{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.acadm input[type=text]{min-height:40px}
.acadm input[type=number]{min-height:40px;text-align:right}
.acadm.off{opacity:.5}
/* El logo de la estación va siempre sobre placa blanca (los logos vienen para fondo claro) */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand .logo{background:#fff;border-radius:10px;padding:4px 8px;height:52px} }
:root[data-theme="dark"] .brand .logo{background:#fff;border-radius:10px;padding:4px 8px;height:52px}
@media (max-width:520px){.logo{height:44px}}
.top .who{display:flex;align-items:center;gap:10px;min-width:0}
.gear{width:40px;height:40px;border-radius:10px;border:1px solid var(--chrome-line);background:var(--chrome-2);color:var(--chrome-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:color .15s,border-color .15s}
.gear:hover{color:var(--chrome-fg);border-color:var(--mod)}
.gear svg{display:block}
.top .who .name{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--chrome-fg)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card + .card, .stack > * + *{margin-top:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}

/* Buttons */
.btn{appearance:none;border:1px solid var(--line2);background:var(--surface);color:var(--fg);font:500 14.5px var(--font-body);padding:11px 18px;border-radius:var(--r-sm);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;letter-spacing:-.005em;transition:transform .08s ease,background .15s,border-color .15s,color .15s,box-shadow .15s}
.btn:hover{border-color:color-mix(in srgb,var(--fg) 30%,var(--line2));background:var(--surface2)}
.btn:active{transform:scale(.985)}
.btn:focus-visible{outline:3px solid var(--focus-soft);outline-offset:1px;border-color:var(--focus)}
.btn.primary{background:var(--brand);color:var(--brand-fg);border-color:var(--brand);font-weight:600}
.btn.primary:hover{background:#9BFF2E;border-color:#9BFF2E;box-shadow:0 6px 18px rgba(132,255,0,.22)}
.btn.ok{background:var(--ok);color:var(--neon-fg);border-color:var(--ok)}
.btn.ok:hover{filter:brightness(1.05);background:var(--ok)}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,var(--line2));background:var(--surface)}
.btn.danger:hover{background:var(--err-soft);border-color:var(--err)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2);border-color:var(--line2)}
.btn.ghost.danger{border-color:transparent}
.btn.block{width:100%}
.btn.big{min-height:54px;font-size:16px;border-radius:var(--r)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13px;border-radius:var(--r-xs)}

/* Chips */
.ro{display:flex;align-items:center;min-height:46px;padding:11px 12px;border:1px dashed var(--line2);border-radius:var(--r-sm);background:var(--surface2);color:var(--fg);font:500 16px var(--font-body);word-break:break-word}
.ro:empty::before{content:'—';color:var(--muted)}
.chip.edit{background:var(--warn-soft);color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:500 12px/1.6 var(--font-mono);letter-spacing:.02em;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.err{background:var(--err-soft);color:var(--err);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* Inputs */
label.f{display:block}
label.f span.l{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px;letter-spacing:.01em}
.passwrap{position:relative}.passwrap input{width:100%;padding-right:46px;box-sizing:border-box}.passwrap .ojo{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:var(--muted);cursor:pointer;padding:6px;line-height:0;border-radius:8px}.passwrap .ojo:hover{color:var(--fg)}
input[type=text],input[type=search],input[type=email],input[type=number],input[type=password],input[type=date],input[type=month],select,textarea{width:100%;font:500 15.5px var(--font-body);color:var(--fg);background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-sm);padding:11px 12px;min-height:46px;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--fg) 28%,var(--line2))}
input:focus,select:focus,textarea:focus{outline:3px solid var(--focus-soft);border-color:var(--focus)}
select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%235C6675' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
input.num{font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:19px;font-weight:600;letter-spacing:0}
input.bad{border-color:var(--err);background:var(--err-soft)}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}

/* Login */
.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.modo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 6px}
.modo button{border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;color:var(--fg);font-family:var(--font-body);transition:border-color .15s,background .15s}
.modo button .ic{font-size:26px;line-height:1}
.modo button b{display:block;font:600 16px var(--font-display)}
.modo button small{display:block;font-size:12px;color:var(--muted)}
.modo button.on{border-color:var(--mod-ink);background:color-mix(in srgb,var(--mod) 10%,var(--surface));box-shadow:0 0 0 1px var(--mod-ink) inset}
.modo button.on.dep{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface));box-shadow:0 0 0 1px var(--ok) inset}
.depbox{border:1.5px dashed var(--ok);border-radius:var(--r-sm);padding:12px;background:color-mix(in srgb,var(--ok) 6%,var(--surface))}
.depbox .money.small{font-size:13px}
.person{border:1px solid var(--line2);background:var(--surface);border-radius:var(--r);padding:16px 14px;text-align:left;cursor:pointer;font:500 15px var(--font-body);color:var(--fg);display:flex;align-items:center;gap:10px;min-height:64px;transition:border-color .15s,transform .12s}
.person:hover{border-color:var(--mod-ink);transform:translateY(-1px)}
.avatar{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font:600 14px var(--font-mono);flex:none}

@media (max-width:560px){.vrow{grid-template-columns:1fr 1fr}.vrow .mxwrap{grid-column:1/2}.vrow .x{grid-column:2/3;justify-self:end}}
.sheet .in .list .item{cursor:pointer}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* Reporte de calidad */
.score{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center;padding:16px;border-radius:var(--r);background:var(--surface2);border:1px solid var(--line)}
.score.ok{background:var(--ok-soft);border-color:transparent} .score.acc{background:var(--accent-soft);border-color:transparent} .score.warn{background:var(--warn-soft);border-color:transparent} .score.err{background:var(--err-soft);border-color:transparent}
.score .cara{font-size:40px;line-height:1}
.score h2{font-size:24px;margin:4px 0}
.ringbox svg{display:block;max-width:100%}
@media (max-width:460px){.score{grid-template-columns:1fr;justify-items:center;text-align:center}}
.bar .track{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px}
.bar .track i{display:block;height:100%;border-radius:6px;transition:width .4s ease}
.comp{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
@media (max-width:460px){.comp{grid-template-columns:1fr;justify-items:center}}
.legend{display:flex;flex-direction:column;gap:6px;min-width:0}
.lg{display:grid;grid-template-columns:12px 1fr auto 44px;gap:8px;align-items:center;font-size:14px}
.lg i{width:12px;height:12px;border-radius:3px;display:block}
.lg.tot{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.lg .muted{text-align:right;font-family:var(--font-mono);font-size:13px}
.fact{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r-xs);background:var(--surface2);font-size:14px}
.fact .ic{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;background:var(--line);color:var(--muted)}
.fact.ok .ic{background:var(--ok);color:var(--neon-fg)} .fact.bad .ic{background:var(--err);color:var(--neon-fg)}
.fact b{color:var(--err)}
.ia{background:var(--surface2);border-radius:var(--r);padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--mod)}
.iatxt p{margin:0 0 6px;line-height:1.5} .iatxt p:last-child{margin:0}
.sechead h2{font-size:22px}

/* ---- Tablero / Oficina: menú lateral oscuro con iconos y más aire */
body[data-om-nav] .wrap{max-width:1180px}
body[data-om-sesion] .top .in{max-width:none;padding-block:10px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.brand .modlogo{display:block;height:46px;width:auto;border-radius:10px;background:#000;padding:0;box-sizing:border-box;border:1px solid var(--chrome-line)}
#who{display:flex;align-items:center;gap:10px}
#who .empresa{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--chrome-line);display:inline-flex;align-items:center;justify-content:center;overflow:hidden;flex:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--mod) 45%,transparent)}
#who .empresa img{width:100%;height:100%;object-fit:cover}
#who .empresa.ini{background:var(--chrome-2);color:var(--mod);font:600 14px var(--font-mono)}
#who .emp-nm{display:flex;flex-direction:column;line-height:1.15;max-width:200px}
#who .emp-nm b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--chrome-fg)}
#who .emp-nm small{font:500 10.5px var(--font-mono);color:var(--chrome-muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
#who .btn{background:var(--chrome-2);border-color:var(--chrome-line);color:var(--chrome-fg)}
#who .btn:hover{border-color:var(--mod);background:var(--chrome-hover)}
@media (max-width:760px){.brand .modlogo{height:38px}#who .emp-nm{display:none}#who .empresa{width:38px;height:38px}}
.om-shell{display:grid;grid-template-columns:224px minmax(0,1fr);gap:28px;align-items:start}
.om-shell .om-main{min-width:0}
.sidenav{position:sticky;top:78px;display:flex;flex-direction:column;gap:3px;background:var(--chrome);color:var(--chrome-fg);border:1px solid var(--chrome-line);border-radius:14px;padding:10px;max-height:calc(100vh - 96px);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--chrome-line) transparent}
.avisos{position:fixed;top:calc(86px + env(safe-area-inset-top,0px));right:22px;display:flex;flex-direction:column;gap:10px;z-index:80;width:min(380px,calc(100vw - 32px))}
.aviso{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--err);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow-lg);font-size:14px;line-height:1.4;animation:aviso-in .25s ease-out}
.aviso.ok{border-left-color:var(--ok)} .aviso.warn{border-left-color:var(--warn)}
.aviso .tx{flex:1;min-width:0} .aviso .tx b{display:block;margin-bottom:2px;font-weight:600}
.aviso .x{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 2px}
.aviso .barra{position:absolute;left:0;bottom:0;height:2px;background:currentColor;opacity:.25;animation:aviso-bar linear forwards}
.aviso{position:relative;overflow:hidden}
@keyframes aviso-in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes aviso-bar{from{width:100%}to{width:0}}
@media (max-width:760px){.avisos{top:calc(70px + env(safe-area-inset-top,0px));right:12px;left:12px;width:auto}}
.modulo{display:block;flex:none;width:100%;max-width:230px;margin:0 0 10px;border-radius:10px;background:#000;padding:0;box-sizing:border-box;overflow:hidden;border:1px solid var(--chrome-line)}
.sidenav>*{flex:none} /* con el menú más largo que la pantalla, nada se encoge: el menú se desplaza */
.sidenav.desborda{-webkit-mask-image:linear-gradient(#000 calc(100% - 34px),transparent);mask-image:linear-gradient(#000 calc(100% - 34px),transparent)}
.modulo img{display:block;width:100%;height:auto}
.modulo.kiosko{max-width:260px;margin:0 auto 14px}
@media (max-width:760px){.sidenav .modulo{display:none}.modulo.movil{display:block;max-width:220px;margin:0 0 10px}}
.sidenav button{display:flex;align-items:center;gap:12px;width:100%;border:1px solid transparent;background:transparent;border-radius:var(--r-sm);padding:9px 12px;font:500 14px var(--font-body);color:var(--chrome-muted);cursor:pointer;text-align:left;position:relative;transition:background .12s,color .12s}
.sidenav button .ic{width:22px;display:inline-flex;justify-content:center;line-height:0;opacity:.85}
.sidenav button.on .ic{opacity:1;color:var(--mod)}
.sidenav button:hover{background:var(--chrome-hover);color:var(--chrome-fg)}
.sidenav button.on{background:var(--chrome-hover);color:var(--chrome-fg);border-color:var(--chrome-line);font-weight:600}
.sidenav button.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--mod)}
.sidenav .sep{height:1px;background:var(--chrome-line);margin:6px 6px}
.sidenav .sub{display:flex;flex-direction:column;gap:2px;margin:2px 0 6px 20px;border-left:1px solid var(--chrome-line);padding-left:6px}
.sidenav .sub button{padding:8px 10px;font-size:13.5px}
.sidenav .sub button .ic{width:18px}
.sidenav .sub button .ic svg{width:16px;height:16px}
.sidenav button .car{margin-left:auto;font-size:11px;opacity:.6}
.buscar{display:flex;gap:8px;align-items:center}
.buscar input{flex:1;min-width:0;font-size:15px;padding:12px 14px;border-radius:var(--r-sm);appearance:none;-webkit-appearance:none}
.buscar input::-webkit-search-decoration,.buscar input::-webkit-search-cancel-button{-webkit-appearance:none}
.buscar .btn{width:46px;height:46px;padding:0;border-radius:var(--r-sm);flex:0 0 auto;color:var(--muted)}
.buscar .btn svg{width:20px;height:20px}
.buscar .btn:hover{color:var(--fg)}
.concepto{display:flex;width:fit-content;max-width:100%;align-items:center;gap:8px;margin-top:6px;padding:3px 4px 3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);font-size:12px;color:var(--muted)}
.concepto b{display:inline!important;font:600 13px var(--font-mono);color:var(--fg);letter-spacing:.03em}
.concepto .btn.sm{min-height:26px;padding:2px 8px;font-size:12px;gap:4px;border-radius:999px}
.concepto .btn.sm svg{width:14px;height:14px}
.concepto.grande{padding:10px 10px 10px 16px;border-radius:var(--r);font-size:14px;margin-top:4px}
.concepto.grande b{font-size:22px}
.concepto.grande .btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:var(--r-xs)}
.concepto.esp{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:var(--r-sm);padding:8px 12px;flex-direction:column;align-items:flex-start;gap:2px}
.concepto.esp b{font-size:13px;letter-spacing:0;color:var(--warn);font-family:var(--font-body)}
.resumen-ec{display:grid;grid-template-columns:max-content 1fr;gap:10px 18px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface2)}
.resumen-ec .r{display:contents}
.resumen-ec .k{font:500 11.5px var(--font-mono);letter-spacing:.1em;color:var(--muted);align-self:center}
.resumen-ec b{font:600 17px var(--font-body);letter-spacing:.01em;color:var(--fg);word-break:break-word}
.resumen-ec b:empty::before{content:'—'}
.biblio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.biblio .carp{display:flex;flex-direction:column;gap:4px;padding:22px 20px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;color:var(--fg);font:inherit;transition:border-color .15s,transform .15s,box-shadow .15s;box-shadow:var(--shadow)}
.biblio .carp:hover{border-color:var(--mod-ink);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.biblio .carp svg{width:36px;height:36px;color:var(--mod-ink);margin-bottom:8px}
.biblio .carp b{font-size:18px;font-weight:600}
.biblio .carp .sub{font:500 11.5px var(--font-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.biblio .carp .n{margin-top:8px;font-size:12px;color:var(--muted)}
.miga{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.miga .btn.sm{padding:6px 10px}.miga .btn.sm svg{width:18px;height:18px}
.miga b{font-size:17px;font-weight:600}.miga span{color:var(--muted)}
.docs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.doc{display:flex;flex-direction:column;gap:2px;padding:20px 20px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.doc .ic{color:var(--mod-ink);margin-bottom:8px}.doc .ic svg{width:30px;height:30px}
.doc b{font-size:18px;letter-spacing:.01em;font-weight:600}
.doc .sub{font:500 11.5px var(--font-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.doc .acc{display:flex;gap:2px;margin-top:14px;padding-top:8px;border-top:1px solid var(--line)}
.doc .acc .btn.sm{min-height:34px;padding:4px 10px;gap:6px;font-size:13px;border:0;background:transparent;color:var(--muted)}
.doc .acc .btn.sm:hover{color:var(--fg);background:var(--surface2)}
.doc .acc .btn.sm svg{width:17px;height:17px}
.doc .acc .quitar-doc{margin-left:auto;padding:4px 8px}
.doc .acc .quitar-doc:hover{color:var(--err)}
@media (max-width:1100px){ .biblio,.docs{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .biblio,.docs{grid-template-columns:1fr} }
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.filtros select,.filtros input{width:auto;min-height:36px;padding:6px 12px;font-size:13.5px;border-radius:999px;background:var(--surface);color:var(--fg)}
.filtros select{padding-right:32px;background-position:right 10px center}
.filtros select.on,.filtros input.on{border-color:var(--mod-ink);background-color:color-mix(in srgb,var(--mod) 12%,var(--surface));color:var(--mod-ink);font-weight:600}
.filtros .quitar{background:none;border:0;color:var(--muted);font:500 13px var(--font-body);cursor:pointer;padding:6px 8px}
.filtros .quitar:hover{color:var(--fg)}
@media (max-width:760px){.sidenav .sub{display:contents}.sidenav .sub button{padding:8px 12px;font-size:11.5px}.sidenav .sub button .ic{width:auto}.sidenav .sub button .ic svg{width:20px;height:20px}.sidenav button .car{display:none}}
.om-shell h1{margin:0 0 4px}
.om-shell .om-main>.card,.om-shell .om-main>.list,.om-shell .om-main>p{margin-top:12px}
@media (max-width:760px){
  .om-shell{display:block}
  .sidenav{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding:8px;margin-bottom:12px;scrollbar-width:none;max-height:none;border-radius:12px}
  .sidenav::-webkit-scrollbar{display:none}
  .sidenav button{width:auto;flex-direction:column;gap:3px;padding:8px 12px;font-size:11.5px;border-color:transparent;background:transparent;min-width:72px;justify-content:center;text-align:center}
  .sidenav button.on::before{left:12px;right:12px;top:auto;bottom:0;width:auto;height:2px;border-radius:2px 2px 0 0}
  .sidenav button .ic{width:auto}
  .sidenav .sep{display:none}
}
/* Chat */
.chatbox{display:flex;flex-direction:column;min-height:calc(100vh - 230px)}
.chatbox .hilo{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.chatbox .bub{max-width:88%;padding:12px 15px;border-radius:14px;white-space:pre-wrap;line-height:1.5;font-size:15px}
.chatbox .bub.yo{align-self:flex-end;background:var(--noche);color:var(--noche-fg);border-bottom-right-radius:4px}
.chatbox .bub.ia{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;box-shadow:var(--shadow)}
.chatbox .refs{align-self:flex-start;display:flex;flex-wrap:wrap;gap:6px;max-width:88%}
.chatbox .saludo{margin:auto 0;text-align:center;padding:40px 10px}
.chatbox .saludo .big{font:600 clamp(22px,3.2vw,30px)/1.2 var(--font-display);letter-spacing:-.02em;margin-bottom:8px}
.chatbox .saludo .sub{color:var(--muted);font-size:15px}
.chatbox .entrada{display:flex;gap:10px;align-items:flex-end;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.chatbox .entrada textarea{flex:1;resize:none;min-height:52px;font-size:15px;padding:12px 14px;border-radius:var(--r)}
.chatbox .entrada .btn{padding:14px 20px;border-radius:var(--r)}
</style>

const h = (tag, attrs={}, ...kids) => { const e=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==='class') e.className=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else if(v!==false&&v!=null) e.setAttribute(k,v);} for(const k of kids.flat()){ if(k==null||k===false) continue; e.append(k.nodeType?k:document.createTextNode(String(k))); } return e; };

// ---- tiempo en México
function nowMX(){
  const p = new Intl.DateTimeFormat('es-MX',{timeZone:TZ,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value;
  const hh = Number(g('hour'))%24;
  return { fecha:`${g('year')}-${g('month')}-${g('day')}`, hora:hh, min:Number(g('minute')), hhmm:`${String(hh).padStart(2,'0')}:${g('minute')}` };
}
function addDays(fecha, d){ const [y,m,dd]=fecha.split('-').map(Number); const t=new Date(Date.UTC(y,m-1,dd+d)); return t.toISOString().slice(0,10); }
const NOMBRE_CAMPO={fecha:'fecha',total:'total',monto:'importe',serie:'serie',folio:'folio',referencia:'referencia',concepto:'concepto'};
function chipEditado(cambios, fem){
  const partes=Object.entries(cambios||{}).map(([k,v])=>`${NOMBRE_CAMPO[k]||k}: ${v.de??'—'} → ${v.a??'—'}`);
  return h('span',{class:'chip edit',title:partes.join('\n')||'Datos cambiados a mano'}, fem?'editada':'editado');
}
function fmtFechaLarga(f){ if(!f) return ''; const [y,m,d]=f.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)).toLocaleDateString('es-MX',{timeZone:'UTC',day:'numeric',month:'long',year:'numeric'}); }
function fmtFecha(f){ if(!f) return ''; const [y,m,d]=f.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)).toLocaleDateString('es-MX',{timeZone:'UTC',weekday:'short',day:'numeric',month:'short'}); }
function fmtHora(iso){ if(!iso) return ''; return new Date(iso).toLocaleTimeString('es-MX',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false}); }
const VENTANA_CIERRE_MIN=240; // 4 h después del cierre, el corte sigue siendo de ese turno
const toMin = s => { const [a,b]=s.split(':').map(Number); return a*60+b; };
// Fecha en que EMPEZÓ la ocurrencia más reciente de un turno (si empezó antes de medianoche y ya pasó, fue ayer)
function fechaInicioTurno(tu, t){ const ini=toMin(tu.inicio); const mins=t.hora*60+t.min; return mins>=ini ? t.fecha : addDays(t.fecha,-1); }
// Turno preseleccionado para el corte: el que cerró hace menos de 4 h; si no, el que va corriendo.
function turnoSugerido(){
  const t=nowMX(); const mins=t.hora*60+t.min;
  let best=null;
  for(const tu of S.config.turnos){ const dist=(mins-toMin(tu.fin)+1440)%1440; if(best==null || dist<best.dist) best={tu,dist}; }
  if(best && best.dist<=VENTANA_CIERRE_MIN){ const tu=best.tu; const dur=(toMin(tu.fin)-toMin(tu.inicio)+1440)%1440; const inicioMins=mins-best.dist-dur; return { turno:tu.id, fecha:addDays(t.fecha, Math.floor(inicioMins/1440)) }; }
  return turnoEnCurso();
}
// Turno que va corriendo ahora mismo (para los depósitos a caja fuerte durante el turno)
function turnoEnCurso(){
  const t=nowMX(); const mins=t.hora*60+t.min;
  for(const tu of S.config.turnos){ const ini=toMin(tu.inicio), fin=toMin(tu.fin);
    if(fin>ini){ if(mins>=ini && mins<fin) return {turno:tu.id, fecha:t.fecha}; }
    else { if(mins>=ini) return {turno:tu.id, fecha:t.fecha}; if(mins<fin) return {turno:tu.id, fecha:addDays(t.fecha,-1)}; } }
  const tu=S.config.turnos[0]; return {turno:tu.id, fecha:fechaInicioTurno(tu,t)};
}
// Fecha para un turno elegido a mano: su ocurrencia más reciente (a mediodía, "Nocturno" es el de anoche)
function fechaDeTurno(turnoId){ const tu=S.config.turnos.find(x=>x.id===turnoId); return fechaInicioTurno(tu, nowMX()); }

// ---- utilidades
// Aviso lateral (errores y confirmaciones): aparece a la derecha y se va solo a los 10 s.
function aviso(msg, tipo='err', ms=10000, titulo){ let c=$('.avisos'); if(!c){ c=h('div',{class:'avisos'}); document.body.append(c); }
  const el=h('div',{class:'aviso '+tipo}, h('div',{class:'tx'}, titulo?h('b',{},titulo):null, msg), h('button',{class:'x','aria-label':'Cerrar',onclick:()=>el.remove()},'×'), h('div',{class:'barra',style:`animation-duration:${ms}ms`}));
  c.append(el); setTimeout(()=>el.remove(), ms); return el; }

async function boot(){
  const splash=mostrarSplash();
  render(); // primer cuadro sin datos
  if(!CFG.SUPABASE_URL || !CFG.SUPABASE_KEY){ renderNoDb('Falta configurar la conexión al servidor (config.js).'); splash.quitar(); return; }
  sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'){ S.usuario=null; S.rol=null; S.config=null; S.me=null; S.corte=null; S.token=null; guardarToken(null); go('login'); } });
  const { data:{ session } } = await sb.auth.getSession();
  S.sesion = session||null;
  if(!session){ S.screen='login'; render(); splash.quitar(); return; }
  await entrarConCuenta();
  splash.quitar();
}
async function entrarConCuenta(){
  try{
    const u = await sel(sb.from('usuarios').select('*').eq('id',(await sb.auth.getUser()).data.user.id).maybeSingle());
    if(!u || !u.activo){ renderNoDb('Esta cuenta no tiene acceso a ninguna estación. Pide a Mauricio que la dé de alta.'); return; }
    S.usuario=u; S.rol=u.rol; S.isOwner=esTablero();
    await cargarConfig();
  }catch(e){ renderNoDb('No se pudo cargar la estación: '+(e.message||e.code)); return; }
  // sesión de despachador pendiente (recarga de página)
  const t=tokenGuardado(); if(t && S.rol==='kiosco'){ try{ const me=JSON.parse(sessionStorage.getItem('om_me')||'null'); await rpc('mis_cortes',{p_token:t}); S.token=t; S.me=me; }catch(e){ guardarToken(null); } }
  if(S.rol==='oficina'){ S.screen='oficina'; } else if(esTablero()){ S.adminOk=true; S.screen='admin'; } else S.screen = S.me ? 'home' : 'login';
  render();
}
async function cargarConfig(){
  const u=S.usuario; let estId=u.estacion_id;
  const estaciones = await sel(sb.from('estaciones').select('*').eq('activa',true).order('nombre'));
  S.estaciones=estaciones;
  if(!estId){ estId = (S.estacionElegida && estaciones.some(e=>e.id===S.estacionElegida)) ? S.estacionElegida : (estaciones[0]&&estaciones[0].id); }
  const est = estaciones.find(e=>e.id===estId); if(!est){ S.config=null; return; }

    sel(sb.from('islas').select('*').eq('estacion_id',estId).eq('activa',true).order('orden').order('numero')),
    sel(sb.from('mangueras').select('*').eq('estacion_id',estId).eq('activa',true).order('orden')),
    sel(sb.from('aceites').select('*').eq('estacion_id',estId).order('marca').order('nombre')),
    sel(sb.from('despachadores').select('id,estacion_id,clave,nombre,activo,alta,baja,bloqueado_hasta').eq('estacion_id',estId).order('nombre')) ]);
  S.mangPorUuid={}; for(const m of mangs) S.mangPorUuid[m.id]={id:m.clave, uuid:m.id, lado:m.lado, producto:m.producto, orden:m.orden, islaId:m.isla_id, codigo:m.codigo_pantalla||null};
  S.config = { estacionId:est.id, nombre:est.nombre, logoData:est.logo_data||null, logoRatio:null, remitente:est.remitente||'', remitenteNombre:est.remitente_nombre||'', turnos:est.turnos||[], precios:est.precios||{}, terminales:est.terminales||[], toleranciaPesos:Number(est.tolerancia_pesos??50), maxLitrosTurno:Number(est.max_litros_turno??8000), aceitesPorIsla:!!est.aceites_por_isla, clientesMarcados:Array.isArray(est.clientes_marcados)?est.clientes_marcados:[], correosAviso:Array.isArray(est.correos_aviso)?est.correos_aviso:[],
    islas: islas.map(i=>({ id:i.numero, uuid:i.id, nombre:i.nombre, mangueras: mangs.filter(m=>m.isla_id===i.id).map(m=>S.mangPorUuid[m.id]), productos:[...new Set(mangs.filter(m=>m.isla_id===i.id).map(m=>m.producto))] })),
    aceites: aceites.map(a=>({ id:a.clave, uuid:a.id, marca:a.marca, nombre:a.nombre, precio:Number(a.precio), activo:a.activo })) };
  for(const i of S.config.islas) for(const m of i.mangueras) m.producto=m.producto;
  S.desp = desp.map(d=>({ id:d.id, clave:d.clave, nombre:d.nombre, activo:d.activo, bloqueadoHasta:d.bloqueado_hasta }));

function pinScreen(d){
  app.innerHTML=''; let pin=''; let ocupado=false;
  const dots=h('div',{class:'pin'},...[0,1,2,3].map(()=>h('i')));
  const msg=h('p',{class:'hint',style:'text-align:center;min-height:18px'});
  const draw=()=>{ [...dots.children].forEach((i,k)=>i.classList.toggle('on',k<pin.length)); };
  S.pinTeclado=e=>{ if(/^[0-9]$/.test(e.key)){ e.preventDefault(); press(e.key); } else if(e.key==='Backspace'){ e.preventDefault(); press('⌫'); } else if(e.key==='Escape'){ go('login'); } };
  const press=async k=>{ if(ocupado) return; if(k==='⌫'){ pin=pin.slice(0,-1); draw(); return; } if(pin.length>=4) return; pin+=k; draw();
    if(pin.length===4){ ocupado=true; msg.textContent='Verificando…';
      try{ const r=await rpc('verificar_pin',{p_despachador:d.id, p_pin:pin});
        if(r && r.ok){ S.token=r.token; S.me={id:d.id, nombre:(r.despachador&&r.despachador.nombre)||d.nombre, clave:d.clave}; guardarToken(S.token,S.me); S.screen=(S.destino==='deposito')?'deposito':'home'; S.destino=null; tocar(); render(); return; }
        msg.textContent=(r&&r.mensaje)||'PIN incorrecto. Inténtalo de nuevo.'; }
      catch(e){ msg.textContent='No se pudo verificar: '+(e.message||e.code); }
      pin=''; ocupado=false; setTimeout(draw,250); } };
  app.append(h('div',{class:'login'},
    h('div',{style:'text-align:center'}, h('span',{class:'avatar',style:'width:56px;height:56px;font-size:22px'},iniciales(d.nombre)), h('h2',{style:'margin-top:10px'},d.nombre), h('p',{class:'muted'},'Teclea tu PIN de 4 dígitos')),
    dots, msg,
    h('div',{class:'keys'}, ...['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k===''?h('span'):h('button',{class:'key',onclick:()=>press(k)},k))),
    h('button',{class:'btn ghost block',onclick:()=>go('login')},'Cambiar de persona')));
}

  function drawIslas(){ islas.innerHTML=''; btn.disabled=true;
    for(const i of S.config.islas){
      const c=hoy.find(x=>x.isla===i.id);
      const hecho=c && (c.estado==='enviado'||c.estado==='omitida') ? c : null;

          if(ajeno){ toast(`${abierto.despachadorNombre} ya tiene abierto el corte de ${i.nombre} en este turno. Solo esa persona puede continuarlo.`,5000); return; }
          sel.isla=i.id; sel.continuar = mio? abierto.id : null; drawIslas(); }},
        h('span',{class:'t'},i.nombre), h('span',{class:'small muted'},i.productos.join(' · ')),

async function cargarCorte(id){
  try{ const j=await rpc('mi_corte',{p_token:S.token, p_corte:id}); if(!j){ toast('Ese corte ya no está disponible.'); return; }
    const c=corteDesdeServidor(j); await firmarFotos(c.fotos); S.corte=c; S.frames=[]; go('corte'); }
  catch(e){ toast('No se pudo abrir el corte: '+(e.message||e.code),5000); }
}
async function abrirCorte(sel){
  const isla=S.config.islas.find(i=>i.id===sel.isla); if(!isla) return;
  try{ const id=await rpc('abrir_corte',{p_token:S.token, p_isla:isla.uuid, p_fecha:sel.fecha, p_turno:sel.turno}); await cargarCorte(id); }
  catch(e){ toast('No se pudo abrir el corte: '+(e.message||e.code),6000); }
}

const fmtMXN = n => (Number(n)||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'});

// ---- DEPÓSITOS A CAJA FUERTE durante el turno (mini arqueo, inmutable una vez registrado)
async function depositosDe(despId, fecha, turno){
  // Fuente de verdad: el servidor (RPC mis_depositos, migración 005). Si no responde, se usa lo recordado en el dispositivo.
  try{
    const rows=await rpc('mis_depositos',{p_token:S.token, p_fecha:fecha, p_turno:turno});
    return (rows||[]).map(r=>{ let den={}; try{ den=JSON.parse(r.nota||'{}'); }catch(e){}
      return { id:r.id, despachadorId:despId, fecha:r.fecha, turno:r.turno, en:r.en, hora:fmtHora(r.en), billetes:den.billetes||{}, monedas:den.monedas||{}, total:Number(r.importe) }; });
  }catch(e){}
  let all=[]; try{ all=JSON.parse(localStorage.getItem('om_depositos')||'[]'); }catch(e){}
  return all.filter(d=>d.despachadorId===despId && d.fecha===fecha && d.turno===turno).sort((a,b)=>a.en<b.en?-1:1);

function calcAceites(c){
  const v=(c.aceites&&c.aceites.vendidas)||{}; const r={lineas:[],piezas:0,importe:0};
  for(const p of catAceites()){

  for(const l of c.lecturas){ if(l.litros==null) continue; const p=por[l.producto]||(por[l.producto]={litros:0,precio:precios[l.producto]??null,importe:0}); p.litros+=l.litros; }
  for(const [prod,p] of Object.entries(por)){ if(p.precio==null){ completo=false; continue; } p.importe=Math.round(p.litros*p.precio*100)/100; importe+=p.importe; }

function calcDinero(d){
  const _n=(o,k)=>Number(o?.[k])||0;
  const ef = BILLETES.reduce((s,b)=>s+b*(_n(d.efectivo?.billetes,b)+_n(d.efectivo?.extra?.billetes,b)),0)
           + MONEDAS.reduce((s,m)=>s+m*(_n(d.efectivo?.monedas,m)+_n(d.efectivo?.extra?.monedas,m)),0);
  const vouchers=Array.isArray(d.tarjetas)?d.tarjetas:[]; let credito=0, debito=0;
  for(const v of vouchers){ if(v.tipo==='Crédito') credito+=Number(v.importe)||0; else debito+=Number(v.importe)||0; }
  if(!Array.isArray(d.tarjetas)&&d.tarjetas){ credito=Number(d.tarjetas.credito)||0; debito=Number(d.tarjetas.debito)||0; }
  const tarj=Math.round((credito+debito)*100)/100;
  const cli=(d.clientes||[]).reduce((s,x)=>s+(Number(x.importe)||0),0);
  const declarado=Math.round((ef+tarj+cli)*100)/100;
  return {efectivo:Math.round(ef*100)/100, tarjetas:tarj, credito:Math.round(credito*100)/100, debito:Math.round(debito*100)/100, clientes:Math.round(cli*100)/100, declarado};
}

// Manda los cuadros del video a la IA por lotes y devuelve el mejor cuadro por manguera:
// { manguera_id: {i, codigo, valor, legible, nitidez} }. Prefiere cuadros legibles y, entre ellos, el valor que más se repite.
async function identificarVideo(c, frames, onProg){
  const LOTE=10, PARALELO=3; const token=S.token;
  const chicas=[]; for(const f of frames) chicas.push(await imagenChica(f.blob, 1000, 0.72));
  const lotes=[]; for(let i=0;i<chicas.length;i+=LOTE) lotes.push({desde:i, imagenes:chicas.slice(i,i+LOTE)});
  const cuadros=[]; let hechos=0; let cursor=0;
  async function obrero(){ while(cursor<lotes.length){ const l=lotes[cursor++];
    const {data,error}=await sb.functions.invoke('leer-medidor',{ body:{ accion:'identificar_video', token, corte_id:c.id, imagenes:l.imagenes, desde:l.desde, tipo:'image/jpeg' } });
    if(error){ let det=error.message||String(error); try{ if(error.context&&typeof error.context.json==='function'){ const j=await error.context.json(); if(j&&j.error) det=j.error; } }catch(_){} throw new Error(det); }
    if(data&&data.error) throw new Error(data.error);
    for(const q of (data&&data.cuadros)||[]) cuadros.push(q);
    hechos+=l.imagenes.length; onProg&&onProg(Math.min(hechos,frames.length), frames.length); } }
  await Promise.all(Array.from({length:Math.min(PARALELO,lotes.length)}, obrero));
  S.cuadrosIA=cuadros;
  const porM={}; for(const q of cuadros){ if(!q.manguera_id) continue; (porM[q.manguera_id]=porM[q.manguera_id]||[]).push(q); }
  const mejor={};
  for(const [mid,qs] of Object.entries(porM)){
    const leg=qs.filter(q=>q.legible&&q.valor!=null);
    if(leg.length){ const votos={}; for(const q of leg){ const k=Number(q.valor).toFixed(3); votos[k]=(votos[k]||0)+1; } const top=Object.entries(votos).sort((a,b)=>b[1]-a[1]||Number(b[0])-Number(a[0]))[0][0];
      const cand=leg.filter(q=>Number(q.valor).toFixed(3)===top).sort((a,b)=>(b.nitidez||0)-(a.nitidez||0)); mejor[mid]={...cand[0], valor:Number(top), votos:votos[top]}; }
    else { const cand=qs.slice().sort((a,b)=>(b.nitidez||0)-(a.nitidez||0)); mejor[mid]={...cand[0], valor:null, legible:false}; }
  }
  return mejor;
}
async function imagenChica(blob, max, calidad){
  const bmp=await createImageBitmap(blob).catch(()=>null); if(!bmp) return archivoABase64(blob);
  const scale=Math.min(1, max/Math.max(bmp.width,bmp.height)); const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*scale); cv.height=Math.round(bmp.height*scale);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height); const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',calidad)); return archivoABase64(b||blob);
}
async function extraerCuadros(file, cada, onProg){
  const url=URL.createObjectURL(file); const v=document.createElement('video'); v.src=url; v.muted=true; v.playsInline=true; v.preload='auto';
  await new Promise((res,rej)=>{ v.onloadedmetadata=res; v.onerror=()=>rej(new Error('video')); });
  if(!isFinite(v.duration)){ v.currentTime=1e8; await new Promise(r=>{ v.onseeked=r; setTimeout(r,2000); }); }
  const dur=isFinite(v.duration)?v.duration:0; if(!dur) throw new Error('sin duración');
  const MAX=(S.config&&S.config.maxSegVideo)||40; if(dur>MAX+1){ URL.revokeObjectURL(url); const e=new Error(`El video dura ${Math.round(dur)} segundos y el máximo es ${MAX}. Graba otra vez: 2 o 3 segundos frente a cada pantalla, sin detenerte en lo demás.`); e.largo=true; throw e; }
  const paso=Math.max(cada, dur/48); // un cuadro por segundo, máximo 48
  const canvas=document.createElement('canvas'); const ctx=canvas.getContext('2d');
  await new Promise(r=>{ if(v.readyState>=2) r(); else v.onloadeddata=r; });
  const scale=Math.min(1, 1400/Math.max(v.videoWidth||1400, v.videoHeight||1400)); canvas.width=Math.round((v.videoWidth||1280)*scale); canvas.height=Math.round((v.videoHeight||720)*scale);
  const frames=[];
  for(let t=0.4; t<dur; t+=paso){
    await new Promise(r=>{ v.onseeked=r; v.currentTime=t; });
    ctx.drawImage(v,0,0,canvas.width,canvas.height);
    const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',0.86));
    if(blob) frames.push({t, blob, url:URL.createObjectURL(blob)});
    onProg && onProg(t/dur);
  }
  URL.revokeObjectURL(url);
  return frames;
}
async function comprimirImagen(file){
  const bmp=await createImageBitmap(file).catch(()=>null); if(!bmp) return file;
  const scale=Math.min(1, 1600/Math.max(bmp.width,bmp.height)); const c=document.createElement('canvas'); c.width=Math.round(bmp.width*scale); c.height=Math.round(bmp.height*scale);

}

function recalcular(){

  const btn=$('.btn.primary.big.block'); if(btn) btn.disabled=!ok;
  return ok;
}

// Reduce el logo a máx 600 px de ancho y ≤300 KB (PNG si viene en PNG, si no JPEG).
function reducirLogo(file){ return new Promise((res,rej)=>{ if(!/^image\/(png|jpeg)$/.test(file.type)) return rej(new Error('usa PNG o JPG')); const url=URL.createObjectURL(file); const im=new Image();
  im.onload=()=>{ URL.revokeObjectURL(url); const esc=Math.min(1,600/im.naturalWidth); const w=Math.max(1,Math.round(im.naturalWidth*esc)), hh=Math.max(1,Math.round(im.naturalHeight*esc)); const cv=document.createElement('canvas'); cv.width=w; cv.height=hh; cv.getContext('2d').drawImage(im,0,0,w,hh);
    let out=file.type==='image/png'?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',0.88); if(out.length>400000) out=cv.toDataURL('image/jpeg',0.82); if(out.length>400000){ const cv2=document.createElement('canvas'); cv2.width=Math.round(w*0.6); cv2.height=Math.round(hh*0.6); cv2.getContext('2d').drawImage(im,0,0,cv2.width,cv2.height); out=cv2.toDataURL('image/jpeg',0.8); }
    if(out.length>400000) return rej(new Error('la imagen sigue pesando más de 300 KB; usa una más sencilla')); res(out); };
  im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('no se pudo leer la imagen')); }; im.src=url; }); }
async function descargarPDF(c, btn){
  if(!window.jspdf){ toast('No se cargó el generador de PDF; revisa la conexión y vuelve a intentar.',4000); return; }
  const orig=btn?btn.textContent:''; if(btn){ btn.disabled=true; btn.textContent='Generando PDF…'; }
  try{ const blob=await generarPDF(c); const ap=(c.despachadorNombre||'').split(' ')[0]; const nombre=`Corte_${ESTACION.replace(/\s+/g,'')}_${c.fecha}_T${c.turno}_${(c.islaNombre||'').replace(/\s+/g,'')}_${ap}.pdf`;
    const url=URL.createObjectURL(blob); const a=h('a',{href:url,download:nombre}); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000); toast('PDF listo para imprimir y firmar.'); }
  catch(e){ toast('No se pudo generar el PDF: '+(e.message||e.code||e),5000); }
  if(btn){ btn.disabled=false; btn.textContent=orig; }
}

const ARCHIVOS_CACHE=new Map(); // drive_id → blob URL (mientras dure la sesión de la pestaña)
async function traerArchivo(driveId, descargar){
  const { data:{ session } } = await sb.auth.getSession(); if(!session) throw new Error('Sesión vencida: vuelve a entrar.');
  const r=await fetch(`${OM_CONFIG.SUPABASE_URL}/functions/v1/abrir-archivo`, { method:'POST',
    headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+session.access_token, apikey:OM_CONFIG.SUPABASE_KEY }, body:JSON.stringify({ drive_id:driveId, descargar:!!descargar }) });
  if(!r.ok){ let j=null; try{ j=await r.json(); }catch(e){} throw new Error((j&&j.error)||('No se pudo abrir el archivo ('+r.status+').')); }
  const blob=await r.blob(); let nombre='archivo'; try{ nombre=decodeURIComponent(r.headers.get('X-Nombre')||'')||nombre; }catch(e){}
  return { blob, nombre, mime:r.headers.get('Content-Type')||blob.type };
}
// Abrir en pestaña nueva (se abre en el clic para que el navegador no la bloquee) o descargar.
function verArchivo(driveId, o){
  o=o||{}; if(!driveId){ aviso('Este registro no tiene archivo.','err'); return; }
  let win=null;
  if(!o.descargar){ win=window.open('','_blank'); if(win){ try{ win.document.title='OwnManager · abriendo…'; win.document.body.style.cssText='margin:0;display:flex;align-items:center;justify-content:center;height:100vh;font:500 15px system-ui;color:#64748B;background:#F8FAFC'; win.document.body.textContent='Abriendo el archivo…'; }catch(e){} } }
  (async()=>{
    try{
      let url=ARCHIVOS_CACHE.get(driveId), nombre=o.nombre||'archivo';
      if(!url){ const a=await traerArchivo(driveId,o.descargar); url=URL.createObjectURL(a.blob); nombre=a.nombre||nombre; ARCHIVOS_CACHE.set(driveId,url); ARCHIVOS_CACHE.set(driveId+':nombre',nombre); }
      else nombre=ARCHIVOS_CACHE.get(driveId+':nombre')||nombre;
      if(o.descargar){ const a=h('a',{href:url,download:nombre}); document.body.append(a); a.click(); a.remove(); toast('Descargando '+nombre); }
      else if(win){ win.location.href=url; }
      else { window.open(url,'_blank'); }
    }catch(e){ if(win){ try{ win.close(); }catch(_){} } aviso(e.message||'No se pudo abrir el archivo.','err',10000,'Archivo'); }
  })();
}

const FL={ negocio:'', periodo:'todo', mes:'', fecha:'' };
function rangoFiltro(){
  const hoy=nowMX().fecha; const [y,m]=hoy.split('-').map(Number);
  const mesDe=(yy,mm)=>({ desde:`${yy}-${String(mm).padStart(2,'0')}-01`, hasta:`${yy}-${String(mm).padStart(2,'0')}-${String(new Date(Date.UTC(yy,mm,0)).getUTCDate()).padStart(2,'0')}` });
  if(FL.periodo==='actual') return mesDe(y,m);
  if(FL.periodo==='pasado') return m===1?mesDe(y-1,12):mesDe(y,m-1);
  if(FL.periodo==='mes' && /^\d{4}-\d{2}$/.test(FL.mes)){ const [a,b]=FL.mes.split('-').map(Number); return mesDe(a,b); }
  if(FL.periodo==='fecha' && /^\d{4}-\d{2}-\d{2}$/.test(FL.fecha)) return { desde:FL.fecha, hasta:FL.fecha };
  return { desde:null, hasta:null };
}
function hayFiltros(){ return !!FL.negocio || (FL.periodo!=='todo' && (FL.periodo==='actual'||FL.periodo==='pasado'||(FL.periodo==='mes'&&FL.mes)||(FL.periodo==='fecha'&&FL.fecha))); }
function barraFiltros(negocios, opts){

    per.addEventListener('change',()=>{ FL.periodo=per.value; if(per.value==='mes'&&!FL.mes) FL.mes=nowMX().fecha.slice(0,7); if(per.value==='fecha'&&!FL.fecha) FL.fecha=nowMX().fecha; render(); }); fila.append(per);
    if(FL.periodo==='mes'){ const im=h('input',{type:'month',value:FL.mes,class:'on'}); im.addEventListener('change',()=>{ FL.mes=im.value; render(); }); fila.append(im); }
    if(FL.periodo==='fecha'){ const idt=h('input',{type:'date',value:FL.fecha,class:'on'}); idt.addEventListener('change',()=>{ FL.fecha=idt.value; render(); }); fila.append(idt); }
  }
  if(hayFiltros()) fila.append(h('button',{class:'quitar',onclick:()=>{ FL.negocio=''; FL.periodo='todo'; FL.mes=''; FL.fecha=''; render(); }},'Quitar filtros'));
  return fila;
}

const ES={wizard:null};
// Periodo legible: mes completo → "OCTUBRE 2026"; si no, "1 OCT – 15 NOV 2026"
function periodoTexto(ini, fin){
  if(!ini||!fin) return '';
  const [y1,m1,d1]=ini.split('-').map(Number), [y2,m2,d2]=fin.split('-').map(Number);
  const ult=new Date(Date.UTC(y2,m2,0)).getUTCDate();
  const MES=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
  if(y1===y2&&m1===m2&&d1===1&&d2===ult) return `${MES[m1-1]} ${y1}`;
  const c=(d,m,y)=>`${d} ${MES[m-1].slice(0,3)}${y1!==y2?' '+y:''}`;
  return `${c(d1,m1,y1)} – ${c(d2,m2,y2)} ${y2}`.replace(/\s+/g,' ');
}

function saludoDelDia(){
  const t=nowMX(); const [y,m,d]=t.fecha.split('-').map(Number); const dow=new Date(Date.UTC(y,m-1,d)).getUTCDay();
  const nombre=(S.usuario&&S.usuario.nombre||'').replace(/^(Administrador|Área|Area)\s+/i,'').split(/\s+/)[0]||'';
  const hora=t.hora<12?'Buenos días':(t.hora<19?'Buenas tardes':'Buenas noches');
  const nEnMes=(k)=>{ const first=new Date(Date.UTC(y,m-1,1)).getUTCDay(); const lunes1=1+((8-first)%7); return lunes1+7*(k-1); };
  const fijos={'01-01':'¡Feliz Año Nuevo!','01-06':'Feliz Día de Reyes 👑','02-14':'Feliz Día del Amor y la Amistad ❤️','02-24':'Día de la Bandera 🇲🇽','03-08':'Día Internacional de la Mujer 💐','04-30':'Feliz Día del Niño 🎈','05-01':'Día del Trabajo','05-05':'5 de mayo · Batalla de Puebla','05-10':'Feliz Día de las Madres 💐','05-15':'Día del Maestro','06-15':'Día del Padre (este domingo) 👔','09-15':'¡Viva México! 🇲🇽 Noche del Grito','09-16':'Día de la Independencia 🇲🇽','10-12':'Día de la Raza','11-01':'Día de Todos los Santos 🕯️','11-02':'Día de Muertos 🕯️','12-12':'Día de la Virgen de Guadalupe','12-24':'Feliz Nochebuena 🎄','12-25':'¡Feliz Navidad! 🎄','12-31':'Feliz fin de año 🎉'};
  const mmdd=t.fecha.slice(5); let festivo=fijos[mmdd]||null;
  if(!festivo && m===2 && d===nEnMes(1)) festivo='Día de la Constitución 🇲🇽';
  if(!festivo && m===3 && d===nEnMes(3)) festivo='Natalicio de Benito Juárez';
  if(!festivo && m===11 && d===nEnMes(3)) festivo='Día de la Revolución 🇲🇽';
  const dia=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][dow];
  const extra= festivo || (dow===1?'Arrancamos la semana.':dow===5?'¡Feliz viernes!':dow===0?'Buen domingo.':`Excelente ${dia}.`);
  return { titulo: `${hora}${nombre?', '+nombre:''}.`, sub: extra };
}

    prov.addEventListener('change',()=>{ f.proveedorId=prov.value==='__nuevo'?'':prov.value; provNombre.style.display=prov.value==='__nuevo'?'':'none'; }); provNombre.addEventListener('input',()=>f.proveedorNombre=provNombre.value);
    const fecha=h('input',{type:'date',value:f.fecha}); fecha.addEventListener('input',()=>f.fecha=fecha.value);
    const total=h('input',{type:'number',step:'0.01',min:'0',inputmode:'decimal',value:f.total}); total.addEventListener('input',()=>f.total=total.value);
    const serie=h('input',{type:'text',value:f.serie,placeholder:'Serie'}); serie.addEventListener('input',()=>f.serie=serie.value);
    const folio=h('input',{type:'text',value:f.folio,placeholder:'Folio'}); folio.addEventListener('input',()=>f.folio=folio.value);
    const conc=h('input',{type:'text',value:f.concepto,placeholder:'Qué se facturó'}); conc.addEventListener('input',()=>f.concepto=conc.value);
    const notas=h('input',{type:'text',value:f.notas,placeholder:'Opcional'}); notas.addEventListener('input',()=>f.notas=notas.value);
    const soloXml=a.origen==='xml'; const msg=h('div',{class:'small muted'});
    const cFecha=campoRO('Fecha',fecha,f.fecha?fmtFechaLarga(f.fecha):''), cTotal=campoRO('Total',total,f.total!==''?fmtMonto(f.total):''),
          cSerie=campoRO('Serie',serie,f.serie||'Sin serie'), cFolio=campoRO('Folio',folio,f.folio), cConc=campoRO('Concepto',conc,f.concepto);
    cFecha.reset=()=>{ fecha.value=f.fecha; }; cTotal.reset=()=>{ total.value=f.total; }; cSerie.reset=()=>{ serie.value=f.serie; }; cFolio.reset=()=>{ folio.value=f.folio; }; cConc.reset=()=>{ conc.value=f.concepto; };
    const bloqueo=bloqueoDatos(w,[cFecha,cTotal,cSerie,cFolio,cConc],'factura');
    add(card, h('div',{class:'sechead'}, h('h3',{},'Paso 2 de 2 · Confirmar'), cerrar),
      h('p',{class:'small muted'}, soloXml? `Datos exactos del XML${x.uuid?' · UUID '+x.uuid:''}${x.emisor_rfc?' · RFC emisor '+x.emisor_rfc:''}` : `Leída por IA del PDF${Number(x.confianza??0.5)<0.7?' · lectura dudosa, revisa bien':''}`),
      a.aviso? h('div',{style:'padding:8px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px'},a.aviso):null,
      (a.negocios_disponibles||[]).length>1? h('label',{class:'f'},h('span',{class:'l'},'Negocio (receptor)'),neg):null,
      h('label',{class:'f'},h('span',{class:'l'},'Proveedor'+(x.emisor_nombre?' · emisor: '+x.emisor_nombre:'')),prov, provNombre),
      bloqueo.fila,
      h('div',{class:'grid2'}, cFecha.el, cTotal.el),
      h('div',{class:'grid2'}, cSerie.el, cFolio.el),
      cConc.el, h('label',{class:'f'},h('span',{class:'l'},'Notas'),notas), msg,
      h('button',{class:'btn primary big block',onclick:async e=>{
        const negocioId=f.negocioId||((a.negocios_disponibles||[])[0]||{}).id; if(!negocioId){ msg.textContent='Elige el negocio.'; return; }
        if(!f.proveedorId && !f.proveedorNombre.trim()){ msg.textContent='Escribe el nombre del proveedor.'; return; }
        if(!/^\d{4}-\d{2}-\d{2}$/.test(f.fecha)){ msg.textContent='Revisa la fecha.'; return; }
        if(!(Number(f.total)>=0)){ msg.textContent='Revisa el total.'; return; }
        const b=e.currentTarget; b.disabled=true; msg.textContent='Subiendo a Drive y registrando…';
        const j=await fnOficina({ accion:'registrar', xml_base64:w.xml?w.xml.b64:null, pdf_base64:w.pdf?w.pdf.b64:null, pdf_mime:w.pdf?w.pdf.mime:null, negocio_id:negocioId,
          proveedor_id:f.proveedorId||null, proveedor_nombre:f.proveedorId?null:f.proveedorNombre.trim(), proveedor_rfc:x.emisor_rfc||null, fecha:f.fecha, total:Number(f.total), serie:f.serie.trim()||null, folio:f.folio.trim()||null, concepto:f.concepto.trim()||null, notas:f.notas.trim()||null }, 'registrar-factura').catch(err=>({ok:false,error:err.message}));
        if(!j.ok){ b.disabled=false; msg.textContent=''; if(j.codigo==='factura_duplicada') w.paso='archivos'; render(); aviso(j.error||'No se pudo registrar la factura.','err',10000,'No se puede registrar'); return; }
        w.paso='listo'; w.resultado=j; render(); aviso(j.proveedor+' · '+j.archivo+(j.pago_ligado?' · ligada a su pago':''),'ok',6000,'Factura registrada'); }},'Registrar factura'));
    return;
  }
  if(w.paso==='listo'){ const r=w.resultado;
    add(card, h('div',{class:'sechead'}, h('h3',{},'✅ Factura registrada'), cerrar), h('p',{class:'muted'},`${r.proveedor} → ${r.negocio}`), h('p',{class:'small muted'},'Archivo en Drive: '+r.archivo),
      r.pago_ligado? h('p',{class:'small',style:'color:var(--ok)'},'Se ligó sola al pago del '+fmtFecha(r.pago_ligado)+'.'):bloqueConcepto(r,true),
      r.pago_ligado||r.referencia_especial||!r.concepto_pago? null : h('p',{class:'small muted'},'Escribe ese concepto en la transferencia; así el comprobante se liga solo a esta factura.'),
      h('div',{class:'row'}, r.drive? h('a',{class:'btn ghost',href:r.drive,target:'_blank',rel:'noopener'},'Abrir en Drive'):null, h('button',{class:'btn primary',onclick:()=>{ FA.wizard={paso:'archivos'}; render(); }},'Agregar otra'), h('button',{class:'btn ghost',onclick:()=>{ FA.wizard={paso:'archivos'}; if(S.rol==='oficina') oficinaTab='cfacturas'; else adminTab='cfacturas'; render(); }},'Ver facturas'))); }
}

// La rueda del mouse no debe cambiar valores numéricos (al girar sobre un campo con foco, se quita el foco)
document.addEventListener('wheel', e=>{ const a=document.activeElement; if(a && a.tagName==='INPUT' && a.type==='number' && (e.target===a || a.contains(e.target))) a.blur(); }, {passive:true});
document.addEventListener('keydown', e=>{ const a=e.target; if(a && a.tagName==='INPUT' && a.type==='number' && (e.key==='ArrowUp'||e.key==='ArrowDown')) e.preventDefault(); });
document.addEventListener('keydown', e=>{ if(S.pinTeclado && !(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) S.pinTeclado(e); });
// ---- Cierre automático por inactividad (5 min): guarda lo capturado y regresa a la pantalla de despachadores
const INACTIVO_MS=5*60*1000; let ultimaActividad=Date.now(), inactT=null;
function tocar(){ ultimaActividad=Date.now(); clearTimeout(inactT); if(S.me) inactT=setTimeout(revisarInactividad, INACTIVO_MS+500); }
function revisarInactividad(){
  if(!S.me) return;
  if(Date.now()-ultimaActividad<INACTIVO_MS || S.esperandoArchivo){ tocar(); return; }
  if(document.visibilityState==='hidden') return;
  cerrarPorInactividad();
}
async function cerrarPorInactividad(){
  clearTimeout(inactT);
  try{ if(S.me && S.corte && S.corte.estado==='abierto') await guardarAvance(); }catch(e){}
  document.querySelectorAll('.sheet,.lightbox').forEach(x=>x.remove());
  const t=S.token; S.me=null; S.corte=null; S.frames=[]; S.token=null; S.esperandoArchivo=false; guardarToken(null);
  go('login'); toast('Sesión cerrada por inactividad. Lo que ya habías capturado quedó guardado.',6000);
  try{ if(t) await rpc('cerrar_sesion',{p_token:t}); }catch(e){}
}
['pointerdown','keydown','touchstart','input','wheel'].forEach(ev=>document.addEventListener(ev,tocar,{passive:true,capture:true}));
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState!=='visible') return; if(S.esperandoArchivo){ S.esperandoArchivo=false; tocar(); return; } if(S.me && Date.now()-ultimaActividad>=INACTIVO_MS) cerrarPorInactividad(); else tocar(); });
window.addEventListener('focus',()=>{ if(S.esperandoArchivo){ S.esperandoArchivo=false; tocar(); } });
// ---- go
if(/[?&]om_test=1\b/.test(location.search)) window.__om={ S, omLoader, renderFotosListas, leerConIA, render }; // solo para la prueba de humo
boot();
})();
