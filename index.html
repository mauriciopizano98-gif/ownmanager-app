<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Own Manager</title>
<meta name="theme-color" content="#07080A">
<link rel="icon" type="image/png" sizes="192x192" href="marca/favicon-192.png">
<link rel="apple-touch-icon" href="marca/om-isotipo-lima-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: una sola columna centrada (máx 720px), tarjetas redondeadas, botones píldora. Marca Own Manager; el logo de la cabecera es el de la estación de la cuenta. */
:root{
  /* Tema claro = "versión positiva" del manual Own Manager: fondo #F8FAFC, texto Azul Petróleo #0F172A, acentos cian/naranja */
  --rojo:#E11D48; --azul:#0284C7; --cyan:#0284C7; --verde:#059669; --noche:#0F172A;
  --bg:#F8FAFC; --surface:#FFFFFF; --surface2:#F1F5F9; --fg:#0F172A; --muted:#475569; --line:#E2E8F0;
  --accent:#0F172A; --accent-fg:#FFFFFF; --accent-soft:#E2E8F0; --focus:#00B4D8; --focus-soft:rgba(0,180,216,.25);
  --ok:#059669; --ok-soft:#ECFDF5; --warn:#D97706; --warn-soft:#FEF3C7; --err:#E11D48; --err-soft:#FFF1F2; --info:#0284C7;
  --neon-fg:#FFFFFF; --noche-fg:#FFFFFF;
  --font-mono:"JetBrains Mono","Roboto Mono",ui-monospace,monospace;
  --font-display:"Nunito","Quicksand","Segoe UI",system-ui,sans-serif;
  --font-body:"Inter","Helvetica Neue",Arial,system-ui,sans-serif;
  --r:18px; --r-sm:12px; --shadow:0 1px 2px rgba(14,29,62,.07),0 6px 18px rgba(14,29,62,.07);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#07080A; --surface:#11141C; --surface2:#181C26; --fg:#F8FAFC; --muted:#94A3B8; --line:#262C3A;
  --accent:#CCFF00; --accent-fg:#07080A; --accent-soft:#2A3310; --neon-fg:#07080A; --focus:#00F5D4; --focus-soft:rgba(0,245,212,.25); --info:#00B4D8;
  --azul:#00F5D4; --cyan:#00F5D4; --verde:#00E676; --noche:#CCFF00; --noche-fg:#07080A;
  --ok:#00E676; --ok-soft:#0F2A1C; --warn:#FFB300; --warn-soft:#2E2410; --err:#FF3366; --err-soft:#2E1420;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#07080A; --surface:#11141C; --surface2:#181C26; --fg:#F8FAFC; --muted:#94A3B8; --line:#262C3A;
  --accent:#CCFF00; --accent-fg:#07080A; --accent-soft:#2A3310; --neon-fg:#07080A; --focus:#00F5D4; --focus-soft:rgba(0,245,212,.25); --info:#00B4D8;
  --azul:#00F5D4; --cyan:#00F5D4; --verde:#00E676; --noche:#CCFF00; --noche-fg:#07080A;
  --ok:#00E676; --ok-soft:#0F2A1C; --warn:#FFB300; --warn-soft:#2E2410; --err:#FF3366; --err-soft:#2E1420;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top::after{content:"";display:block;height:3px;background:linear-gradient(90deg,#00F5D4 0%,#CCFF00 55%,#FFFF00 100%)}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.logo{height:56px;width:auto;max-width:min(52vw,260px);object-fit:contain;display:block}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .om{width:38px;height:38px;border-radius:10px;flex:none;background:#07080A;padding:5px;object-fit:contain}
/* Pantalla de entrada: siempre en modo Abyss (#07080A), como marca el manual de Own Manager */
body[data-om-login]{background:#07080A;color:#F8FAFC;color-scheme:dark}
body[data-om-login]::before{background:#07080A}
body[data-om-login] .top{display:none}
body[data-om-login] .foot{display:none}
.om-login{min-height:calc(100vh - 62px);display:flex;flex-direction:column;justify-content:center;gap:22px;padding:24px 0;
  --bg:#07080A; --surface:#11141C; --surface2:#181C26; --fg:#F8FAFC; --muted:#94A3B8; --line:#262C3A; --accent:#CCFF00; --accent-fg:#07080A; --accent-soft:#2A3310; --err:#FF3366; --err-soft:#2E1420; --shadow:none}
.om-login .hero{text-align:center}
.om-login .om-hero{width:132px;height:132px;display:block;margin:0 auto 10px}
.om-login .om-wordmark{font:800 30px/1.1 var(--font-body);letter-spacing:-.02em;color:#F8FAFC}
.om-login .om-slogan{font:500 13px/1.4 var(--font-body);color:#94A3B8;margin-top:6px;letter-spacing:.01em}
.om-login .card{background:#11141C;border:1px solid #262C3A;color:#F8FAFC}
.om-login input{background:#181C26;border-color:#262C3A;color:#F8FAFC}
.om-login input:focus{outline:3px solid rgba(0,245,212,.25);border-color:#00F5D4}
.om-login .btn.primary{background:#CCFF00;color:#07080A;border-color:#CCFF00;font-weight:700}
.om-login .btn.primary:focus-visible{outline:3px solid #00F5D4}
.om-login .hint{color:#94A3B8}
.om-login .bar{height:3px;border-radius:2px;background:linear-gradient(90deg,#00F5D4 0%,#CCFF00 55%,#FFFF00 100%);width:120px;margin:14px auto 0}
/* Pie de página con la marca del programa */
.foot{max-width:720px;margin:0 auto;padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font:600 12px var(--font-body);letter-spacing:.02em}
.foot img{width:22px;height:22px;object-fit:contain;opacity:.9}
.foot .lima{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .foot .lima{display:block} :root:not([data-theme="light"]) .foot .mono{display:none} }
:root[data-theme="dark"] .foot .lima{display:block} :root[data-theme="dark"] .foot .mono{display:none}
:root[data-theme="light"] .foot .lima{display:none} :root[data-theme="light"] .foot .mono{display:block}
.brand .nm{font:800 19px/1.1 var(--font-display);letter-spacing:-.01em;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .nm small{display:block;font:600 10.5px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.logo-prev{height:64px;width:auto;max-width:260px;object-fit:contain;display:block;background:#fff;color:#0E1D3E;border:1px solid var(--line);border-radius:10px;padding:6px}
/* --- Aceites --- */
.acgrp{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.acgrp > .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--surface2);font:800 14px var(--font-display)}
.acrow{display:grid;grid-template-columns:minmax(0,1fr) auto 86px;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.acrow .nm{min-width:0;font-size:13.5px;line-height:1.3}
.acrow .nm small{display:block;color:var(--muted);font-size:11.5px}
.acrow.mov{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.step{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface2)}
.step button{border:0;background:transparent;width:40px;height:40px;font:800 20px var(--font-display);color:var(--accent);cursor:pointer;line-height:1}
.step button:active{background:var(--accent-soft)}
.step button[disabled]{color:var(--line);cursor:not-allowed}
.step input{width:46px;min-height:40px;padding:0;text-align:center;border:0;background:transparent;font:800 17px var(--font-display);font-variant-numeric:tabular-nums;color:var(--fg)}
.step input:focus{outline:2px solid var(--focus);border-radius:8px}
.acrow .vd{text-align:right;font-variant-numeric:tabular-nums;font:700 14px var(--font-mono)}
.acrow .vd.cero{color:var(--muted);font-weight:500}
@media (max-width:420px){.acrow{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}.acrow .vd{grid-column:2;text-align:right}}
.acadm{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.acadm input[type=text]{min-height:40px}
.acadm input[type=number]{min-height:40px;text-align:right}
.acadm.off{opacity:.5}
/* En tema oscuro el logo de la estación va sobre una placa clara (los logos suelen venir para fondo blanco) */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand .logo{background:#fff;border-radius:10px;padding:4px 8px;height:52px} }
:root[data-theme="dark"] .brand .logo{background:#fff;border-radius:10px;padding:4px 8px;height:52px}
@media (max-width:520px){.logo{height:44px}}
.top .who{display:flex;align-items:center;gap:10px;min-width:0}
.gear{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.gear:hover{color:var(--fg);border-color:var(--accent)}
.gear svg{display:block}
.top .who .name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card + .card, .stack > * + *{margin-top:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}

/* Buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 15px var(--font-body);padding:12px 18px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--accent-soft);outline-offset:1px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:var(--neon-fg);border-color:var(--ok)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.big{min-height:56px;font-size:17px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.err{background:var(--err-soft);color:var(--err)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* Inputs */
label.f{display:block}
label.f span.l{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=email],input[type=number],input[type=password],select,textarea{width:100%;font:500 16px var(--font-body);color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;min-height:46px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--focus-soft);border-color:var(--focus)}
input.num{font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:20px;font-weight:600;letter-spacing:.01em}
input.bad{border-color:var(--err);background:var(--err-soft)}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}

/* Login */
.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.modo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 6px}
.modo button{border:2px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;color:var(--fg);font-family:var(--font-body)}
.modo button .ic{font-size:26px;line-height:1}
.modo button b{display:block;font:800 16px var(--font-display)}
.modo button small{display:block;font-size:12px;color:var(--muted)}
.modo button.on{border-color:var(--accent);background:var(--accent-soft)}
.modo button.on.dep{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.depbox{border:1.5px dashed var(--ok);border-radius:var(--r-sm);padding:12px;background:color-mix(in srgb,var(--ok) 6%,var(--surface))}
.depbox .money.small{font-size:13px}
.person{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 14px;text-align:left;cursor:pointer;font:600 15px var(--font-body);color:var(--fg);display:flex;align-items:center;gap:10px;min-height:64px}
.person:hover{border-color:var(--accent)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font:800 15px var(--font-display);flex:none}
.pin{display:flex;gap:10px;justify-content:center;margin:12px 0}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.pin i.on{background:var(--accent);border-color:var(--accent)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
.key{aspect-ratio:1.5;border-radius:16px;border:1px solid var(--line);background:var(--surface);font:800 24px var(--font-display);color:var(--fg);cursor:pointer}
.key:active{background:var(--accent-soft)}

/* Islas */
.isla{border:2px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);cursor:pointer;text-align:left;font-family:var(--font-body);color:var(--fg);display:flex;flex-direction:column;gap:6px;min-height:96px}
.isla.sel{border-color:var(--accent);background:var(--accent-soft)}
.isla.done{opacity:.72}
.islacell{display:flex;flex-direction:column;gap:6px}
.islacell .isla{flex:1;width:100%}
.nouso{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:6px 8px;border:1px dashed var(--line);border-radius:12px;cursor:pointer;user-select:none}
.nouso input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.nouso:hover{color:var(--fg);border-color:var(--accent)}
.isla .t{font:800 18px var(--font-display)}
.turno-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface2);padding:4px;border-radius:999px}
.turno-seg button{border:0;background:transparent;border-radius:999px;padding:9px 6px;font:600 13px var(--font-body);color:var(--muted);cursor:pointer}
.turno-seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* Captura */
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line);display:block}
.steps i.on{background:var(--accent)} .steps i.done{background:var(--ok)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer}
.mrow.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mrow.omit,.lect.omit{background:var(--surface2);border-style:dashed}
.mrow.omit .thumb,.lect.omit .thumb{opacity:.5}
.mrow .thumb{width:64px;height:64px;border-radius:10px;background:var(--surface2);object-fit:cover;display:block;border:1px solid var(--line)}
.mrow .thumb.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px}
.mrow .mt{font:800 16px var(--font-display)}
.film{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.fr{position:relative;flex:none;scroll-snap-align:start;cursor:pointer;border-radius:12px;border:3px solid transparent;background:var(--surface2);transition:transform .12s ease}
.fr:active{transform:scale(.97)}
.fr img{height:124px;width:auto;border-radius:9px;display:block}
.fr .tag{position:absolute;top:6px;left:6px;right:6px;display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:999px;font:800 12px var(--font-display);color:#fff;letter-spacing:.01em;box-shadow:0 2px 6px rgba(0,0,0,.35);pointer-events:none}
.fr .tag b{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#fff;color:inherit;align-items:center;justify-content:center;font-size:11px;flex:none}
.fr .tag span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .t{position:absolute;bottom:6px;right:8px;font:600 11px var(--font-body);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none}
.fr.sel{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--mc)}
.now{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);color:#fff;background:var(--mc);box-shadow:var(--shadow)}
.now .n{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--mc);display:inline-flex;align-items:center;justify-content:center;font:800 18px var(--font-display);flex:none}
.now .l{font:800 19px var(--font-display);line-height:1.15}
.now .s{font-size:12.5px;opacity:.9}
.now.done{background:var(--ok)}
.mrow{border-left:6px solid var(--mc,var(--line))}
.mrow .mt .sw{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--mc);margin-right:6px;vertical-align:middle}
.mrow.active{border-color:var(--mc);box-shadow:0 0 0 3px color-mix(in srgb,var(--mc) 25%,transparent)}
.preview{width:100%;max-height:52vh;object-fit:contain;border-radius:var(--r-sm);background:#000;display:block}
.lect{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.lect .thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in;background:var(--surface2)}
.lect .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.lect .litros{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lect .litros b{font:800 22px var(--font-display);font-variant-numeric:tabular-nums}
.lect .litros b.neg{color:var(--err)}
.lect .alert{grid-column:1/-1;font-size:12.5px;padding:6px 10px;border-radius:8px}
.lect .alert.err{background:var(--err-soft);color:var(--err)} .lect .alert.warn{background:var(--warn-soft);color:var(--warn)}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tot div{background:var(--surface2);border-radius:var(--r-sm);padding:12px}
.tot b{display:block;font:800 24px var(--font-display);font-variant-numeric:tabular-nums}
.sheet{position:fixed;inset:0;background:rgba(10,18,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.sheet .in{background:var(--surface);width:100%;max-width:720px;border-radius:24px 24px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.lightbox{position:fixed;inset:0;background:#000;z-index:60;display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px))}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--noche);color:var(--noche-fg);padding:12px 18px;border-radius:999px;font-weight:600;z-index:70;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
:root[data-theme="dark"] .toast{background:#F2F5F9;color:#1C2A39}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .toast{background:#F2F5F9;color:#1C2A39} }
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* Loader de marca Own Manager: cubo quieto, gota que se llena con el degradado termográfico y late; barra de pulso debajo. */
:root{--om-stroke:#0F172A; --om-g1:#D97706; --om-g2:#D97706; --om-g3:#F59E0B}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--om-stroke:#CCFF00; --om-g1:#00F5D4; --om-g2:#CCFF00; --om-g3:#FFFF00} }
:root[data-theme="dark"]{--om-stroke:#CCFF00; --om-g1:#00F5D4; --om-g2:#CCFF00; --om-g3:#FFFF00}
.om-login, body[data-om-login], .om-splash[data-dark]{--om-stroke:#CCFF00; --om-g1:#00F5D4; --om-g2:#CCFF00; --om-g3:#FFFF00}
.om-loader{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--om-stroke)}
.om-loader.chico{display:inline-flex;flex-direction:row;gap:8px;align-items:center;color:inherit}
.om-loader svg{display:block;width:120px;height:120px;overflow:visible}
.om-loader.chico svg{width:22px;height:22px}
.om-loader .cubo{fill:currentColor;stroke:none}
.om-loader.chico .cubo{stroke:currentColor;stroke-width:1.2;stroke-linejoin:round}
.om-loader .gota-g{transform-box:fill-box;transform-origin:50% 55%;animation:om-beat 1.6s ease-in-out infinite}
.om-loader .gota-rel{transform-box:fill-box;transform-origin:50% 100%;animation:om-fill 2.2s ease-in-out infinite}
.om-loader .pulso{width:120px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--om-g1),var(--om-g2),var(--om-g3),var(--om-g2),var(--om-g1));background-size:220% 100%;animation:om-slide 1.4s linear infinite}
.om-loader .txt{font:500 12.5px/1.4 var(--font-mono);color:var(--muted);text-align:center;letter-spacing:.01em;min-height:18px;font-variant-numeric:tabular-nums}
.om-loader.chico .txt{font:600 inherit;font-family:var(--font-body);color:inherit;min-height:0;text-align:left}
.om-loader.listo .gota-g,.om-loader.listo .gota-rel{animation:none}
.om-loader.listo .pulso{animation:none;background:var(--ok);background-size:100% 100%}
@keyframes om-beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes om-fill{0%{transform:scaleY(.08)}62%{transform:scaleY(1)}86%{transform:scaleY(1)}100%{transform:scaleY(.08)}}
@keyframes om-slide{from{background-position:0 0}to{background-position:220% 0}}
@media (prefers-reduced-motion:reduce){.om-loader .gota-g,.om-loader .gota-rel,.om-loader .pulso{animation:none}.om-loader .gota-rel{transform:scaleY(1)}}
/* Barra de pulso bajo la cabecera (carga del tablero) */
.top{position:sticky}
.om-topbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--om-g1),var(--om-g2),var(--om-g3),var(--om-g2),var(--om-g1));background-size:220% 100%;animation:om-slide 1.1s linear infinite;opacity:0;transition:opacity .2s;pointer-events:none;z-index:1}
.om-topbar.on{opacity:1}
@media (prefers-reduced-motion:reduce){.om-topbar{animation:none}}
/* Splash de entrada */
.om-splash{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .22s ease}
.om-splash.off{opacity:0;pointer-events:none}
.om-splash .om-loader svg{width:140px;height:140px}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* Admin */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font:600 13.5px var(--font-body);color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--noche);color:var(--noche-fg);border-color:var(--noche)}
:root[data-theme="dark"] .tabs button.on{background:#F2F5F9;color:#1C2A39;border-color:#F2F5F9}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tabs button.on{background:#F2F5F9;color:#1C2A39;border-color:#F2F5F9} }
.matrix{display:grid;grid-template-columns:70px repeat(3,1fr);gap:6px;font-size:12.5px}
.matrix .h{color:var(--muted);font-weight:600;text-align:center}
.matrix .c{border-radius:10px;padding:8px 6px;text-align:center;background:var(--surface2);min-height:52px;display:flex;flex-direction:column;justify-content:center;gap:2px;cursor:pointer}
.matrix .c.sent{background:var(--ok-soft);color:var(--ok)} .matrix .c.open{background:var(--warn-soft);color:var(--warn)} .matrix .c.none{color:var(--muted)}
.matrix .c b{font:800 15px var(--font-display);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer}
.item .l{min-width:0}
.item .l b{display:block;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;font:800 17px var(--font-display);color:var(--fg);margin-bottom:4px}
.foto{width:100%;border-radius:var(--r-sm);border:1px solid var(--line);display:block;background:var(--surface2)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fotos figure{margin:0}
.fotos figcaption{font-size:12.5px;margin-top:4px}
.seal{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all;color:var(--muted)}
/* Dinero */
.den{display:grid;grid-template-columns:minmax(0,1fr) 72px 72px minmax(0,1fr);gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.denhead{display:grid;grid-template-columns:minmax(0,1fr) 72px 72px minmax(0,1fr);gap:8px;padding:2px 0 4px}
.denhead span{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center}
.den input.extra{background:color-mix(in srgb,var(--accent) 8%,var(--surface2));border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.den:last-child{border-bottom:0}
.den .d{font:800 16px var(--font-display);font-variant-numeric:tabular-nums}
.den .d small{font:600 12px var(--font-body);color:var(--muted);margin-left:4px}
.den input{text-align:center}
.den .st{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.den .st b{color:var(--fg)}
.money{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.money:last-child{border-bottom:0}
.money b{font:700 19px var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.money.total b{font-size:26px}
.diff{border-radius:var(--r);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.diff b{font:800 26px var(--font-display);font-variant-numeric:tabular-nums}
.diff.ok{background:var(--ok-soft);color:var(--ok)} .diff.bad{background:var(--err-soft);color:var(--err)} .diff.warn{background:var(--warn-soft);color:var(--warn)}
.diff .lbl{font-weight:700}
.cli{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.cli:last-child{border-bottom:0}
@media (max-width:420px){.den,.denhead{grid-template-columns:minmax(0,1fr) 58px 58px minmax(0,1fr);gap:5px}.den input{padding:8px 4px;font-size:17px}.cli{grid-template-columns:1fr 120px}}
.mxwrap{position:relative}
.mxwrap .sym{position:absolute;left:12px;top:50%;transform:translateY(-50%);font:800 18px var(--font-display);color:var(--muted);pointer-events:none}
.mxwrap input{padding-left:30px;text-align:right}
.secnav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
@media (max-width:440px){.secnav{gap:3px}.secnav button{padding:7px 2px;font-size:11px}.secnav button b{font-size:14px}}
.secnav button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;font:700 12.5px var(--font-body);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.secnav button b{font:800 16px var(--font-display);color:var(--fg)}
.secnav button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.secnav button.on b{color:var(--accent)}
.secnav button.done{border-color:var(--ok);color:var(--ok)}
.vrow{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow .x{min-height:46px;min-width:46px;padding:0 12px}
@media (max-width:560px){.vrow{grid-template-columns:1fr 1fr}.vrow .mxwrap{grid-column:1/2}.vrow .x{grid-column:2/3;justify-self:end}}
.sheet .in .list .item{cursor:pointer}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* Reporte de calidad */
.score{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center;padding:16px;border-radius:var(--r);background:var(--surface2)}
.score.ok{background:var(--ok-soft)} .score.acc{background:var(--accent-soft)} .score.warn{background:var(--warn-soft)} .score.err{background:var(--err-soft)}
.score .cara{font-size:40px;line-height:1}
.score h2{font-size:24px;margin:4px 0}
.ringbox svg{display:block;max-width:100%}
@media (max-width:460px){.score{grid-template-columns:1fr;justify-items:center;text-align:center}}
.bar .track{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin-top:4px}
.bar .track i{display:block;height:100%;border-radius:7px;transition:width .4s ease}
.comp{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
@media (max-width:460px){.comp{grid-template-columns:1fr;justify-items:center}}
.legend{display:flex;flex-direction:column;gap:6px;min-width:0}
.lg{display:grid;grid-template-columns:12px 1fr auto 44px;gap:8px;align-items:center;font-size:14px}
.lg i{width:12px;height:12px;border-radius:3px;display:block}
.lg.tot{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.lg .muted{text-align:right}
.fact{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface2);font-size:14px}
.fact .ic{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:var(--line);color:var(--muted)}
.fact.ok .ic{background:var(--ok);color:var(--neon-fg)} .fact.bad .ic{background:var(--err);color:var(--neon-fg)}
.fact b{color:var(--err)}
.ia{background:var(--surface2);border-radius:var(--r);padding:14px 16px;border-left:5px solid var(--azul)}
.iatxt p{margin:0 0 6px;line-height:1.5} .iatxt p:last-child{margin:0}
.sechead h2{font-size:22px}
</style>
</head>

// ---- tiempo en México
function nowMX(){
  const p = new Intl.DateTimeFormat('es-MX',{timeZone:TZ,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value;
  const hh = Number(g('hour'))%24;
  return { fecha:`${g('year')}-${g('month')}-${g('day')}`, hora:hh, min:Number(g('minute')), hhmm:`${String(hh).padStart(2,'0')}:${g('minute')}` };
}
function addDays(fecha, d){ const [y,m,dd]=fecha.split('-').map(Number); const t=new Date(Date.UTC(y,m-1,dd+d)); return t.toISOString().slice(0,10); }
function fmtFecha(f){ if(!f) return ''; const [y,m,d]=f.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)).toLocaleDateString('es-MX',{timeZone:'UTC',weekday:'short',day:'numeric',month:'short'}); }
function fmtHora(iso){ if(!iso) return ''; return new Date(iso).toLocaleTimeString('es-MX',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false}); }
const VENTANA_CIERRE_MIN=240; // 4 h después del cierre, el corte sigue siendo de ese turno
const toMin = s => { const [a,b]=s.split(':').map(Number); return a*60+b; };
// Fecha en que EMPEZÓ la ocurrencia más reciente de un turno (si empezó antes de medianoche y ya pasó, fue ayer)
function fechaInicioTurno(tu, t){ const ini=toMin(tu.inicio); const mins=t.hora*60+t.min; return mins>=ini ? t.fecha : addDays(t.fecha,-1); }
// Turno preseleccionado para el corte: el que cerró hace menos de 4 h; si no, el que va corriendo.
function turnoSugerido(){
  const t=nowMX(); const mins=t.hora*60+t.min;
  let best=null;
  for(const tu of S.config.turnos){ const dist=(mins-toMin(tu.fin)+1440)%1440; if(best==null || dist<best.dist) best={tu,dist}; }
  if(best && best.dist<=VENTANA_CIERRE_MIN){ const tu=best.tu; const dur=(toMin(tu.fin)-toMin(tu.inicio)+1440)%1440; const inicioMins=mins-best.dist-dur; return { turno:tu.id, fecha:addDays(t.fecha, Math.floor(inicioMins/1440)) }; }
  return turnoEnCurso();
}
// Turno que va corriendo ahora mismo (para los depósitos a caja fuerte durante el turno)
function turnoEnCurso(){
  const t=nowMX(); const mins=t.hora*60+t.min;
  for(const tu of S.config.turnos){ const ini=toMin(tu.inicio), fin=toMin(tu.fin);
    if(fin>ini){ if(mins>=ini && mins<fin) return {turno:tu.id, fecha:t.fecha}; }
    else { if(mins>=ini) return {turno:tu.id, fecha:t.fecha}; if(mins<fin) return {turno:tu.id, fecha:addDays(t.fecha,-1)}; } }
  const tu=S.config.turnos[0]; return {turno:tu.id, fecha:fechaInicioTurno(tu,t)};
}
// Fecha para un turno elegido a mano: su ocurrencia más reciente (a mediodía, "Nocturno" es el de anoche)
function fechaDeTurno(turnoId){ const tu=S.config.turnos.find(x=>x.id===turnoId); return fechaInicioTurno(tu, nowMX()); }

const fmtMXN = n => (Number(n)||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'});
const BILLETES=[1000,500,200,100,50,20]; const MONEDAS=[20,10,5,2,1,0.5];

// ---- DEPÓSITOS A CAJA FUERTE durante el turno (mini arqueo, inmutable una vez registrado)
async function depositosDe(despId, fecha, turno){
  // Fuente de verdad: el servidor (RPC mis_depositos, migración 005). Si no responde, se usa lo recordado en el dispositivo.
  try{
    const rows=await rpc('mis_depositos',{p_token:S.token, p_fecha:fecha, p_turno:turno});
    return (rows||[]).map(r=>{ let den={}; try{ den=JSON.parse(r.nota||'{}'); }catch(e){}
      return { id:r.id, despachadorId:despId, fecha:r.fecha, turno:r.turno, en:r.en, hora:fmtHora(r.en), billetes:den.billetes||{}, monedas:den.monedas||{}, total:Number(r.importe) }; });
  }catch(e){}
  let all=[]; try{ all=JSON.parse(localStorage.getItem('om_depositos')||'[]'); }catch(e){}
  return all.filter(d=>d.despachadorId===despId && d.fecha===fecha && d.turno===turno).sort((a,b)=>a.en<b.en?-1:1);
}
function recordarDeposito(d){ try{ const all=JSON.parse(localStorage.getItem('om_depositos')||'[]'); all.push(d); const corte=Date.now()-3*86400e3; localStorage.setItem('om_depositos', JSON.stringify(all.filter(x=>new Date(x.en).getTime()>corte))); }catch(e){} }
function sumaDenominaciones(deps){ const b={}, m={}; for(const d of deps){ for(const [k,v] of Object.entries(d.billetes||{})) b[k]=(b[k]||0)+(Number(v)||0); for(const [k,v] of Object.entries(d.monedas||{})) m[k]=(m[k]||0)+(Number(v)||0); } return {billetes:b, monedas:m}; }
function totalDenominaciones(billetes, monedas){ return Math.round((BILLETES.reduce((s,b)=>s+b*(Number(billetes?.[b])||0),0)+MONEDAS.reduce((s,mo)=>s+mo*(Number(monedas?.[mo])||0),0))*100)/100; }

function catAceites(){ return (S.config.aceites||[]).filter(a=>a.activo!==false); }
// Venta de aceites: el despachador cuenta las piezas que vendió. Sin inventario.
function calcAceites(c){
  const v=(c.aceites&&c.aceites.vendidas)||{}; const r={lineas:[],piezas:0,importe:0};
  for(const p of catAceites()){
    const n=Number(v[p.id])||0; if(n<=0) continue;
    const imp=Math.round(n*(Number(p.precio)||0)*100)/100;
    r.lineas.push({id:p.id,nombre:p.nombre,precio:Number(p.precio)||0,piezas:n,importe:imp});
    r.piezas+=n; r.importe+=imp;
  }
  r.importe=Math.round(r.importe*100)/100;
  return r;
}
function calcVenta(c){
  const precios=(S.config.precios)||{}; const por={}; let importe=0, completo=true;
  for(const l of c.lecturas){ if(l.litros==null) continue; const p=por[l.producto]||(por[l.producto]={litros:0,precio:precios[l.producto]??null,importe:0}); p.litros+=l.litros; }
  for(const [prod,p] of Object.entries(por)){ if(p.precio==null){ completo=false; continue; } p.importe=Math.round(p.litros*p.precio*100)/100; importe+=p.importe; }
  const comb=Math.round(importe*100)/100; const ac=calcAceites(c);
  return {porProducto:por, combustible:comb, aceites:ac.importe, aceitesPiezas:ac.piezas, importe:Math.round((comb+ac.importe)*100)/100, completo};
}
function calcDinero(d){
  const _n=(o,k)=>Number(o?.[k])||0;
  const ef = BILLETES.reduce((s,b)=>s+b*(_n(d.efectivo?.billetes,b)+_n(d.efectivo?.extra?.billetes,b)),0)
           + MONEDAS.reduce((s,m)=>s+m*(_n(d.efectivo?.monedas,m)+_n(d.efectivo?.extra?.monedas,m)),0);
  const vouchers=Array.isArray(d.tarjetas)?d.tarjetas:[]; let credito=0, debito=0;
  for(const v of vouchers){ if(v.tipo==='Crédito') credito+=Number(v.importe)||0; else debito+=Number(v.importe)||0; }
  if(!Array.isArray(d.tarjetas)&&d.tarjetas){ credito=Number(d.tarjetas.credito)||0; debito=Number(d.tarjetas.debito)||0; }
  const tarj=Math.round((credito+debito)*100)/100;
  const cli=(d.clientes||[]).reduce((s,x)=>s+(Number(x.importe)||0),0);
  const declarado=Math.round((ef+tarj+cli)*100)/100;
  return {efectivo:Math.round(ef*100)/100, tarjetas:tarj, credito:Math.round(credito*100)/100, debito:Math.round(debito*100)/100, clientes:Math.round(cli*100)/100, declarado};
}

async function extraerCuadros(file, cada, onProg){
  const url=URL.createObjectURL(file); const v=document.createElement('video'); v.src=url; v.muted=true; v.playsInline=true; v.preload='auto';
  await new Promise((res,rej)=>{ v.onloadedmetadata=res; v.onerror=()=>rej(new Error('video')); });
  if(!isFinite(v.duration)){ v.currentTime=1e8; await new Promise(r=>{ v.onseeked=r; setTimeout(r,2000); }); }
  const dur=isFinite(v.duration)?v.duration:0; if(!dur) throw new Error('sin duración');
  const paso=Math.max(cada, dur/60); // máximo 60 cuadros
  const canvas=document.createElement('canvas'); const ctx=canvas.getContext('2d');
  await new Promise(r=>{ if(v.readyState>=2) r(); else v.onloadeddata=r; });
  const scale=Math.min(1, 1400/Math.max(v.videoWidth||1400, v.videoHeight||1400)); canvas.width=Math.round((v.videoWidth||1280)*scale); canvas.height=Math.round((v.videoHeight||720)*scale);
  const frames=[];
  for(let t=0.4; t<dur; t+=paso){
    await new Promise(r=>{ v.onseeked=r; v.currentTime=t; });
    ctx.drawImage(v,0,0,canvas.width,canvas.height);
    const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',0.86));
    if(blob) frames.push({t, blob, url:URL.createObjectURL(blob)});
    onProg && onProg(t/dur);
  }
  URL.revokeObjectURL(url);
  return frames;
}
async function comprimirImagen(file){
  const bmp=await createImageBitmap(file).catch(()=>null); if(!bmp) return file;
  const scale=Math.min(1, 1600/Math.max(bmp.width,bmp.height)); const c=document.createElement('canvas'); c.width=Math.round(bmp.width*scale); c.height=Math.round(bmp.height*scale);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); return await new Promise(r=>c.toBlob(r,'image/jpeg',0.86));
}

    try{
      const {data,error}=await sb.functions.invoke('leer-medidor',{ body:{ token, corte_id:c.id, manguera_id:l.mangueraId } });
      if(error) throw error;
      const r=data||{}; const val=(typeof r.valor==='number' && isFinite(r.valor)) ? r.valor : null;
      l.lecturaIA=val; l.legibleIA=!!(r.legible&&val!=null); l.notaIA=r.nota||r.error||'';
      if(l.final==null && val!=null){ l.final=val; l.origen='ia'; }
    }catch(e){ l.lecturaIA=null; l.legibleIA=false; console.warn('leer-medidor', e);
      // Explica el motivo (la función devuelve {error}) para poder corregirlo, en vez de fallar en silencio.
      let det=e&&e.message||String(e); try{ if(e&&e.context&&typeof e.context.json==='function'){ const j=await e.context.json(); if(j&&j.error) det=j.error; } }catch(_){}
      if(!S._iaErrorAvisado){ S._iaErrorAvisado=true; toast('La IA no pudo leer: '+det, 9000); } }
    hechas++;
    if(S.corte&&S.corte.id===c.id&&S.screen==='corte') pintarLecturaFila(l);
  }
  const ld=$('#ia-loader'); if(ld && ld.listo) ld.listo(`Contadores leídos (${hechas} de ${total}). En la computadora solo hay que confirmarlos.`); else { const pg=$('#ia-prog'); if(pg) pg.textContent=`Contadores leídos (${hechas} de ${total}).`; }
  marcarIA('');
}

function recalcular(){

    if(l.inicial==null||l.final==null){ l.litros=null; lit.textContent='—'; lit.className=''; ok=false; continue; }

    if(l.inicialCorregida && !l.motivo){ ok=false; }
    tot[l.producto]=(tot[l.producto]||0)+l.litros;

  const btn=$('.btn.primary.big.block'); if(btn) btn.disabled=!ok;
  return ok;
}

  if(ok && !ilegibles && !distintas) f.push({k:'fotos',ok:true,txt:`Las ${ok} fotos se leyeron solas y coinciden con lo capturado`,pts:0});

// Reduce el logo a máx 600 px de ancho y ≤300 KB (PNG si viene en PNG, si no JPEG).
function reducirLogo(file){ return new Promise((res,rej)=>{ if(!/^image\/(png|jpeg)$/.test(file.type)) return rej(new Error('usa PNG o JPG')); const url=URL.createObjectURL(file); const im=new Image();
  im.onload=()=>{ URL.revokeObjectURL(url); const esc=Math.min(1,600/im.naturalWidth); const w=Math.max(1,Math.round(im.naturalWidth*esc)), hh=Math.max(1,Math.round(im.naturalHeight*esc)); const cv=document.createElement('canvas'); cv.width=w; cv.height=hh; cv.getContext('2d').drawImage(im,0,0,w,hh);
    let out=file.type==='image/png'?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',0.88); if(out.length>400000) out=cv.toDataURL('image/jpeg',0.82); if(out.length>400000){ const cv2=document.createElement('canvas'); cv2.width=Math.round(w*0.6); cv2.height=Math.round(hh*0.6); cv2.getContext('2d').drawImage(im,0,0,cv2.width,cv2.height); out=cv2.toDataURL('image/jpeg',0.8); }
    if(out.length>400000) return rej(new Error('la imagen sigue pesando más de 300 KB; usa una más sencilla')); res(out); };
  im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('no se pudo leer la imagen')); }; im.src=url; }); }

async function cortesTablero(filtro){

}

async function cargarCorteTablero(id){
  const row=await sel(sb.from('cortes').select('*, despachadores(nombre)').eq('id',id).maybeSingle()); if(!row) return null;
  const [lect, fotos, vac]=await Promise.all([ sel(sb.from('lecturas').select('*, mangueras(clave,lado,producto,orden)').eq('corte_id',id)), sel(sb.from('fotos').select('*').eq('corte_id',id)), sel(sb.from('ventas_aceite').select('*').eq('corte_id',id)) ]);
  const c=corteDesdeServidor({corte:Object.assign({},row,{despachador_nombre:row.despachadores&&row.despachadores.nombre}), lecturas:lect, fotos, aceites:vac});
  await firmarFotos(fotos); return c;
}

function confirmarAnulacion(c){
  const sheet=h('div',{class:'sheet',onclick:e=>{ if(e.target===sheet) sheet.remove(); }});
  const motivo=h('input',{type:'text',placeholder:'Motivo (obligatorio): p. ej. captura equivocada',id:'anular-motivo'});
  const palabra=h('input',{type:'text',placeholder:'Escribe ANULAR para confirmar',autocomplete:'off'});
  const btn=h('button',{class:'btn big block',style:'background:var(--err);color:var(--neon-fg);border-color:var(--err)',disabled:true},'Anular definitivamente');
  const efectos=[
    `Se anula el corte de ${c.islaNombre} · ${c.turnoNombre} del ${fmtFecha(c.fecha)} (${c.despachadorNombre}). Sus fotos y lecturas se conservan, marcadas como anuladas.`,
    'La isla queda libre para capturar el corte de nuevo; la lectura inicial del siguiente corte se toma del último corte enviado válido.',
    'La anulación queda en la bitácora con tu usuario, la hora y el motivo.'
  ];
  const check=()=>{ btn.disabled=!(motivo.value.trim().length>=4 && palabra.value.trim().toUpperCase()==='ANULAR'); };
  motivo.addEventListener('input',check); palabra.addEventListener('input',check);
  btn.addEventListener('click', async ()=>{ btn.disabled=true; btn.textContent='Anulando…'; try{ await rpc('anular_corte',{p_corte:c.id, p_motivo:motivo.value.trim()}); sheet.remove(); toast('Corte anulado. La isla ya se puede volver a capturar.',5000); adminTab='cortes'; render(); }catch(e){ toast('No se pudo anular: '+(e.message||e.code),6000); btn.disabled=false; btn.textContent='Anular definitivamente'; } });
  sheet.append(h('div',{class:'in stack'}, h('h3',{},'¿Anular este corte?'), h('ul',{class:'small',style:'margin:0;padding-left:18px;color:var(--muted)'},...efectos.map(t=>h('li',{style:'margin:4px 0'},t))), motivo, palabra, btn, h('button',{class:'btn ghost block',onclick:()=>sheet.remove()},'Cancelar')));
  document.body.append(sheet); motivo.focus();
}
function slugAceite(t){
  const base=(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48);
  return 'ac-'+(base||'producto')+'-'+uid().slice(-4);
}
async function adminAceites(){
  const box=h('div',{class:'stack'}); app.append(box);
  let lista=clone(S.config.aceites||[]);
  let sucio=false;
  function draw(){
    box.innerHTML='';
    box.append(h('p',{class:'small muted'},'Catálogo de aceites que ven los despachadores al capturar su corte. Cambia precios, desactiva lo que ya no vendes o agrega productos nuevos. Desactivar un producto no borra las ventas ya registradas.'));
    const marcas=[...new Set(lista.map(x=>x.marca||'Otros'))];
    for(const marca of marcas){
      const grupo=h('div',{class:'acgrp'});
      const delMarca=lista.filter(x=>(x.marca||'Otros')===marca);
      grupo.append(h('div',{class:'hd'},h('span',{},marca),h('span',{class:'chip'},delMarca.filter(x=>x.activo!==false).length+' activos de '+delMarca.length)));
      for(const pr of delMarca){
        const i=lista.indexOf(pr);

    }
    const nNom=h('input',{type:'text',placeholder:'Nombre del producto'});
    const nMarca=h('input',{type:'text',placeholder:'Marca (Bardahl, Mexlub…)'});

        lista.push({id:slugAceite(n), uuid:null, nombre:n, marca:(nMarca.value.trim()||'Otros'), precio:Number(nPrec.value)||0, activo:true});
        sucio=true; draw();

          else await sel(sb.from('aceites').insert({estacion_id:S.config.estacionId, clave:a.id, nombre:a.nombre, marca:a.marca, precio:a.precio, activo:true}));
        }

    }},'Guardar catálogo'));

// La rueda del mouse no debe cambiar valores numéricos (al girar sobre un campo con foco, se quita el foco)
document.addEventListener('wheel', e=>{ const a=document.activeElement; if(a && a.tagName==='INPUT' && a.type==='number' && (e.target===a || a.contains(e.target))) a.blur(); }, {passive:true});
document.addEventListener('keydown', e=>{ const a=e.target; if(a && a.tagName==='INPUT' && a.type==='number' && (e.key==='ArrowUp'||e.key==='ArrowDown')) e.preventDefault(); });
document.addEventListener('keydown', e=>{ if(S.pinTeclado && !(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) S.pinTeclado(e); });
// ---- Cierre automático por inactividad (5 min): guarda lo capturado y regresa a la pantalla de despachadores
const INACTIVO_MS=5*60*1000; let ultimaActividad=Date.now(), inactT=null;
function tocar(){ ultimaActividad=Date.now(); clearTimeout(inactT); if(S.me) inactT=setTimeout(revisarInactividad, INACTIVO_MS+500); }
function revisarInactividad(){
  if(!S.me) return;
  if(Date.now()-ultimaActividad<INACTIVO_MS || S.esperandoArchivo){ tocar(); return; }
  if(document.visibilityState==='hidden') return;
  cerrarPorInactividad();
}
async function cerrarPorInactividad(){
  clearTimeout(inactT);
  try{ if(S.me && S.corte && S.corte.estado==='abierto') await guardarAvance(); }catch(e){}
  document.querySelectorAll('.sheet,.lightbox').forEach(x=>x.remove());
  const t=S.token; S.me=null; S.corte=null; S.frames=[]; S.token=null; S.esperandoArchivo=false; guardarToken(null);
  go('login'); toast('Sesión cerrada por inactividad. Lo que ya habías capturado quedó guardado.',6000);
  try{ if(t) await rpc('cerrar_sesion',{p_token:t}); }catch(e){}
}
['pointerdown','keydown','touchstart','input','wheel'].forEach(ev=>document.addEventListener(ev,tocar,{passive:true,capture:true}));
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState!=='visible') return; if(S.esperandoArchivo){ S.esperandoArchivo=false; tocar(); return; } if(S.me && Date.now()-ultimaActividad>=INACTIVO_MS) cerrarPorInactividad(); else tocar(); });
window.addEventListener('focus',()=>{ if(S.esperandoArchivo){ S.esperandoArchivo=false; tocar(); } });
// ---- go
if(/[?&]om_test=1\b/.test(location.search)) window.__om={ S, omLoader, renderFotosListas, leerConIA, render }; // solo para la prueba de humo
boot();
})();
