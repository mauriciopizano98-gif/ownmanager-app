<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>OwnManager</title>
<meta name="theme-color" content="#0B0F14">
<link rel="icon" type="image/png" sizes="192x192" href="marca/favicon-192.png">
<link rel="apple-touch-icon" href="marca/om-isotipo-lima-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/Lexend-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Archivo-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Tipografía de producto: Geist Sans + Geist Mono (variables, autohospedadas; licencia OFL en fonts/) */
@font-face{font-family:"Geist";src:url("fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Geist Mono";src:url("fonts/GeistMono-Variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
/* =====================================================================
   OwnManager · Sistema visual v2 (Manual de identidad visual v1.1)
   Geist Sans + Geist Mono · Lima #84FF00 · Negro #0B0F14 · Carbón #1B222B
   Acentos por módulo: Oficina lima · Kiosko cian · Central violeta · Logística naranja
   Solo estilos: los selectores, ids y clases que usa la lógica no cambian.
   ===================================================================== */
:root{
  /* Marca */
  --lima:#84FF00; --negro:#0B0F14; --carbon:#1B222B; --claro:#E5E7EB; --blanco:#FFFFFF;
  --mod-oficina:#84FF00; --mod-kiosko:#00C9F6; --mod-central:#AC3DF5; --mod-logistica:#FF871C; --mod-estacion:#FF4D4F;
  --mod:var(--lima); --mod-ink:#3D8B00;              /* --mod = acento del módulo; --mod-ink = versión legible como texto */
  --brand:var(--lima); --brand-fg:var(--negro);      /* botón de acción principal, igual en claro y oscuro */
  /* Chrome (cabecera y menú lateral): siempre oscuro */
  --chrome:#0B0F14; --chrome-2:#131920; --chrome-hover:#161D25; --chrome-fg:#F3F4F6; --chrome-muted:#8B95A3; --chrome-line:#1F262F;
  /* Tema claro */
  --bg:#F4F5F7; --surface:#FFFFFF; --surface2:#F1F2F4; --fg:#0B0F14; --muted:#5C6675; --line:#E5E7EB; --line2:#D5DAE0;
  --accent:#0B0F14; --accent-fg:#FFFFFF; --accent-soft:#E9EBEE; --focus:var(--mod-ink); --focus-soft:color-mix(in srgb,var(--mod) 32%,transparent);
  --ok:#15803D; --ok-soft:#E7F6EC; --warn:#B45309; --warn-soft:#FDF1D6; --err:#DC2626; --err-soft:#FDE8E8; --info:#0369A1;
  --rojo:#DC2626; --azul:#0369A1; --cyan:#0083A3; --verde:#15803D; --noche:#0B0F14; --noche-fg:#FFFFFF; --neon-fg:#FFFFFF;
  --font-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --font-display:"Geist","Inter","Segoe UI",system-ui,sans-serif;
  --font-body:"Geist","Inter","Segoe UI",system-ui,sans-serif;
  --r:12px; --r-sm:10px; --r-xs:8px;
  --shadow:0 1px 2px rgba(11,15,20,.05),0 4px 14px rgba(11,15,20,.05);
  --shadow-lg:0 12px 32px rgba(11,15,20,.14);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B0F14; --surface:#1B222B; --surface2:#222A34; --fg:#F3F4F6; --muted:#9AA3AF; --line:#2A323D; --line2:#343D49;
  --accent:var(--mod); --accent-fg:#0B0F14; --accent-soft:color-mix(in srgb,var(--mod) 14%,#1B222B); --mod-ink:var(--mod); --focus:var(--mod); --focus-soft:color-mix(in srgb,var(--mod) 30%,transparent);
  --ok:#4ADE80; --ok-soft:#12291B; --warn:#FBBF24; --warn-soft:#2E2410; --err:#F87171; --err-soft:#3A1A1F; --info:#38BDF8;
  --rojo:#F87171; --azul:#38BDF8; --cyan:#00C9F6; --verde:#4ADE80; --noche:#F3F4F6; --noche-fg:#0B0F14; --neon-fg:#0B0F14;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.28); --shadow-lg:0 16px 40px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B0F14; --surface:#1B222B; --surface2:#222A34; --fg:#F3F4F6; --muted:#9AA3AF; --line:#2A323D; --line2:#343D49;
  --accent:var(--mod); --accent-fg:#0B0F14; --accent-soft:color-mix(in srgb,var(--mod) 14%,#1B222B); --mod-ink:var(--mod); --focus:var(--mod); --focus-soft:color-mix(in srgb,var(--mod) 30%,transparent);
  --ok:#4ADE80; --ok-soft:#12291B; --warn:#FBBF24; --warn-soft:#2E2410; --err:#F87171; --err-soft:#3A1A1F; --info:#38BDF8;
  --rojo:#F87171; --azul:#38BDF8; --cyan:#00C9F6; --verde:#4ADE80; --noche:#F3F4F6; --noche-fg:#0B0F14; --neon-fg:#0B0F14;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.28); --shadow-lg:0 16px 40px rgba(0,0,0,.5); color-scheme:dark }
/* Acento del módulo activo (lo fija render() como atributo de presentación) */
body[data-om-mod="oficina"]{--mod:var(--mod-oficina)} body[data-om-mod="kiosko"]{--mod:var(--mod-kiosko)} body[data-om-mod="central"]{--mod:var(--mod-central)} body[data-om-mod="logistica"]{--mod:var(--mod-logistica)} body[data-om-mod="estacion"]{--mod:var(--mod-estacion)}
:root:not([data-theme="dark"]) body[data-om-mod="oficina"]{--mod-ink:#3D8B00} :root:not([data-theme="dark"]) body[data-om-mod="kiosko"]{--mod-ink:#0083A3}
:root:not([data-theme="dark"]) body[data-om-mod="central"]{--mod-ink:#7A1FC2} :root:not([data-theme="dark"]) body[data-om-mod="logistica"]{--mod-ink:#C25A00}
/* Estación: el rojo es acento de identidad (navegación, bordes, iconos). Los errores siguen usando --err con su icono y su texto. */
:root:not([data-theme="dark"]) body[data-om-mod="estacion"]{--mod-ink:#C8262B}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body[data-om-mod]{--mod-ink:var(--mod)} }
:root[data-theme="dark"] body[data-om-mod]{--mod-ink:var(--mod)}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"ss01","cv11"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--chrome)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(24px,2.4vw,30px)} h2{font-size:22px} h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
.eyebrow{font:600 11.5px/1.3 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
b,strong{font-weight:600}
::selection{background:color-mix(in srgb,var(--mod) 35%,transparent)}

/* Header: cabecera oscura con línea del módulo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--chrome);color:var(--chrome-fg);border-bottom:1px solid var(--chrome-line)}
.top::after{content:"";display:block;height:2px;background:var(--mod);opacity:.9}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.logo{height:52px;width:auto;max-width:min(52vw,260px);object-fit:contain;display:block;background:#fff;border-radius:10px;padding:4px 8px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .om{width:40px;height:40px;border-radius:11px;flex:none;object-fit:cover;background:#000;border:1px solid var(--chrome-line)}
/* Pantalla de entrada: siempre oscura (#0B0F14), como marca el manual */
body[data-om-login]{background:var(--negro);color:#F3F4F6;color-scheme:dark}
body[data-om-login]::before{background:var(--negro)}
body[data-om-login] .top{display:none}
body[data-om-login] .foot{display:none}
.foot .ver{opacity:.7;margin-left:4px;text-transform:none;letter-spacing:0}
.om-nueva{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:80;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-radius:var(--r-sm);background:var(--carbon,#1B222B);color:#F3F4F6;border:1px solid var(--lima);box-shadow:var(--shadow);font-size:13.5px}
.ver-login{text-align:right;font:500 11px var(--font-mono);color:#9AA3AF;opacity:.8;margin:-10px 4px 0}
.om-login{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;justify-content:center;gap:18px;padding:12px 0;
  --bg:#0B0F14; --surface:#1B222B; --surface2:#222A34; --fg:#F3F4F6; --muted:#9AA3AF; --line:#2A323D; --line2:#343D49; --accent:#84FF00; --accent-fg:#0B0F14; --accent-soft:#1E2E10; --err:#F87171; --err-soft:#3A1A1F; --focus:#84FF00; --focus-soft:rgba(132,255,0,.28); --shadow:none}
.om-login .hero{text-align:center;position:relative;padding:12px 0 0}
@media (max-height:760px){.om-login .om-hero{width:min(300px,68vw)}.om-login .hero::before{height:160px}.om-login{gap:12px}}
.om-login .hero::before{content:"";position:absolute;left:50%;top:38%;width:min(560px,110vw);height:220px;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(132,255,0,.16),rgba(132,255,0,.05) 45%,transparent 70%);pointer-events:none;filter:blur(8px)}
.om-login .om-hero{position:relative;width:min(400px,84vw);height:auto;display:block;margin:0 auto 6px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.om-login .om-wordmark{display:none} /* el logotipo oficial ya lleva el nombre; no se recrea con la fuente de interfaz */
.om-login .om-slogan{font:500 12.5px/1.4 var(--font-mono);color:#9AA3AF;margin-top:10px;letter-spacing:.08em;text-transform:uppercase}
.om-login .card{background:#1B222B;border:1px solid #2A323D;color:#F3F4F6}
.om-login input{background:#0F141A;border-color:#2A323D;color:#F3F4F6}
.om-login input:focus{outline:3px solid rgba(132,255,0,.28);border-color:#84FF00}
.om-login .btn.primary{background:#84FF00;color:#0B0F14;border-color:#84FF00;font-weight:600}
.om-login .btn.primary:focus-visible{outline:3px solid rgba(132,255,0,.35)}
.om-login .hint{color:#9AA3AF}
.om-login .bar{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#84FF00,transparent);width:160px;margin:16px auto 0}
/* Pie de página con la marca del programa */
.foot{max-width:720px;margin:0 auto;padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font:500 11.5px var(--font-mono);letter-spacing:.08em;text-transform:uppercase}
.foot img{width:20px;height:20px;object-fit:cover;border-radius:6px;opacity:.95}
.foot .lima{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .foot .lima{display:block} :root:not([data-theme="light"]) .foot .mono{display:none} }
:root[data-theme="dark"] .foot .lima{display:block} :root[data-theme="dark"] .foot .mono{display:none}
:root[data-theme="light"] .foot .lima{display:none} :root[data-theme="light"] .foot .mono{display:block}
.brand .nm{font:700 18px/1.1 var(--font-display);letter-spacing:-.01em;color:var(--chrome-fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .nm small{display:block;font:500 10.5px/1.3 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--chrome-muted);margin-top:2px}
.logo-prev{height:64px;width:auto;max-width:260px;object-fit:contain;display:block;background:#fff;color:#0B0F14;border:1px solid var(--line);border-radius:10px;padding:6px}
/* --- Aceites --- */
.acgrp{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.acgrp > .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--surface2);font:600 14px var(--font-display)}
.acrow{display:grid;grid-template-columns:minmax(0,1fr) auto 86px;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.acrow .nm{min-width:0;font-size:13.5px;line-height:1.3}
.acrow .nm small{display:block;color:var(--muted);font-size:11.5px}
.acrow.mov{background:color-mix(in srgb,var(--mod) 9%,var(--surface))}
.step{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line2);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.step button{border:0;background:transparent;width:40px;height:40px;font:600 20px var(--font-display);color:var(--fg);cursor:pointer;line-height:1}
.step button:active{background:var(--accent-soft)}
.step button[disabled]{color:var(--line2);cursor:not-allowed}
.step input{width:46px;min-height:40px;padding:0;text-align:center;border:0;border-inline:1px solid var(--line);border-radius:0;background:transparent;font:600 17px var(--font-mono);font-variant-numeric:tabular-nums;color:var(--fg)}
.step input:focus{outline:2px solid var(--focus);border-radius:6px}
.acrow .vd{text-align:right;font-variant-numeric:tabular-nums;font:600 14px var(--font-mono)}
.acrow .vd.cero{color:var(--muted);font-weight:400}
@media (max-width:420px){.acrow{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}.acrow .vd{grid-column:2;text-align:right}}
.acadm{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.acadm input[type=text]{min-height:40px}
.acadm input[type=number]{min-height:40px;text-align:right}
.acadm.off{opacity:.5}
/* El logo de la estación va siempre sobre placa blanca (los logos vienen para fondo claro) */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand .logo{background:#fff;border-radius:10px;padding:4px 8px;height:52px} }
:root[data-theme="dark"] .brand .logo{background:#fff;border-radius:10px;padding:4px 8px;height:52px}
@media (max-width:520px){.logo{height:44px}}
.top .who{display:flex;align-items:center;gap:10px;min-width:0}
.gear{width:40px;height:40px;border-radius:10px;border:1px solid var(--chrome-line);background:var(--chrome-2);color:var(--chrome-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:color .15s,border-color .15s}
.gear:hover{color:var(--chrome-fg);border-color:var(--mod)}
.gear svg{display:block}
.top .who .name{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--chrome-fg)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card + .card, .stack > * + *{margin-top:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}

/* Buttons */
.btn{appearance:none;border:1px solid var(--line2);background:var(--surface);color:var(--fg);font:500 14.5px var(--font-body);padding:11px 18px;border-radius:var(--r-sm);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;letter-spacing:-.005em;transition:transform .08s ease,background .15s,border-color .15s,color .15s,box-shadow .15s}
.btn:hover{border-color:color-mix(in srgb,var(--fg) 30%,var(--line2));background:var(--surface2)}
.btn:active{transform:scale(.985)}
.btn:focus-visible{outline:3px solid var(--focus-soft);outline-offset:1px;border-color:var(--focus)}
.btn.primary{background:var(--brand);color:var(--brand-fg);border-color:var(--brand);font-weight:600}
.btn.primary:hover{background:#9BFF2E;border-color:#9BFF2E;box-shadow:0 6px 18px rgba(132,255,0,.22)}
.btn.ok{background:var(--ok);color:var(--neon-fg);border-color:var(--ok)}
.btn.ok:hover{filter:brightness(1.05);background:var(--ok)}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,var(--line2));background:var(--surface)}
.btn.danger:hover{background:var(--err-soft);border-color:var(--err)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2);border-color:var(--line2)}
.btn.ghost.danger{border-color:transparent}
.btn.block{width:100%}
.btn.big{min-height:54px;font-size:16px;border-radius:var(--r)}
.btn[disabled]:not(.trabaja){opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13px;border-radius:var(--r-xs)}

/* Chips */
.ro{display:flex;align-items:center;min-height:46px;padding:11px 12px;border:1px dashed var(--line2);border-radius:var(--r-sm);background:var(--surface2);color:var(--fg);font:500 16px var(--font-body);word-break:break-word}
.ro:empty::before{content:'—';color:var(--muted)}
.chip.edit{background:var(--warn-soft);color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:500 12px/1.6 var(--font-mono);letter-spacing:.02em;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.err{background:var(--err-soft);color:var(--err);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* Inputs */
label.f{display:block}
label.f span.l{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px;letter-spacing:.01em}
.passwrap{position:relative}.passwrap input{width:100%;padding-right:46px;box-sizing:border-box}.passwrap .ojo{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:var(--muted);cursor:pointer;padding:6px;line-height:0;border-radius:8px}.passwrap .ojo:hover{color:var(--fg)}
input[type=text],input[type=search],input[type=email],input[type=number],input[type=password],input[type=date],input[type=month],select,textarea{width:100%;font:500 15.5px var(--font-body);color:var(--fg);background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-sm);padding:11px 12px;min-height:46px;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--fg) 28%,var(--line2))}
input:focus,select:focus,textarea:focus{outline:3px solid var(--focus-soft);border-color:var(--focus)}
select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%235C6675' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
input.num{font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:19px;font-weight:600;letter-spacing:0}
input.bad{border-color:var(--err);background:var(--err-soft)}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}

/* Login */
.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
.login-in{position:relative;display:flex;flex-direction:column;gap:18px}
.kiosco-avisos{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.kiosco-avisos .eyebrow{margin:0}
.kiosco-avisos .av{display:flex;flex-direction:column;gap:3px;padding-top:12px;border-top:1px solid var(--line)}
.kiosco-avisos .av .tx{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.4}

/* Animación de terminado (idea de Mauricio, 13-nov): la marca se dibuja UNA vez, nace la gota y la gota se transforma en la palomita,
   que se queda fija. La barra se llena de verde. Misma tinta que el logo. */
.om-loader.fin .sw{animation:om-trazo-fin 1.1s cubic-bezier(.65,0,.35,1) forwards}
.om-loader.fin .gt{animation:om-gota-fin .45s .95s cubic-bezier(.34,1.4,.64,1) forwards, om-gota-va .32s 1.7s ease-in forwards}
.om-loader .chk{fill:none;stroke:currentColor;stroke-width:34;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:260;stroke-dashoffset:260;transform-box:fill-box;transform-origin:50% 50%;transform:scale(.35);opacity:0}
.om-loader.fin .chk{animation:om-chk .6s 1.82s cubic-bezier(.2,.9,.3,1.15) forwards}
.om-loader.fin .pulso{animation:none;background:var(--line2);position:relative;overflow:hidden}
.om-loader.fin .pulso::after{content:'';position:absolute;inset:0;background:var(--ok);transform-origin:left;transform:scaleX(0);animation:om-llena 1.2s .2s ease forwards}
.fin h1{margin-top:4px}
@keyframes om-gota-va{to{transform:scale(0);opacity:0}}
@keyframes om-chk{0%{stroke-dashoffset:260;transform:scale(.35);opacity:1}100%{stroke-dashoffset:0;transform:scale(1);opacity:1}}
@keyframes om-trazo-fin{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 0% 0 0)}}
@keyframes om-gota-fin{0%{transform:scale(0);opacity:1}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes om-llena{to{transform:scaleX(1)}}
@keyframes om-dibuja{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.om-loader.fin .sw,.om-loader.fin .gt,.om-loader.fin .pulso::after,.om-loader.fin .chk{animation:none}.om-loader.fin .sw{clip-path:none}.om-loader.fin .gt{transform:scale(0);opacity:0}.om-loader.fin .pulso::after{transform:none}.om-loader.fin .chk{stroke-dashoffset:0;transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.om-loader .sw,.om-loader .gt,.om-loader .pulso{animation:none}.om-loader .sw{clip-path:none}.om-loader .gt{transform:none}}

/* =====================================================================
   OwnManager · Manual de diseño v2 "Marquesina" (nov-2026)
   Capa de presentación sobre el sistema anterior: colores, tipografía,
   formas y tamaños. No cambia selectores, ids, pasos, datos ni permisos.
   Reglas: franja negra con filo lima; zona de trabajo clara; lima solo en
   la acción principal, la sección activa y el filo; sin acentos por módulo;
   sin sombras; sin rótulos en mayúsculas.
   ===================================================================== */
@font-face{font-family:"Lexend";src:url("fonts/Lexend-Variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Archivo";src:url("fonts/Archivo-Variable.woff2") format("woff2");font-weight:100 900;font-stretch:62% 125%;font-style:normal;font-display:swap}
:root{
  --mod-oficina:#84FF00; --mod-kiosko:#84FF00; --mod-central:#84FF00; --mod-logistica:#84FF00; --mod-estacion:#84FF00; --mod-ink:#0B0F14;
  --bg:#EEF0F2; --surface:#FFFFFF; --surface2:#F4F5F7; --fg:#0B0F14; --muted:#47505E; --line:#D5DAE0; --line2:#8B95A3;
  --accent:#0B0F14; --accent-fg:#FFFFFF; --accent-soft:#E4E7EB; --focus:#0B0F14; --focus-soft:rgba(11,15,20,.2);
  --ok:#17663A; --ok-soft:#DDF3E4; --warn:#7A4300; --warn-soft:#FBE7BF; --err:#A8201A; --err-soft:#FCE1DE; --rojo:#A8201A; --verde:#17663A;
  --font-body:"Lexend","Segoe UI",system-ui,sans-serif; --font-display:"Lexend","Segoe UI",system-ui,sans-serif; --font-mono:"Archivo","Lexend",system-ui,sans-serif;
  --r:14px; --r-sm:12px; --r-xs:10px; --shadow:none;
  --borde-btn:#0B0F14; --sel-bg:#0B0F14; --sel-fg:#FFFFFF; --sel-punto:var(--lima);
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-in-out:cubic-bezier(.77,0,.175,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12171E; --surface:#1B222B; --surface2:#222A34; --fg:#F4F5F7; --muted:#B3BBC6; --line:#2F3843; --line2:#5B6675;
  --accent:var(--lima); --accent-fg:#0B0F14; --accent-soft:color-mix(in srgb,var(--lima) 14%,#1B222B); --mod-ink:var(--lima); --focus:var(--lima); --focus-soft:rgba(132,255,0,.3);
  --chrome:#05070A; --chrome-2:#0B0F14; --chrome-hover:#11161D; --chrome-line:#1F262F;
  --borde-btn:#8B95A3; --sel-bg:var(--lima); --sel-fg:#0B0F14; --sel-punto:#0B0F14; --shadow:none } }
:root[data-theme="dark"]{
  --bg:#12171E; --surface:#1B222B; --surface2:#222A34; --fg:#F4F5F7; --muted:#B3BBC6; --line:#2F3843; --line2:#5B6675;
  --accent:var(--lima); --accent-fg:#0B0F14; --accent-soft:color-mix(in srgb,var(--lima) 14%,#1B222B); --mod-ink:var(--lima); --focus:var(--lima); --focus-soft:rgba(132,255,0,.3);
  --chrome:#05070A; --chrome-2:#0B0F14; --chrome-hover:#11161D; --chrome-line:#1F262F;
  --borde-btn:#8B95A3; --sel-bg:var(--lima); --sel-fg:#0B0F14; --sel-punto:#0B0F14; --shadow:none }
:root:not([data-theme="dark"]) body[data-om-mod]{--mod-ink:#0B0F14}

body{font-size:16px;line-height:1.5;font-feature-settings:normal}
h1,h2,h3{letter-spacing:0}
.small,.hint{font-size:14px}
.num,.eyebrow,.ver-login,.foot,.brand .nm small,.step input,.acrow .vd,.chip,input.num,.lu-litros .u,.lv-cuenta .r b,.avatar,.key,.mono,.npaso .n,.adel-row .adel-ic,.adel-row .adel-v,.fr .tag,.fr .t,.now .n,.lect .litros b,.tot b,.om-loader .txt,.om-trabajando .trab-s,.matrix .h,.matrix .c b,th,td.r,.seal,.denhead span,.den .d,.den .st,.money b,.diff b,.mxwrap .sym,.mxwrap input,.secnav button b,.lg .muted,#who .empresa.ini,#who .emp-nm small,.concepto b,.resumen-ec .k,.biblio .carp .sub,.doc .sub{font-stretch:80%}
.eyebrow,.foot,.brand .nm small,.kv .l,.matrix .h,th,.denhead span,#who .emp-nm small,.biblio .carp .sub,.doc .sub{text-transform:none;letter-spacing:0}
.eyebrow,.kv .l,.matrix .h,.denhead span,.biblio .carp .sub,.doc .sub{font-size:13.5px;font-weight:600}
th{font:600 13.5px var(--font-body);color:var(--muted)}
td.r{font-size:15px;font-weight:600}

/* Franja: negra, con el filo lima */
.top{border-bottom:0}
.top::after{height:3px;background:var(--lima);opacity:1}

/* Botones */
.btn{border-width:1.5px;border-color:var(--borde-btn);font-weight:600;font-size:15px;min-height:48px;letter-spacing:0;transition:transform .12s var(--ease-out),background .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--borde-btn)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--lima);color:#0B0F14;border:2px solid var(--borde-btn);font-weight:700}
.btn.primary:hover{background:#9BFF2E;border-color:var(--borde-btn);box-shadow:none}
.btn.ghost{border-color:var(--line)}
.btn.ghost:hover{border-color:var(--line2)}
.btn.sm{min-height:38px;font-size:14px}
.btn.big{min-height:60px;font-size:19px}
.btn[disabled]:not(.trabaja),.btn.primary[disabled]:not(.trabaja){background:var(--accent-soft);color:var(--muted);border-color:transparent;opacity:1}

/* Campos: rótulo visible encima, 48 px, borde gris */
label.f span.l{font-size:14px;font-weight:600;color:var(--fg);letter-spacing:0}
input[type=text],input[type=search],input[type=email],input[type=number],input[type=password],input[type=date],input[type=month],select,textarea{min-height:48px;border-width:1.5px;border-color:var(--line2);border-radius:var(--r-sm)}
input:hover,select:hover,textarea:hover{border-color:var(--fg)}
input:focus,select:focus,textarea:focus{outline:3px solid var(--focus-soft);border-color:var(--focus)}

/* Etiquetas de estado: palabra legible; el color solo marca la excepción */
.chip{font:500 13px/1.5 var(--font-body);letter-spacing:0}

/* Selección: negro con punto lima (en oscuro: lima con texto negro) */
.tabs button{min-height:40px;font-size:14.5px}
.tabs button.on,.turno-seg button.on{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-bg);box-shadow:none}
.turno-seg button.on .small{color:var(--sel-fg)}
.tabs button.on::before,.turno-seg button.on::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sel-punto);margin-right:7px;vertical-align:1px}

/* Kiosko: letra y teclas grandes */
.person{font-size:22px;font-weight:600;min-height:66px;border-width:1.5px}
.person:hover{border-color:var(--fg);transform:none}
.key{font-weight:700;border-width:1.5px}
.pin i.on{background:var(--mod-ink);border-color:var(--mod-ink)}
.modo button{padding:12px 10px;gap:8px;border-width:1.5px}
.modo button b{font-size:15px;white-space:nowrap}
.modo button small{font-size:13px}

/* Menú lateral: Lexend es más ancha que la letra anterior */
.om-shell{grid-template-columns:240px minmax(0,1fr)}
.sidenav button{font-size:13.5px;letter-spacing:0}
.sidenav .sub button{font-size:13.5px}

/* ---- Armazón (propuesta D) ----
   PC: un solo menú negro de alto completo, con filo lima a la derecha y el usuario abajo.
   Teléfono: franja arriba y pestañas abajo; las opciones de un grupo suben en una hoja. */

  .matrix{grid-template-columns:58px repeat(3,1fr);gap:5px;font-size:12.5px}

}

/* Logística › Viajes */
.sep{display:none}

.lv-cab,.item.lv-fila{display:grid;grid-template-columns:52px minmax(0,2.1fr) minmax(0,1.2fr) minmax(0,1.5fr) minmax(0,1.8fr) minmax(0,1.1fr) 62px;align-items:center;column-gap:14px;padding:10px 16px}
.lv-cab{font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}

.lv-fila>.chip{grid-column:6/8;justify-self:end}

/* Renglón del título con acción: el título a la izquierda y el botón de crear a la derecha, asentados en la misma línea.
   El botón ocupa su lugar en el renglón (no flota), así nunca se encima con lo que sigue. */
.om-main>.cab-acc{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;align-items:end}
.om-main>.cab-acc>*{grid-column:1}
.om-main>.cab-acc>.btn{grid-column:2;grid-row:1/span 4;align-self:end;margin:0 0 4px;white-space:nowrap}
/* Periodo (mes): las dos flechas juntas, con el nombre en medio y ancho fijo para que no brinquen al cambiar de mes. Igual que el día en Central › Hoy. */

}

/* ---- Bancos (19-nov-2026). Misma familia que Logística › Viajes: periodo con flechas, franja de totales y tabla.
   Los importes van en la tipografía de cifras, alineados a la derecha; el rojo solo marca lo que falta. ---- */
.tot.b-tot{grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.b-tot div{background:none;border:0;border-right:1px solid var(--line);border-radius:0;padding:14px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.b-tot div:last-child{border-right:0}
.b-tot b{font:700 22px/1.1 var(--font-mono);font-stretch:80%;white-space:nowrap}
.b-tot b.neg{color:var(--err)}
.list.b-tabla{gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.b-cab,.item.b-fila{display:grid;align-items:center;column-gap:14px;padding:10px 16px}
.b-cab{font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.b-cab .r,.b-fila .r{text-align:right}
.item.b-fila{border:0;border-bottom:1px solid var(--line);border-radius:0;min-height:54px;justify-content:initial}
.list.b-tabla>:last-child{border-bottom:0}
.item.b-fila:hover{background:var(--surface2);box-shadow:none}
.item.b-fila.fija{cursor:default}
.item.b-fila.fija:hover{background:none}
.item.b-fila.abierta{background:var(--surface2)}
.item.b-fila:focus-visible{outline:2px solid var(--mod-ink,var(--fg));outline-offset:-2px}
.b-fila .r{font:600 15.5px var(--font-mono);font-stretch:80%;font-variant-numeric:tabular-nums;white-space:nowrap}
.b-fila .r.neg{color:var(--err)}
.b-fila .r.nada{color:var(--muted);font-weight:500}
.b-dia,.bm-desc,.bc-cta,.bc-quien{display:flex;flex-direction:column;min-width:0}
.b-dia b,.bm-desc b,.bc-cta b{font-weight:600}
.bm-desc .small,.bc-cta .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-est{justify-self:end}
.be .b-cab,.be .item.b-fila{grid-template-columns:minmax(0,1.3fr) repeat(4,minmax(0,1fr)) 132px}
/* Conciliación (25-nov-2026): misma familia que Bancos. La barra del día reparte lo que marcó el dispensario, de lo más seguro (ya en el banco) a lo que falta. */
.cn .b-cab,.cn .item.b-fila{grid-template-columns:minmax(0,1.15fr) repeat(6,minmax(0,1fr)) 150px}
.cn.dia .b-cab,.cn.dia .item.b-fila{grid-template-columns:minmax(0,1.5fr) repeat(2,minmax(0,1fr)) minmax(0,1.7fr)}
.cn .b-est{display:flex;justify-content:flex-end}.cn .chip{white-space:nowrap}
.cn-nota{color:var(--muted);font-size:14.5px;min-width:0;text-align:right}
.cn-nota.neg{color:var(--err);font-weight:600}
.cn .item.b-fila.cn-fin{background:color-mix(in srgb,var(--fg) 7%,var(--surface));min-height:58px}
/* 25-nov-2026 (pedido de Mauricio): el renglón abierto y su desglose se perdían entre el gris y el blanco. El renglón abierto toma un tinte del verde de la marca;
   el desglose va sobre un fondo más marcado y cada mitad es una tarjeta blanca con su orilla. */
.cn .item.b-fila.abierta{background:color-mix(in srgb,var(--mod) 20%,var(--surface))} .cn .item.b-fila.abierta .cn-nota:not(.neg){color:var(--fg)}
.cn .b-det{background:color-mix(in srgb,var(--fg) 9%,var(--surface));gap:12px;padding:12px}
.cn .b-det>div{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-sm);padding:12px 14px}.cn-fin b{font-weight:700;grid-column:1/4}.cn-fin .r{grid-column:4;font-size:17px}
.cn-det{grid-template-columns:repeat(2,minmax(0,1fr))}
.cn-per{display:flex;align-items:baseline;gap:10px;margin:18px 0 0}.cn-per b{font:600 16px var(--font-body)}
.cn-estado{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.cn-dianav input[type=date]{width:auto;min-height:40px;margin-left:auto;font-size:14.5px}
.cn-dianav b{min-width:0;text-align:left}
.cn-modo{margin-top:18px}
.cn-fechas{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:16px}
.cn-fechas label{display:flex;flex-direction:column;gap:4px}.cn-fechas input[type=date]{width:auto}
/* 25-nov-2026 (pedido de Mauricio): la barra lleva el par de la marca, lima y negro, en vez de puros grises. Cada tramo se distingue también por claridad
   (lima muy claro, negro, gris medio, rayado, rojo), no solo por el color; lo pendiente va rayado. */
.cn-barra{display:flex;gap:2px;height:16px;margin-top:18px;border-radius:999px;overflow:hidden;background:color-mix(in srgb,var(--fg) 9%,var(--surface))}
.cn-barra i{display:block;height:100%;min-width:3px}
.cn-barra .ef,.cn-ley .ef{background:var(--mod);box-shadow:inset 0 0 0 1px color-mix(in srgb,#3D8B00 55%,transparent)}
.cn-barra .tj,.cn-ley .tj{background:var(--fg)}.cn-barra .cl,.cn-ley .cl{background:var(--muted)}
.cn-barra .ca,.cn-ley .ca{background:repeating-linear-gradient(135deg,var(--surface) 0 3px,color-mix(in srgb,var(--fg) 45%,var(--surface)) 3px 5px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 45%,var(--surface))}
.cn-barra .si,.cn-ley .si{background:var(--err)}
.cn-ley{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:10px;font-size:14px;color:var(--muted)}
.cn-ley span{display:inline-flex;align-items:center;gap:7px}.cn-ley i{width:12px;height:12px;border-radius:3px;flex:none}
.cn-ley b{font:600 14px var(--font-mono);font-stretch:80%;font-variant-numeric:tabular-nums;color:var(--fg)}
/* Pagos de clientes (25-nov-2026): misma tabla de Bancos y Conciliación */
.pc-cab{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:6px}.pc-cab p{margin:0;max-width:60ch}
.pc .b-cab,.pc .item.b-fila{grid-template-columns:138px minmax(0,2.6fr) minmax(0,1fr) 196px}.pc .b-dia b{white-space:nowrap}
.pc-cli{display:flex;flex-direction:column;min-width:0}.pc-cli b{font-weight:600;overflow-wrap:anywhere}.pc-cli .small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .b-est{display:flex;justify-content:flex-end}.pc .chip{white-space:nowrap}
.pc .item.b-fila.abierta{background:color-mix(in srgb,var(--mod) 20%,var(--surface))}
.pc .b-det{background:color-mix(in srgb,var(--fg) 9%,var(--surface));gap:12px;padding:12px}
.pc .b-det>div{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-sm);padding:12px 14px;min-width:0}.pc .b-det .ln b{white-space:normal;text-align:right;overflow-wrap:anywhere}
.pc-ok{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:600;margin:0}.pc-mal{color:var(--err);font-weight:600;margin:0}
.pc-sug{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--mod) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--mod) 50%,var(--line))}
.pc-sug b{font:600 20px/1.25 var(--font-body);overflow-wrap:anywhere}
.bm .b-cab,.bm .item.b-fila{grid-template-columns:128px minmax(0,3fr) repeat(3,minmax(0,1fr))}
.bm-fecha{white-space:nowrap}
.bt .b-cab,.bt .item.b-fila{grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr))}
.bc .b-cab,.bc .item.b-fila{grid-template-columns:minmax(0,1.6fr) minmax(0,1.5fr) minmax(0,.7fr) minmax(0,1.1fr) 92px;column-gap:20px}
.bc .item.b-fila.ida{color:var(--muted)}
.bc-motivo{padding:0 16px 10px;border-bottom:1px solid var(--line)}
/* Depósito manual: cada hoja es un bloque con su encabezado y sus renglones; la referencia va en cifras grandes porque es lo que se teclea en ventanilla. */
.bd-hoja{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bd-hoja.ida{color:var(--muted)}
.bd-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}

.bd .b-cab,.bd .item.b-fila{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,1.7fr);column-gap:22px}
.bd .b-fila>.chip{justify-self:start}
.bd-ref{font:700 18px var(--font-mono);font-stretch:80%;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.bd-est{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.bd-dif{color:var(--err);font-weight:600}
.bd-filas{display:flex;flex-direction:column;gap:10px}
.bd-fila{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px;gap:12px;align-items:end}
.bd-quitar{min-width:44px;min-height:44px;padding:0;justify-content:center}
.bd-total{margin:0;font:600 16px var(--font-body)}
.bd-falta{background:var(--warn-soft);border-radius:var(--r-sm);padding:12px 14px}
.bd-falta input{flex:1;min-width:200px}
.bd-rev{color:var(--warn);font-weight:600}
/* Prueba del escáner (etapa 1): a la izquierda la cámara, a la derecha lo que leyó la IA. */
.esc-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:12px;align-items:start}
.esc-vista{position:relative;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);min-height:220px;display:grid;place-items:center;overflow:hidden}
.esc-vista canvas{display:block;max-width:100%;max-height:62vh;width:auto;height:auto}
.esc-vista .esc-apagada{padding:28px 18px;text-align:center}
.esc-res{font:500 12px var(--font-mono);color:var(--muted)}
.esc-guia{margin:0;min-height:26px;font:700 17px/1.5 var(--font-body);color:var(--fg)}
.esc-guia[data-estado="ajustar"],.esc-guia[data-estado="espera"],.esc-guia[data-estado="repetido"]{color:var(--warn)}
.esc-guia[data-estado="tomar"],.esc-guia[data-estado="listo"]{color:var(--ok)}

.esc-tramos{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.esc-tramos img{height:150px;width:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.esc-datos{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0}
.esc-datos dt{font:600 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.esc-datos dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.esc-tabla{width:100%;border-collapse:collapse;font-size:14px}
.esc-tabla th{font:600 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.esc-tabla td{padding:6px 8px;border-bottom:1px solid var(--line)}
.esc-tabla .n{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.esc-secciones{font-size:13px;color:var(--muted)}

/* =====================================================================
   Movimiento (animaciones opción 4). Reglas: sin sonido; el bucle solo donde
   se espera; lo demás ocurre una vez y queda fijo; nada nace de tamaño cero;
   con "reducir movimiento" se quitan los desplazamientos.
   ===================================================================== */
:root{--om-g1:#C6FF8A;--om-g3:#C6FF8A;--om-destello:#84FF00;--om-pista:1;--om-sello:#17663A}
/* La luz siempre es lima. Donde el logo va en lima (tema oscuro, pantalla de entrada negra), la línea y la gota quedan tenues
   para que la luz se note al recorrerlas; donde va en negro (tema claro), la línea queda entera. */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--om-pista:.3;--om-sello:#84FF00} }
:root[data-theme="dark"]{--om-pista:.3;--om-sello:#84FF00}
.om-login,body[data-om-login]{--om-pista:.3}
.om-splash{--om-pista:1}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .om-splash{--om-pista:.3} }
:root[data-theme="dark"] .om-splash{--om-pista:.3}
.om-loader:not(.fin):not(.listo) .sw,.om-loader:not(.fin):not(.listo) .gt{opacity:var(--om-pista)}
/* 2 · Espera: el logo quieto, una luz recorre su línea y enciende la gota; el texto lleva un brillo */
.om-loader .sw{clip-path:none;animation:none}
.om-loader .gt{transform:none;animation:none}
.om-loader .pulso{display:none}
.om-loader .d0{stop-color:var(--om-destello);stop-opacity:0} .om-loader .d1{stop-color:var(--om-destello);stop-opacity:1}
.om-loader .destello{transform-box:fill-box;transform:translateX(-100%);animation:om-pasa 1.9s cubic-bezier(.4,0,.6,1) infinite}
.om-loader svg path.chispa{fill:var(--om-destello);opacity:0;animation:om-chispa 1.9s linear infinite}
@keyframes om-pasa{0%{transform:translateX(-100%)}62%,100%{transform:translateX(330%)}}
@keyframes om-late{from{opacity:0}to{opacity:.95}}
@keyframes om-chispa{0%,46%{opacity:0}58%{opacity:.95}80%,100%{opacity:0}}
.om-loader:not(.chico) .txt{font:500 15px/1.4 var(--font-body);letter-spacing:0;min-height:21px;background:linear-gradient(90deg,var(--muted) 0 40%,var(--fg) 50%,var(--muted) 60% 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:om-brillo 1.9s linear infinite}
.om-splash .om-loader:not(.chico) .txt{color:transparent}
@keyframes om-brillo{from{background-position:100% 0}to{background-position:0 0}}
.om-loader.listo .destello,.om-loader.listo svg path.chispa{animation:none;opacity:0}
.om-loader.listo:not(.chico) .txt{animation:none;background:none;color:var(--muted)}
/* Pantallas de espera a pantalla completa: sobre el fondo de la app, no sobre negro */
.om-splash{background:var(--bg);--om-stroke:#0B0F14;transition:opacity .28s var(--ease-out),transform .28s var(--ease-out)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .om-splash{--om-stroke:#84FF00} }
:root[data-theme="dark"] .om-splash{--om-stroke:#84FF00}
.om-splash.off{opacity:0;transform:translateY(-14px) scale(.98)}
.om-trabajando .trab-t{color:var(--fg);letter-spacing:0}
.om-trabajando .trab-in{gap:10px}
.om-trabajando .trab-t{font:600 22px/1.25 var(--font-body);margin-top:10px}
.om-trabajando .trab-s{color:var(--fg);font:700 46px/1 var(--font-mono);font-stretch:80%;font-variant-numeric:tabular-nums;min-width:4ch}
/* 1 · Entrada: el logotipo oficial aparece por partes (línea, Own, Manager) y gira la frase */
.solo-estado{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.om-entrada{display:flex;flex-direction:column;align-items:center;gap:18px;width:min(300px,72vw)}
.om-logo-partes{position:relative;width:100%}
.om-logo-partes i{position:absolute;inset:0;background:center/100% 100% no-repeat}
.om-logo-partes.claro{aspect-ratio:1000/562;background:var(--bg);isolation:isolate}
.om-logo-partes.claro i{background-image:url("marca/om-logo-claro.png");mix-blend-mode:darken}
.om-logo-partes.osc{aspect-ratio:1000/273}

@keyframes om-parte-l{from{opacity:0;transform:translateX(-10px)}}

.om-lema{height:30px;overflow:hidden;-webkit-mask-image:linear-gradient(#0000,#000 28%,#000 72%,#0000);mask-image:linear-gradient(#0000,#000 28%,#000 72%,#0000)}
.om-lema .tira{display:flex;flex-direction:column;transform:translateY(-30px);animation:om-rueda 1s var(--ease-in-out) .5s both}
.om-lema span{height:30px;font:700 22px/30px var(--font-mono);font-stretch:80%;letter-spacing:.01em;text-align:center;white-space:nowrap;color:var(--fg)}

/* …y al quitarse: baja la franja, se enciende el filo y la pantalla se arma */
.om-entrando .top{animation:om-baja .45s var(--ease-out) both}
.om-entrando .top::after{animation:om-filo .5s var(--ease-out) .25s both}

.om-entrando .om-main{animation:om-sube .42s var(--ease-out) .15s both}

@keyframes om-lado{from{transform:translateX(-100%)}}
/* 3 · Botón que responde: se hunde al tocarlo (arriba) y, mientras trabaja, corre un hilo abajo */
.btn.trabaja,.btn.hecho,.btn.vuelve{position:relative;overflow:hidden}
.btn.trabaja[disabled]{cursor:progress}
.btn.trabaja::after{content:"";position:absolute;left:0;bottom:0;width:35%;height:4px;background:currentColor;animation:om-hilo .75s var(--ease-in-out) infinite}
/* el texto gira: sale el anterior hacia arriba y entra el nuevo desde abajo (el mismo giro de la frase de entrada) */
.btn.gira>*,.btn.vuelve>:not(.btn-h){animation:om-rollo-entra .24s var(--ease-in-out) both}
.btn.gira::before,.btn.trabaja[data-ocupado]:not([data-ocupado=""])::before{position:absolute;inset:0;padding:inherit;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.btn.gira::before{content:attr(data-antes);animation:om-rollo-sale .24s var(--ease-in-out) both}
.btn.trabaja[data-ocupado]:not([data-ocupado=""])>*,.btn.hecho>:not(.btn-h){animation:om-rollo-sale .24s var(--ease-in-out) both}
.btn.trabaja[data-ocupado]:not([data-ocupado=""])::before{content:attr(data-ocupado);animation:om-rollo-entra .24s var(--ease-in-out) both}
.btn .btn-h{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;pointer-events:none;animation:om-rollo-entra .24s var(--ease-in-out) both}
.btn .btn-h[data-t]::after{content:attr(data-t)}
.btn .btn-h svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.btn.vuelve .btn-h{animation:om-rollo-sale .24s var(--ease-in-out) both}
.btn.trabaja .om-loader.chico svg{display:none}
@keyframes om-rollo-entra{from{opacity:0;transform:translateY(1.25em)}}
@keyframes om-rollo-sale{to{opacity:0;transform:translateY(-1.25em)}}
@keyframes om-desaparece{to{opacity:0}}
@keyframes om-hilo{from{transform:translateX(-100%)}to{transform:translateX(290%)}}
/* Kiosko · fotos que eligió la IA. Cuando la IA leyó todas las bombas solo se ven sus fotos (una por bomba, se recorren de lado)
   y debajo lo que leyó y a qué manguera lo asignó. Ya no se puede escoger otra imagen: solo guardar o grabar el video otra vez. */
.card.ia-lista>.now,.card.ia-lista>.film,.card.ia-lista>.mlist,.card.ia-lista>.otras,.card.ia-lista>.k-manual,.card.ia-lista>.bomba,.card.ia-lista>p.muted,.card.ia-lista>.alert{display:none!important}
.card.ia-lista>.k-video{background:var(--surface);color:var(--fg);border:1.5px solid var(--borde-btn);font-weight:600;font-size:16px;min-height:52px;margin-top:10px}
.card.ia-lista>.hint{font-size:17px;font-weight:600;color:var(--fg);margin:0}
.ia-gal{margin:12px -18px 16px}
.ia-gal.nueva{animation:om-sube .38s var(--ease-out) both}
.ia-tira{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 11%;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.ia-tira::-webkit-scrollbar{display:none}
.ia-tira:focus-visible{outline:3px solid var(--focus-soft);outline-offset:-3px}
.ia-fic{flex:0 0 100%;min-width:0;margin:0;scroll-snap-align:center;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.ia-img{appearance:none;display:block;width:100%;aspect-ratio:4/3;padding:0;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface2);cursor:zoom-in;transition:transform .25s var(--ease-out),filter .25s var(--ease-out),opacity .25s var(--ease-out)}
.ia-img img{display:block;width:100%;height:100%;object-fit:cover}
.ia-img.vacia{display:grid;place-items:center;cursor:default;color:var(--muted);font:600 15px var(--font-body);border-style:dashed}
.ia-fic figcaption{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;max-width:100%;transition:opacity .25s var(--ease-out)}
.ia-num{font:700 34px/1 var(--font-mono);font-stretch:80%;font-variant-numeric:tabular-nums;color:var(--fg);letter-spacing:0}
.ia-que{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;font:500 17px/1.3 var(--font-body);color:var(--fg)}
.ia-tira.vivo .ia-fic:not(.act) .ia-img{transform:scale(.94);filter:grayscale(1);opacity:.5}
.ia-tira.vivo .ia-fic:not(.act) figcaption{opacity:.3}
.ia-pie{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px}
.ia-pie .ia-cta{min-width:74px;text-align:center;font:600 17px var(--font-mono);font-stretch:80%;font-variant-numeric:tabular-nums;color:var(--fg2,var(--fg))}
.ia-pie button{appearance:none;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line2);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;transition:transform .12s var(--ease-out),opacity .15s}
.ia-pie button:active{transform:scale(.95)}
.ia-pie button[disabled]{opacity:.3;cursor:default}
.ia-pie button:focus-visible,.ia-img:focus-visible{outline:3px solid var(--focus-soft);outline-offset:2px}
@media (min-width:761px){ .ia-tira{padding-inline:26%} }
/* 4 · Lista que llega: la forma de los renglones con un brillo lento; luego los datos, uno tras otro */
.om-cargando{flex-direction:column;align-items:center;gap:18px;padding:22px 0}
.om-esq{width:100%;display:flex;flex-direction:column;gap:8px}
.om-esq i{display:block;position:relative;overflow:hidden;height:58px;border-radius:var(--r-sm);border:1px solid var(--line);background:linear-gradient(var(--line),var(--line)) 16px 16px/38% 11px no-repeat,linear-gradient(var(--line),var(--line)) 16px 34px/24% 9px no-repeat,var(--surface)}
.om-esq i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,var(--surface) 50%,transparent 70%);opacity:.75;transform:translateX(-100%);animation:om-barre 1.6s linear infinite}
@keyframes om-barre{to{transform:translateX(100%)}}
.om-main .list>.item,.om-main .list>.lv-cab{animation:om-sube .38s var(--ease-out) both}
.om-main .list>:nth-child(2){animation-delay:.04s} .om-main .list>:nth-child(3){animation-delay:.08s} .om-main .list>:nth-child(4){animation-delay:.12s} .om-main .list>:nth-child(5){animation-delay:.16s} .om-main .list>:nth-child(6){animation-delay:.2s} .om-main .list>:nth-child(n+7){animation-delay:.24s}
/* 5 · Aviso de corte: baja de la franja, en negro, con "Entendido" en lima */
#om-push{top:calc(env(safe-area-inset-top,0px) + 57px);gap:0}
#om-push .f{background:var(--chrome);color:#F4F5F7;border:0;border-radius:0 0 var(--r) var(--r);padding:14px;box-shadow:0 12px 28px rgba(11,15,20,.24);animation:om-baja-aviso .45s var(--ease-out) both}
#om-push .f+.f{margin-top:8px;border-radius:var(--r)}
#om-push .ic{background:transparent;color:var(--lima);width:auto;height:auto}
#om-push .tx b{font-size:16px;font-weight:700} #om-push .tx span{color:#B3BBC6}
#om-push .f .btn{background:transparent;color:#F4F5F7;border-color:#5B6675;min-height:44px}
#om-push .f .btn.ghost{background:var(--lima);color:#0B0F14;border-color:var(--lima);font-weight:700}
@keyframes om-baja-aviso{from{transform:translateY(-105%)}}
/* 6 · Final con sello: se traza el círculo y la palomita, sale una sola onda y las palabras se enfocan. Un segundo, una sola vez. */
.om-loader.fin svg{width:146px;overflow:visible}
.om-loader.fin svg .letras,.om-loader.fin .sw,.om-loader.fin .dz,.om-loader.fin svg path.chispa{display:none}
.om-loader.fin .gt{animation:none;transform:none;opacity:0}
.om-loader .disco{fill:none;stroke:var(--om-sello);stroke-width:28;stroke-linecap:round;stroke-dasharray:1483;stroke-dashoffset:0;transform-box:fill-box;transform-origin:50% 50%;transform:rotate(-90deg)}
.om-loader .onda{fill:none;stroke:var(--om-sello);stroke-width:13;opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.om-loader .chk{fill:none;stroke:var(--om-sello);stroke-width:34;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:314;stroke-dashoffset:0;transform:none;opacity:1}
.om-loader.fin .disco{animation:om-disco .45s var(--ease-out) both}
.om-loader.fin .chk{animation:om-chk2 .25s var(--ease-out) .35s both}
.om-loader.fin .onda{animation:om-onda .75s var(--ease-out) .5s both}
.fin h1{font-size:24px;font-weight:600;margin-top:8px}
.fin h1>span{display:inline-block;animation:om-palabra .4s var(--ease-out) .5s both}
.fin h1>span:nth-child(2){animation-delay:.6s} .fin h1>span:nth-child(3){animation-delay:.7s} .fin h1>span:nth-child(n+4){animation-delay:.8s}
@keyframes om-disco{from{stroke-dashoffset:1483}}
@keyframes om-chk2{from{stroke-dashoffset:314}}
@keyframes om-onda{from{opacity:.55;transform:scale(1)}to{opacity:0;transform:scale(1.6)}}
@keyframes om-palabra{from{opacity:0;filter:blur(4px);transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){
  .om-loader .destello,.om-esq i::after,.btn.trabaja::after{animation:none} .btn.trabaja::after{width:100%}
  .om-loader svg path.chispa{animation:om-late 1.4s ease-in-out infinite alternate}
  .om-loader:not(.chico) .txt{animation:none;background-position:50% 0}
  .om-logo-partes i,.om-entrando .top,.om-entrando .om-main,body[data-om-nav].om-entrando .sidenav,.om-main .list>.item,.om-main .list>.lv-cab,#om-push .f,.fin h1>span,.btn.gira>*,.btn.vuelve>:not(.btn-h),.btn .btn-h{animation-name:om-aparece}
  .btn.gira::before,.btn.trabaja[data-ocupado]:not([data-ocupado=""])>*,.btn.hecho>:not(.btn-h),.btn.vuelve .btn-h{animation-name:om-desaparece}
  .ia-gal.nueva{animation-name:om-aparece} .ia-img,.ia-fic figcaption{transition:none} .ia-tira.vivo .ia-fic:not(.act) .ia-img{transform:none}
  .om-lema .tira,.om-entrando .top::after,.om-loader.fin .disco,.om-loader.fin .chk,.om-loader.fin .onda{animation:none}
  .om-splash.off{transform:none} .btn:active{transform:none}
}

.tabs.est-filtro{display:inline-flex;flex-wrap:wrap;gap:2px;margin-top:10px;padding:4px;background:var(--surface);border:1.5px solid var(--line2);border-radius:var(--r)}

<!-- Librerías servidas desde aquí mismo (no desde CDN): en datos móviles algunos operadores bloquean o tardan con jsdelivr/cdnjs y la app se quedaba en negro. -->
<script src="vendor/supabase-2.49.4.js"></script>
<script src="config.js"></script>
<script src="vendor/jspdf-2.5.1.umd.min.js" defer></script>
<script>
// Si algo impide arrancar (librería que no cargó, error inesperado), que nunca se quede en negro: pantalla con el motivo y Reintentar.

// ---- tiempo en México
function nowMX(){
  if(window.__ahora) return window.__ahora(); // gancho para pruebas
  const p = new Intl.DateTimeFormat('es-MX',{timeZone:TZ,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value;
  const hh = Number(g('hour'))%24;
  return { fecha:`${g('year')}-${g('month')}-${g('day')}`, hora:hh, min:Number(g('minute')), hhmm:`${String(hh).padStart(2,'0')}:${g('minute')}` };
}
function addDays(fecha, d){ const [y,m,dd]=fecha.split('-').map(Number); const t=new Date(Date.UTC(y,m-1,dd+d)); return t.toISOString().slice(0,10); }
const NOMBRE_CAMPO={fecha:'fecha',total:'total',monto:'importe',importe:'importe',ordenante:'quién paga',cuenta_origen:'cuenta de origen',serie:'serie',folio:'folio',referencia:'referencia',concepto:'concepto'};
function chipEditado(cambios, fem){
  const partes=Object.entries(cambios||{}).map(([k,v])=>`${NOMBRE_CAMPO[k]||k}: ${v.de??'—'} → ${v.a??'—'}`);
  return h('span',{class:'chip edit',title:partes.join('\n')||'Datos cambiados a mano'}, fem?'editada':'editado');
}
function fmtFechaLarga(f){ if(!f) return ''; const [y,m,d]=f.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)).toLocaleDateString('es-MX',{timeZone:'UTC',day:'numeric',month:'long',year:'numeric'}); }
function fmtFecha(f){ if(!f) return ''; const [y,m,d]=f.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)).toLocaleDateString('es-MX',{timeZone:'UTC',weekday:'short',day:'numeric',month:'short'}); }
function fmtHora(iso){ if(!iso) return ''; return new Date(iso).toLocaleTimeString('es-MX',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false}); }
const VENTANA_CIERRE_MIN=240; // 4 h después del cierre, el corte sigue siendo de ese turno
const toMin = s => { const [a,b]=s.split(':').map(Number); return a*60+b; };
// Fecha en que EMPEZÓ la ocurrencia más reciente de un turno (si empezó antes de medianoche y ya pasó, fue ayer)
function fechaInicioTurno(tu, t){ const ini=toMin(tu.inicio); const mins=t.hora*60+t.min; return mins>=ini ? t.fecha : addDays(t.fecha,-1); }
// Turnos de día (sin marca de noche), en orden: mañana y tarde.
function turnosDia(){ return (S.config.turnos||[]).filter(t=>!(Number(t.noche)>=1)).sort((a,b)=>toMin(a.inicio)-toMin(b.inicio)); }
// Turnos que se ofrecen según la hora: de día solo mañana y tarde; de 23:00 a 06:59 solo los dos de la noche ("Otros turnos" muestra todos).
function turnosVisibles(){ const t=nowMX(); const m=t.hora*60+t.min; return (hayModoNoche() && (m>=23*60 || m<7*60)) ? turnosNoche() : turnosDia(); }
// Turno preseleccionado para el corte, por reloj (regla de Mauricio, 12-nov-2026):
//   07:00–14:59 → mañana (6–14) · 15:00–22:59 → tarde (14–22) · 23:00–00:59 → noche 22–24 · 01:00–06:59 → noche 00–06.
// En los traslapes gana el turno que está cerrando (el que abre el corte casi siempre es quien termina).
function turnoSugerido(){
  const t=nowMX(); const m=t.hora*60+t.min; const dia=turnosDia(); const [n1,n2]=turnosNoche();
  let tu=null;
  if(hayModoNoche() && (m>=23*60 || m<60)) tu=n1;
  else if(hayModoNoche() && m<7*60) tu=n2;
  else if(m<15*60) tu=dia[0];
  else tu=dia[1]||dia[0];
  if(!tu) return turnoEnCurso();
  return { turno:tu.id, fecha:fechaDeTurno(tu.id) };
}
// Turno que va corriendo ahora mismo (para los depósitos a caja fuerte durante el turno)
function turnoEnCurso(){
  const t=nowMX(); const mins=t.hora*60+t.min;
  for(const tu of S.config.turnos){ const ini=toMin(tu.inicio), fin=toMin(tu.fin);
    if(fin>ini){ if(mins>=ini && mins<fin) return {turno:tu.id, fecha:t.fecha}; }
    else { if(mins>=ini) return {turno:tu.id, fecha:t.fecha}; if(mins<fin) return {turno:tu.id, fecha:addDays(t.fecha,-1)}; } }
  const tu=S.config.turnos[0]; return {turno:tu.id, fecha:fechaInicioTurno(tu,t)};
}
// Fecha para un turno elegido a mano: su ocurrencia más reciente (a mediodía, "Nocturno" es el de anoche)
function fechaDeTurno(turnoId){ const tu=S.config.turnos.find(x=>x.id===turnoId); return fechaInicioTurno(tu, nowMX()); }
window.__omPrueba={ turnoSugerido:()=>turnoSugerido(), turnosVisibles:()=>turnosVisibles() }; // gancho para pruebas (solo lectura)

// Aviso lateral (errores y confirmaciones): aparece a la derecha y se va solo a los 10 s.
function aviso(msg, tipo='err', ms=10000, titulo){ msg=omSinPistas(msg); titulo=omSinPistas(titulo); let c=$('.avisos'); if(!c){ c=h('div',{class:'avisos'}); document.body.append(c); }
  const el=h('div',{class:'aviso '+tipo}, h('div',{class:'tx'}, titulo?h('b',{},titulo):null, msg), h('button',{class:'x','aria-label':'Cerrar',onclick:()=>el.remove()},'×'), h('div',{class:'barra',style:`animation-duration:${ms}ms`}));
  c.append(el); setTimeout(()=>el.remove(), ms); return el; }
function toast(msg, ms=2600){ msg=omSinPistas(msg); let t=$('.toast'); if(t) t.remove(); t=h('div',{class:'toast'},msg); document.body.append(t); clearTimeout(S.toastT); S.toastT=setTimeout(()=>t.remove(),ms); }
async function sha256(str){ const b=new TextEncoder().encode(str); const d=await crypto.subtle.digest('SHA-256',b); return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

// ---- HOME: turno + isla
// ---- TURNO DE NOCHE (velador): dos tramos (22–24 y 00–06), isla nocturna preseleccionada, las demás cerradas solas.
function turnosNoche(){ return (S.config.turnos||[]).filter(t=>Number(t.noche)>=1).sort((a,b)=>Number(a.noche)-Number(b.noche)); }
function hayModoNoche(){ return turnosNoche().length===2; }
// Etiquetas de la noche según el horario de la estación (22–24 / 00–06 en Energéticos; 21–24 / 00–05 en Grupo Pizano).
function etqNoche(){ const [a,b]=turnosNoche(); const hh=(x,fin)=>{ const n=Number(String(x||'').split(':')[0])||0; return (fin&&n===0)?24:n; }; const p=n=>String(n).padStart(2,'0');
  if(!a||!b) return { ini:'22', med:'24', fin:'6', r1:'22–24', r2:'00–06' };
  const i=hh(a.inicio), m=hh(a.fin,true), i2=hh(b.inicio), f=hh(b.fin,true);
  return { ini:String(i), med:String(m), fin:String(f), r1:p(i)+'–'+p(m), r2:p(i2)+'–'+p(f) }; }
// Ventana en la que la pantalla ofrece primero el turno de noche: 23:00 → 07:30 (los turnos de día siguen disponibles abajo).
function esHorarioNoche(){ const t=nowMX(); const m=t.hora*60+t.min; return m>=23*60 || m<7*60+30; } // modo noche (veladores): 23:00–07:30
function esEntradaNoche(){ const t=nowMX(); const m=t.hora*60+t.min; return m>=23*60 || m<7*60; }    // entrada solo con veladores: 23:00–07:00
function cierrePermitido(){ const t=nowMX(); const m=t.hora*60+t.min; return m>=30 && m<7*60+30; }   // el cierre (3 islas) se abre a las 00:30
function veladores(){ return S.desp.filter(d=>d.activo!==false && d.velador); }
function esVelador(){ return !!(S.me && (S.desp.find(d=>d.id===S.me.id)||{}).velador); }
function fechaNoche(){ const t=nowMX(); return t.hora>=12 ? t.fecha : addDays(t.fecha,-1); } // la noche se nombra por el día en que empieza
function islaNocturna(){ return S.config.islas.find(i=>i.id===S.config.islaNocturna) || S.config.islas[0]; }
async function estadoNoche(){
  const [t1,t2]=turnosNoche(); const d1=fechaNoche(), d2=addDays(d1,1);
  const leer=async(fecha,turno)=>{ try{ const rows=await rpc('estado_islas',{p_token:S.token, p_fecha:fecha, p_turno:turno}); return (rows||[]).map(r=>({ id:r.corte_id, isla:r.numero, estado:r.estado, mio:!!r.es_mio, quien:r.despachador||'' })); }catch(e){ return []; } };
  const e1=await leer(d1,t1.id), e2=await leer(d2,t2.id);
  const hecho=x=>x&&(x.estado==='enviado'||x.estado==='omitida');
  const islas=S.config.islas;

  const t2Listo = islas.every(i=>hecho(e2.find(x=>x.isla===i.id)));
  return { t1, t2, d1, d2, e1, e2, t1Listo, t2Listo, tramo: t1Listo? 2 : 1 };

function hechoNoche(x){ return !!(x&&(x.estado==='enviado'||x.estado==='omitida')); }
function ordenNoche(){ const i1=islaNocturna(); return [i1, ...S.config.islas.filter(i=>i.id!==i1.id)]; }

async function nocheAuto(){

    if(ajena){ cargando.remove(); const x=st.e2.find(y=>y.isla===ajena.id); wrap.append(h('div',{class:'card stack',style:'text-align:center'}, h('h2',{},ajena.nombre+' abierta por '+x.quien), h('p',{class:'muted'},'Solo esa persona puede continuarla.'), h('button',{class:'btn primary big block',onclick:salir},'Salir'))); return; }
    const sinFotos=orden.find(i=>!conFotos(st.e2.find(y=>y.isla===i.id)));

// ---- NOCHE EN UN SOLO CORTE (27-nov-2026, Grupo Pizano). El velador despacha de noche en la Isla 1 (gasolinas) y en la Isla 2 (diésel).
//  · Medianoche: graba las islas de la noche (estaciones.islas_noche), una por una; las demás se cierran solas "no se usó".
//  · Cierre (desde las 00:30): graba todas las islas, igual que siempre.
//  · En la computadora, los cortes de ese tramo se UNEN en uno solo (unir_cortes_noche) antes del dinero: los litros de todas las islas

function islasMedianoche(st){ const base=(S.config.islasNoche&&S.config.islasNoche.length)? S.config.islasNoche : [islaNocturna().id];

// Abre (o continúa) el corte de UNA isla en el tramo indicado, sin cerrar ninguna otra.
async function abrirIslaNoche(st, n, isla){

  const id = (x&&x.id)? x.id : await rpc('abrir_corte',{p_token:S.token, p_isla:isla.uuid, p_fecha:fecha, p_turno:turno});

async function nocheUnida(){
  const wrap=h('div',{class:'stack noche'}); app.append(wrap);
  const cargando=h('div',{class:'card'},omLoader({tam:'medio',texto:'Un momento…'})); wrap.append(cargando);
  const st=await estadoNoche(); const i1=islaNocturna();

  const fotosDe=await fotosDeAbiertos([...st.e1,...st.e2], true);
  const conFotos=(x)=>{ if(!x) return false; if(hechoNoche(x)) return true; return !!fotosDe[x.id]; };
  guardarNoche({ fecha:st.d1, islaId:i1.id });
  const salir=()=>{ S.corte=null; S.frames=[]; S.me=null; S.noche=null; go('login'); };
  const texto=(t)=>{ const el=cargando.querySelector('.txt'); if(el) el.textContent=t; };
  const tarjeta=(titulo, sub)=>{ cargando.remove(); wrap.append(h('div',{class:'card stack',style:'text-align:center'}, h('h2',{},titulo), h('p',{class:'muted'},sub), h('button',{class:'btn primary big block',onclick:salir},'Salir'))); };

    const ajena=estados.find(y=>y.estado==='abierto' && !y.mio);
    if(ajena){ const ia=S.config.islas.find(i=>i.id===ajena.isla)||i1; tarjeta(ia.nombre+' abierta por '+ajena.quien, 'Solo esa persona puede continuarla.'); return true; }

      for(const i of S.config.islas){ const y=estados.find(z=>z.isla===i.id); if(islas.some(z=>z.id===i.id) || (y&&y.estado)) continue;
        texto('Cerrando '+i.nombre+'…');
        const idOm=await rpc('registrar_isla_omitida',{p_token:S.token, p_isla:i.uuid, p_fecha:fecha, p_turno:turno, p_motivo:'Bomba cerrada en la noche (sin venta) · tramo '+etqNoche().r1});
        if(y) Object.assign(y,{ id:idOm, estado:'omitida', mio:true }); else estados.push({ id:idOm, isla:i.id, estado:'omitida', mio:true, quien:'' }); } }
    const sinFotos=islas.find(i=>!conFotos(estados.find(y=>y.isla===i.id)));
    if(sinFotos && !esTelefono()){ tarjeta('Falta grabar la '+sinFotos.nombre, n===1? 'La medianoche se graba desde el teléfono; después regresa aquí para el dinero.' : 'Graba las islas desde el teléfono y luego regresa aquí para el dinero.'); return true; }
    if(sinFotos){ texto((n===1?'Medianoche · ':'Cierre · ')+sinFotos.nombre+'…'); await abrirIslaNoche(st, n, sinFotos); return true; }
    const abiertos=estados.filter(y=>y.estado==='abierto' && y.mio);
    if(!abiertos.length) return false;   // todo entregado en este tramo
    if(esTelefono()){ cargando.remove(); wrap.append(pantallaFin({titulo:'Fotos listas', texto: n===1? 'El dinero de la medianoche se captura en la computadora.' : 'Las islas tienen fotos. El dinero se captura en la computadora.', boton:'Listo', onclick:salir})); return true; }
    // Computadora: un solo corte con todo lo grabado; si nada se movió en ninguna isla, se sella solo "sin ventas".
    texto('Juntando las islas en un solo corte…');
    const id=await rpc('unir_cortes_noche',{p_token:S.token, p_fecha:fecha, p_turno:turno});

    if(!st.t2Listo && !cierrePermitido()){ cargando.remove(); wrap.append(pantallaFin({titulo:'Medianoche enviada', texto:'El cierre de la noche se abre a partir de las 00:30.', boton:'Salir', onclick:salir})); return; }
    if(!st.t2Listo && await tramo(2, st.e2, ordenNoche(), st.d2, st.t2.id)) return;

  wrap.append(pantallaFin({titulo:'Noche cerrada', texto:'', boton:'Listo, gracias', onclick:salir, extra: await botonPDFNoche(st)}));

// Para cada corte abierto del velador dice si ya tiene al menos una foto/cuadro de video guardado (mi_corte → lecturas.foto_id).
// `todas`: solo cuenta si TODAS sus bombas tienen foto (noche en un solo corte).
async function fotosDeAbiertos(estados, todas){
  const out={}; const abiertos=(estados||[]).filter(x=>x&&x.estado==='abierto'&&x.mio&&x.id);
  const lista=l=>!!l.foto_id || (l.origen==='manual' && !!l.motivo_cero);
  await Promise.all(abiertos.map(async x=>{ try{ const j=await rpc('mi_corte',{p_token:S.token, p_corte:x.id}); const ls=(j&&j.lecturas)||[]; out[x.id]= todas? (ls.length>0 && ls.every(lista)) : ls.some(l=>l.foto_id); }catch(_){ out[x.id]=false; } }));
  return out;
}
// Intenta sellar una isla de la noche como "sin ventas": si faltan lecturas de la IA las pide aquí (la computadora también puede),
// y el servidor comprueba que todas las mangueras tengan foto, lectura legible de la IA e inicial = final. Devuelve true si quedó sellada.
async function intentarSinVentas(corteId){
  try{ const j=await rpc('mi_corte',{p_token:S.token, p_corte:corteId}); if(!j) return false; const c=corteDesdeServidor(j);
    if(c.estado!=='abierto') return true;
    if(c.lecturas.some(l=>!l.omitida && l.fotoId && l.final==null)) { try{ await leerConIA(c, true); }catch(_){} }
    if(c.lecturas.some(l=>!l.omitida && (l.final==null || l.inicial==null || l.final!==l.inicial))) return false;
    await rpc('cerrar_isla_sin_ventas',{p_token:S.token, p_corte:corteId}); return true; }
  catch(_){ return false; }
}
// Abre (o continúa) el corte de una isla en el tramo indicado. En el tramo 1 cierra las otras islas en cero.
async function empezarTramo(st, tramo, isla){
  const turno = tramo===1? st.t1.id : st.t2.id; const fecha = tramo===1? st.d1 : st.d2;
  const estados = tramo===1? st.e1 : st.e2;
  guardarNoche({ tramo, turno, fecha:st.d1, islaId: islaNocturna().id, activa: isla.id });
  try{
    if(tramo===1){
      for(const i of S.config.islas){ if(i.id===isla.id) continue; const x=estados.find(y=>y.isla===i.id); if(x&&(x.estado==='enviado'||x.estado==='omitida'||x.estado==='abierto')) continue;
        await rpc('registrar_isla_omitida',{p_token:S.token, p_isla:i.uuid, p_fecha:fecha, p_turno:turno, p_motivo:'Bomba cerrada en la noche (sin venta) · tramo '+etqNoche().r1}); }
    }
    const x=estados.find(y=>y.isla===isla.id && y.estado==='abierto');
    const id = x? x.id : await rpc('abrir_corte',{p_token:S.token, p_isla:isla.uuid, p_fecha:fecha, p_turno:turno});
    await cargarCorte(id);
  }catch(e){ fallaNoche(e); }
}
// Si algo falla en la noche automática, nunca se queda la animación girando: mensaje grande, "Salir" y "Reintentar".
function fallaNoche(e){
  const msg=(e&&(e.hint||e.message||e.code))||'Sin conexión';
  const salir=()=>{ S.corte=null; S.frames=[]; S.me=null; S.noche=null; go('login'); };
  const wrap=document.querySelector('.stack.noche')||app; wrap.innerHTML='';
  wrap.append(h('div',{class:'card stack',style:'text-align:center'}, h('h2',{},'No se pudo abrir'), h('p',{class:'muted'},String(msg)),
    h('button',{class:'btn primary big block',onclick:()=>{ if(wrap!==app) wrap.remove(); else app.innerHTML=''; nocheAuto().catch(fallaNoche); }},'Reintentar'), h('button',{class:'btn big block',onclick:salir},'Salir')));
}

// Entrada global de video para encadenar islas con un solo toque ("Ahora graba la Isla 2" abre la cámara y, mientras, carga el corte).

      const f1=await fotosDeAbiertos(st.e1, true); const con1=(x)=>{ if(!x) return false; if(hechoNoche(x)) return true; if(x.id===c.id) return true; return !!f1[x.id]; };

const fmtMXN = n => (Number(n)||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'});
const BILLETES=[1000,500,200,100,50,20]; const MONEDAS=[20,10,5,2,1,0.5];

// ---- DEPÓSITOS A CAJA FUERTE durante el turno (mini arqueo, inmutable una vez registrado)
async function depositosDe(despId, fecha, turno){
  // Fuente de verdad: el servidor (RPC mis_depositos, migración 005). Si no responde, se usa lo recordado en el dispositivo.
  try{
    const rows=await rpc('mis_depositos',{p_token:S.token, p_fecha:fecha, p_turno:turno});
    return (rows||[]).map(r=>{ let den={}; try{ den=JSON.parse(r.nota||'{}'); }catch(e){}
      return { id:r.id, despachadorId:despId, fecha:r.fecha, turno:r.turno, en:r.en, hora:fmtHora(r.en), billetes:den.billetes||{}, monedas:den.monedas||{}, total:Number(r.importe) }; });
  }catch(e){}
  let all=[]; try{ all=JSON.parse(localStorage.getItem('om_depositos')||'[]'); }catch(e){}
  return all.filter(d=>d.despachadorId===despId && d.fecha===fecha && d.turno===turno).sort((a,b)=>a.en<b.en?-1:1);
}
function recordarDeposito(d){ try{ const all=JSON.parse(localStorage.getItem('om_depositos')||'[]'); all.push(d); const corte=Date.now()-3*86400e3; localStorage.setItem('om_depositos', JSON.stringify(all.filter(x=>new Date(x.en).getTime()>corte))); }catch(e){} }
function sumaDenominaciones(deps){ const b={}, m={}; for(const d of deps){ for(const [k,v] of Object.entries(d.billetes||{})) b[k]=(b[k]||0)+(Number(v)||0); for(const [k,v] of Object.entries(d.monedas||{})) m[k]=(m[k]||0)+(Number(v)||0); } return {billetes:b, monedas:m}; }
// Los depósitos a caja fuerte del turno se suman SOLOS a la columna "Depositado" del arqueo, sin botón (pedido de Mauricio, 26-nov-2026:
// el botón "Sumar depósitos nuevos al arqueo" confundía y era un paso de más). Cada depósito se suma una sola vez: d.depositosIds lleva los ya sumados.
// Se llama cada vez que se pinta el paso del dinero, en cualquier sección, para que también entren los que se registraron con el corte ya abierto.
let _depSinc=null;
function sincronizarDepositos(c, d){
  if(_depSinc && _depSinc.d===d) return _depSinc.p;
  const p=(async()=>{ let n=0;
    try{ const deps=await depositosDe(c.despachadorId, c.fecha, c.turno);
      // de aquí en adelante todo es de corrido (sin esperas): dos llamadas seguidas no pueden sumar dos veces el mismo depósito
      d.depositos=deps.map(x=>({id:x.id,hora:x.hora,total:x.total,billetes:x.billetes||{},monedas:x.monedas||{}}));
      const primera=!d.depositosIds; const conocidos=new Set(d.depositosIds||[]); const nuevos=deps.filter(x=>!conocidos.has(x.id));
      if(nuevos.length){ const s=sumaDenominaciones(nuevos);
        for(const [k,v] of Object.entries(s.billetes)) d.efectivo.billetes[k]=(Number(d.efectivo.billetes[k])||0)+v;
        for(const [k,v] of Object.entries(s.monedas)) d.efectivo.monedas[k]=(Number(d.efectivo.monedas[k])||0)+v; }
      d.depositosIds=[...conocidos,...nuevos.map(x=>x.id)]; n=nuevos.length;
      if(n || primera) programarGuardado();
    }catch(e){}
    if(_depSinc && _depSinc.p===p) _depSinc=null;
    return n; })();
  _depSinc={d,p}; return p;
}

function catAceites(){ return (S.config.aceites||[]).filter(a=>a.activo!==false); }
// Venta de aceites: el despachador cuenta las piezas que vendió. Sin inventario.
function calcAceites(c){
  const v=(c.aceites&&c.aceites.vendidas)||{}; const r={lineas:[],piezas:0,importe:0};
  for(const p of catAceites()){
    const n=Number(v[p.id])||0; if(n<=0) continue;
    const imp=Math.round(n*(Number(p.precio)||0)*100)/100;
    r.lineas.push({id:p.id,nombre:p.nombre,precio:Number(p.precio)||0,piezas:n,importe:imp});
    r.piezas+=n; r.importe+=imp;
  }

  return r;
}
function calcVenta(c){
  const precios=(S.config.precios)||{}; const por={}; let importe=0, completo=true;
  for(const l of c.lecturas){ if(l.litros==null) continue; const p=por[l.producto]||(por[l.producto]={litros:0,precio:precios[l.producto]??null,importe:0}); p.litros+=l.litros; }
  for(const [prod,p] of Object.entries(por)){ if(p.precio==null){ completo=false; continue; } p.importe=Math.round(p.litros*p.precio*100)/100; importe+=p.importe; }

function calcDinero(d){
  const _n=(o,k)=>Number(o?.[k])||0;
  const ef = BILLETES.reduce((s,b)=>s+b*(_n(d.efectivo?.billetes,b)+_n(d.efectivo?.extra?.billetes,b)),0)
           + MONEDAS.reduce((s,m)=>s+m*(_n(d.efectivo?.monedas,m)+_n(d.efectivo?.extra?.monedas,m)),0);
  const vouchers=Array.isArray(d.tarjetas)?d.tarjetas:[]; let credito=0, debito=0;
  for(const v of vouchers){ if(v.tipo==='Crédito') credito+=Number(v.importe)||0; else debito+=Number(v.importe)||0; }
  if(!Array.isArray(d.tarjetas)&&d.tarjetas){ credito=Number(d.tarjetas.credito)||0; debito=Number(d.tarjetas.debito)||0; }
  const tarj=Math.round((credito+debito)*100)/100;
  const cli=(d.clientes||[]).reduce((s,x)=>s+(Number(x.importe)||0),0);
  const declarado=Math.round((ef+tarj+cli)*100)/100;
  return {efectivo:Math.round(ef*100)/100, tarjetas:tarj, credito:Math.round(credito*100)/100, debito:Math.round(debito*100)/100, clientes:Math.round(cli*100)/100, declarado};
}

// IA: la función del servidor "leer-medidor" lee cada totalizador desde el almacén y guarda la lectura.
async function leerConIA(c, persistir){
  c=c||S.corte;
  marcarIA('Leyendo los contadores en las fotos…', true);
  const pendientes=c.lecturas.filter(l=>l.fotoId && l.final==null); const total=pendientes.length; let hechas=0;
  const token=S.token;
  for(const l of pendientes){
    { const pg=$('#ia-prog'); if(pg) pg.textContent=`Leyendo totalizador ${l.manguera}… (${hechas+1} de ${total})`; marcarIA(`Leyendo totalizador ${l.manguera}…`, true); }
    try{
      const {data,error}=await sb.functions.invoke('leer-medidor',{ body:{ token, corte_id:c.id, manguera_id:l.mangueraId } });
      if(error) throw error;
      const r=data||{}; const val=(typeof r.valor==='number' && isFinite(r.valor)) ? r.valor : null;
      l.lecturaIA=val; l.legibleIA=!!(r.legible&&val!=null); l.notaIA=r.nota||r.error||'';
      if(l.final==null && val!=null){ l.final=val; l.origen='ia'; }
    }catch(e){ l.lecturaIA=null; l.legibleIA=false; console.warn('leer-medidor', e);
      // Explica el motivo (la función devuelve {error}) para poder corregirlo, en vez de fallar en silencio.
      let det=e&&e.message||String(e); try{ if(e&&e.context&&typeof e.context.json==='function'){ const j=await e.context.json(); if(j&&j.error) det=j.error; } }catch(_){}
      if(!S._iaErrorAvisado){ S._iaErrorAvisado=true; toast('La IA no pudo leer: '+det, 9000); } }
    hechas++;
    if(S.corte&&S.corte.id===c.id&&S.screen==='corte') pintarLecturaFila(l);
  }
  const ld=$('#ia-loader'); if(ld && ld.listo) ld.listo(`Contadores leídos (${hechas} de ${total}). En la computadora solo hay que confirmarlos.`); else { const pg=$('#ia-prog'); if(pg) pg.textContent=`Contadores leídos (${hechas} de ${total}).`; }
  marcarIA('');
}
