name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    name: Compilar y publicar OwnManager.apk
    runs-on: ubuntu-latest
    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Dependencias
        working-directory: android-app
        run: npm ci

      - name: Sincronizar Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Keystore de firma (desde el secreto KEYSTORE_BASE64)
        working-directory: android-app/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Falta el secreto KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          ls -la release.keystore

      - name: Versión
        id: version
        working-directory: android-app/android
        run: |
          VN=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          VC=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"

      - name: Licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK firmado
        working-directory: android-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "Falta el secreto KEYSTORE_PASSWORD"; exit 1; fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../../OwnManager.apk
          ls -la ../../OwnManager.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: OwnManager-apk-v${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: OwnManager.apk

      - name: Release con versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ steps.version.outputs.name }}-${{ github.run_number }}
          name: OwnManager ${{ steps.version.outputs.name }} (compilación ${{ github.run_number }})
          body: |
            APK firmado de OwnManager · Corte.
            versionName ${{ steps.version.outputs.name }} · versionCode ${{ steps.version.outputs.code }}
            Instalación directa en el teléfono (sin Play Store).
          files: OwnManager.apk

      - name: Release fijo "latest-apk" (siempre el último APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: OwnManager · último APK
          body: |
            Último APK compilado: versión ${{ steps.version.outputs.name }}, compilación ${{ github.run_number }}.
            Descarga directa: https://github.com/${{ github.repository }}/releases/download/latest-apk/OwnManager.apk
          files: OwnManager.apk
          make_latest: true
